   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez un moule à cake ou tapissez-le de papier cuisson.","Faites revenir les lardons 5 min à la poêle, sans matière grasse, puis égouttez-les sur du papier absorbant.","Égouttez les olives et coupez-les en deux.","Dans un saladier, battez les œufs. Ajoutez l'huile et le lait, et fouettez.","Ajoutez la farine et la levure, puis mélangez juste assez pour obtenir une pâte homogène. Ne travaillez pas trop, le cake deviendrait élastique.","Incorporez les lardons, les olives et le gruyère à la spatule.","Poivrez généreusement et ne salez pas : lardons, olives et fromage apportent déjà tout le sel.","Versez la pâte dans le moule et lissez le dessus.","Enfournez 45 min. Vérifiez avec la lame d'un couteau plantée au centre : elle doit ressortir sèche.","Laissez tiédir 10 min, démoulez et servez coupé en tranches ou en cubes."]},
  {id:"samoussas",nom:"Samoussas au bœuf",emoji:"🥟",cat:"Apéro",prep:30,cuisson:15,portions:4,diff:"Moyen",
   ing:[{q:12,u:"",n:"feuilles de brick"},{q:400,u:"g",n:"bœuf haché"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à café",n:"curry"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"",n:"bouquet de coriandre"},{q:50,u:"cl",n:"huile de friture"}],
   etapes:["Épluchez et hachez finement l'oignon et l'ail.","Faites-les revenir 4 min dans une poêle avec un filet d'huile.","Ajoutez le bœuf haché, écrasez-le à la cuillère et faites-le dorer 6 min.","Ajoutez le curry et le cumin, salez, et mélangez 1 min.","Laissez refroidir complètement la farce. Chaude, elle percerait les feuilles de brick.","Ajoutez la coriandre ciselée à la farce froide.","Coupez chaque feuille de brick en deux et repliez la partie arrondie pour obtenir une bande droite.","Posez une cuillère de farce en haut de la bande, puis repliez en triangle successivement, d'un bord à l'autre, jusqu'au bout. Collez le dernier rabat avec un peu d'eau.","Faites chauffer l'huile de friture à 170°C et plongez les samoussas par petites quantités, 2 à 3 min, jusqu'à ce qu'ils soient dorés.","Égouttez-les sur du papier absorbant et servez chaud."]},
  {id:"crumble",nom:"Crumble aux pommes",emoji:"🍎",cat:"Dessert",prep:20,cuisson:35,portions:6,diff:"Facile",
   ing:[{q:6,u:"",n:"pommes"},{q:150,u:"g",n:"farine"},{q:100,u:"g",n:"beurre"},{q:100,u:"g",n:"sucre roux"},{q:50,u:"g",n:"poudre d'amandes"},{q:1,u:"c. à café",n:"cannelle"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Sortez le beurre 10 min avant : il doit être mou mais pas fondu.","Épluchez les pommes, retirez le cœur et coupez-les en cubes de 2 cm.","Répartissez-les dans un plat à gratin et saupoudrez de cannelle.","Dans un saladier, mélangez la farine, la poudre d'amandes et le sucre roux.","Ajoutez le beurre en morceaux et travaillez du bout des doigts, sans insister.","Arrêtez dès que le mélange forme des grumeaux irréguliers, de la taille de petits pois. Une pâte lisse donnerait une croûte compacte au lieu d'un crumble sableux.","Répartissez cette pâte sur les pommes, sans tasser.","Enfournez 35 min : le dessus doit être bien doré et les pommes bouillonner sur les bords.","Laissez tiédir 10 min avant de servir : brûlant, le crumble est trop mou.","Servez tiède, avec une boule de glace vanille ou de la crème fraîche."]},
  {id:"farbreton",nom:"Far breton",emoji:"🍮",cat:"Dessert",prep:15,cuisson:45,portions:6,diff:"Facile",
   ing:[{q:150,u:"g",n:"farine"},{q:150,u:"g",n:"sucre"},{q:4,u:"",n:"œufs"},{q:75,u:"cl",n:"lait"},{q:200,u:"g",n:"pruneaux"},{q:30,u:"g",n:"beurre"},{q:1,u:"pincée",n:"vanille"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez généreusement un plat à bords hauts.","Si les pruneaux sont secs, faites-les tremper 15 min dans de l'eau tiède ou du thé, puis égouttez-les.","Dans un saladier, mélangez la farine, le sucre et le sel.","Cassez les œufs au centre et fouettez en partant du milieu, en incorporant la farine petit à petit : c'est ainsi qu'on évite les grumeaux.","Versez le lait progressivement, toujours en fouettant, jusqu'à obtenir une pâte bien lisse et fluide.","Ajoutez la vanille.","Répartissez les pruneaux au fond du plat et versez la pâte par-dessus.","Enfournez 45 min : le far doit être pris, gonflé et bien doré, presque brun par endroits.","Il retombe en refroidissant, c'est normal.","Laissez refroidir complètement et servez tiède ou froid, directement dans le plat."]},
  {id:"sables",nom:"Sablés au beurre",emoji:"🍪",cat:"Dessert",prep:20,cuisson:12,portions:6,diff:"Facile",
   ing:[{q:250,u:"g",n:"farine"},{q:125,u:"g",n:"beurre"},{q:100,u:"g",n:"sucre"},{q:1,u:"",n:"œuf"},{q:1,u:"pincée",n:"vanille"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Sortez le beurre à l'avance pour qu'il soit bien mou.","Dans un saladier, travaillez le beurre mou avec le sucre jusqu'à obtenir une crème claire.","Ajoutez l'œuf et la vanille, puis mélangez.","Ajoutez la farine et le sel, et mélangez juste jusqu'à ce que la pâte se rassemble. Trop travaillée, elle donnerait des sablés durs.","Formez une boule, aplatissez-la, filmez-la et laissez-la reposer 1h au frais. Cette étape est indispensable, sinon la pâte colle et les sablés s'étalent.","Préchauffez le four à 180°C (th. 6).","Étalez la pâte sur 5 mm d'épaisseur entre deux feuilles de papier cuisson.","Découpez des formes à l'emporte-pièce et posez-les sur une plaque avec du papier cuisson.","Enfournez 12 min : les sablés doivent être juste dorés sur les bords et encore pâles au centre.","Laissez-les refroidir sur la plaque 5 min avant de les décoller, ils sont très fragiles à la sortie."]},
  {id:"financiers",nom:"Financiers",emoji:"🥮",cat:"Dessert",prep:15,cuisson:15,portions:6,diff:"Facile",
   ing:[{q:100,u:"g",n:"poudre d'amandes"},{q:100,u:"g",n:"sucre glace"},{q:50,u:"g",n:"farine"},{q:4,u:"",n:"blancs d'œufs"},{q:100,u:"g",n:"beurre"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7) et beurrez des moules à financiers ou des moules en silicone.","Préparez le beurre noisette : faites fondre le beurre dans une petite casserole à feu moyen.","Laissez-le cuire jusqu'à ce qu'il mousse, puis que des points bruns se forment au fond et qu'une odeur de noisette monte. Retirez immédiatement du feu.","Laissez-le tiédir, c'est lui qui donne tout le goût du financier.","Dans un saladier, mélangez la poudre d'amandes, le sucre glace et la farine.","Ajoutez les blancs d'œufs non battus et mélangez au fouet jusqu'à obtenir une pâte lisse.","Versez le beurre noisette tiède en filet, en mélangeant.","Remplissez les moules aux trois quarts.","Enfournez 15 min : les financiers doivent être dorés sur les bords et souples au centre.","Démoulez tièdes et laissez refroidir sur une grille."]},
  {id:"gateauchocolat",nom:"Gâteau au chocolat",emoji:"🍫",cat:"Dessert",prep:20,cuisson:25,portions:8,diff:"Facile",
   ing:[{q:200,u:"g",n:"chocolat noir"},{q:150,u:"g",n:"beurre"},{q:150,u:"g",n:"sucre"},{q:4,u:"",n:"œufs"},{q:60,u:"g",n:"farine"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez et farinez un moule à manqué de 22 cm.","Cassez le chocolat en morceaux et coupez le beurre en dés.","Faites-les fondre ensemble au bain-marie ou au micro-ondes par tranches de 30 secondes, en mélangeant à chaque fois.","Mélangez jusqu'à obtenir une préparation lisse et brillante, puis laissez tiédir 5 min.","Dans un saladier, fouettez les œufs avec le sucre jusqu'à ce que le mélange blanchisse légèrement.","Versez le chocolat fondu tiède sur les œufs en mélangeant. Trop chaud, il cuirait les œufs.","Ajoutez la farine et le sel, et mélangez juste ce qu'il faut pour qu'il n'y ait plus de traces de farine.","Versez dans le moule.","Enfournez 25 min : le tour doit être pris et le centre encore légèrement tremblotant. C'est ce qui garde le gâteau fondant.","Laissez refroidir complètement avant de démouler, il se raffermit en refroidissant."]},
  {id:"ilesflottantes",nom:"Îles flottantes",emoji:"🍥",cat:"Dessert",prep:25,cuisson:20,portions:4,diff:"Moyen",
   ing:[{q:6,u:"",n:"œufs"},{q:1,u:"l",n:"lait"},{q:150,u:"g",n:"sucre"},{q:1,u:"",n:"gousse de vanille"},{q:100,u:"g",n:"sucre pour le caramel"}],
   etapes:["Séparez les blancs des jaunes. Réservez les jaunes pour la crème.","Fendez la gousse de vanille, grattez les graines et mettez tout dans une grande casserole avec le lait. Chauffez sans faire bouillir.","Montez les blancs en neige bien ferme avec une pincée de sel, puis ajoutez 50 g de sucre en continuant de fouetter : ils deviennent brillants et tiennent au fouet.","Prélevez de grosses cuillerées de blancs et posez-les délicatement dans le lait frémissant, sans qu'elles se touchent.","Pochez-les 1 min de chaque côté en les retournant à l'écumoire. Elles gonflent puis se raffermissent.","Égouttez-les sur un torchon propre et réservez-les au frais.","Préparez la crème anglaise : fouettez les jaunes avec 100 g de sucre jusqu'à ce que le mélange blanchisse.","Versez le lait chaud dessus en fouettant, puis remettez le tout dans la casserole à feu doux.","Remuez sans arrêt à la cuillère en bois jusqu'à ce que la crème nappe la cuillère : un trait tracé au doigt doit rester net. Ne laissez jamais bouillir, la crème tournerait.","Faites un caramel avec le sucre restant et un filet d'eau, puis versez la crème froide dans des coupes, posez les blancs dessus et nappez de caramel."]},
  {id:"granola",nom:"Granola maison",emoji:"🥣",cat:"Petit-déj",prep:10,cuisson:30,portions:8,diff:"Facile",
   ing:[{q:300,u:"g",n:"flocons d'avoine"},{q:100,u:"g",n:"amandes"},{q:60,u:"g",n:"miel"},{q:50,u:"g",n:"huile"},{q:50,u:"g",n:"graines de courge"},{q:100,u:"g",n:"raisins secs"},{q:1,u:"c. à café",n:"cannelle"}],

// la recette d'origine exige-t-elle un four ?
function needsOven(r){ const a=AF[r.id]; return !!(a && a.four); }
// réalisable sans four (soit elle n'en a jamais eu besoin, soit une version air fryer existe)
function afOk(r){ const a=AF[r.id]; return !a || !a.ko; }
// version affichée d'une recette selon le mode actif : {cuisson, etapes, af}
function viewOf(r){
  const a = state.airfryer ? AF[r.id] : null;
  if(!a || a.ko) return {cuisson:r.cuisson, etapes:r.etapes, af:null};
  return {
    cuisson: (a.min!=null ? a.min : r.cuisson),
    etapes: a.s ? r.etapes.map((e,i)=> a.s[i]!=null ? a.s[i] : e) : r.etapes,
    af: a
  };
}

/* ---------- utilitaires ---------- */
// les ligatures sont développées avant de retirer les accents, sinon « œufs » se réduit à « ufs »
const norm = s => (s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
// mots qui ne désignent pas le produit lui-même : contenant, mesure, forme.
// Les couleurs n'y figurent pas : elles séparent des produits réellement différents
// (vin blanc / vin rouge), et un frigo « Poivron » couvre déjà « poivron rouge » par inclusion.
const STOP = new Set(["de","d","du","des","la","le","les","a","au","aux","en","c","soupe","cafe","cuillere","cuilleres","g","kg","cl","l","ml","pincee","sachet","poignee","gousse","gousses","tranche","tranches","morceau","boule","boules","cur","coeur","petit","petite","pot","pots","frais","fraiche","fraiches","fondu","rape","rapee","rapes","mur","murs","mure","mures","chinoises","fort","secs","liquide"]);
// singulier approximatif, pour que « oignon » et « oignons » désignent le même produit
const sing = w => w.replace(/(?:eaux|aux|x|s)$/,"");
function keywords(name){
  const all = norm(name).split(" ").filter(w => w.length>2);
  const kw = all.filter(w => !STOP.has(w));
  // si tout a été filtré (« café fort »), on garde les mots bruts plutôt que rien
  return (kw.length ? kw : all).map(sing);
}
function cap(s){ return (s||"").charAt(0).toUpperCase()+(s||"").slice(1); }

/* --- unités & conversions --- */
const UNIT_OPTS = [["","pièce(s)"],["g","g"],["kg","kg"],["ml","ml"],["cl","cl"],["l","l"]];
function unitFactor(u){
  switch(u){
    case "g": return 1; case "kg": return 1000;
    case "ml": return 1; case "cl": return 10; case "l": return 1000;
    case "c. à soupe": return 15; case "c. à café": return 5;
    case "": return 1;
    default: return null;
  }
}
function unitFamily(u){
  if(u==="g"||u==="kg") return "masse";
  if(u==="ml"||u==="cl"||u==="l"||u==="c. à soupe"||u==="c. à café") return "volume";
  if(u==="") return "piece";
  return null;
}
function comparable(u1,u2){ const f=unitFamily(u1); return !!f && f===unitFamily(u2); }
function toBase(q,u){ return q*unitFactor(u); }
function fromBase(b,u){ return b/unitFactor(u); }
function roundNice(x){ return Math.round(x*100)/100; }
function parseQty(v){ v=(v==null?"":v).toString().trim().replace(",","."); if(v==="") return null; const n=parseFloat(v); return isNaN(n)?null:n; }
function fmtNum(q){ q=Math.round(q*100)/100; if(Number.isInteger(q)) return q.toString(); let s=q.toFixed(2).replace(/0+$/,"").replace(/\.$/,""); return s.replace(".",","); }

/* ---------- produits du garde-manger ----------
   Une recette demande parfois une partie ou une forme d'un produit : on achète des œufs,
   pas des jaunes d'œufs, et c'est bien un œuf qu'il faut débiter du frigo.
   À l'inverse, certains noms composés désignent un produit à part entière : avoir du lait
   ne permet pas de faire un curry au lait de coco, ni des pâtes une tarte à la pâte brisée.
   n     -> nom du produit tel qu'on l'achète et qu'on le range (accepte $1 pour un groupe capturé)
   part  -> la recette n'utilise qu'une partie du produit : la liste de courses affiche
            le produit entier, à quantité égale (5 jaunes d'œufs = 5 œufs)             */
const PANTRY = [
  {re:/^(?:jaunes?|blancs?) d[’']?(?:œuf|oeuf)s?$/i,  n:"œufs", n1:"œuf", part:1},
  {re:/^(?:œuf|oeuf)s?$/i,                            n:"œufs"},
  {re:/^beurre fondu$/i,                              n:"beurre"},
  {re:/^bouquet de (.+)$/i,                           n:"$1"},
  {re:/^feuilles? de laurier$/i,                      n:"laurier"},
  {re:/^tranches? de fromage à raclette$/i,           n:"fromage à raclette"},
  /* produits à part entière, à ne pas confondre avec le produit dont ils portent le nom */
  {re:/^pommes? de terre$/i,                          n:"pommes de terre"},
  {re:/^pâte (brisée|sablée|feuilletée|à pizza|à tarte|de curry)$/i, n:"pâte $1"},
  {re:/^lait de coco$/i,                              n:"lait de coco"},
  {re:/^huile d[’']olive$/i,                          n:"huile d'olive"},
  {re:/^tomates? cerises?$/i,                         n:"tomates cerises"},
  {re:/^concentré de tomate$/i,                       n:"concentré de tomate"},
  {re:/^sauce tomate$/i,                              n:"sauce tomate"},
  {re:/^nouilles de riz$/i,                           n:"nouilles de riz"}
];
// {n:nom du produit, strict:le nom est déclaré donc la correspondance doit être exacte, part:…}
function pantryOf(name){
  const n=(name||"").trim();
  for(const p of PANTRY){ if(p.re.test(n)) return {n:n.replace(p.re,p.n), n1:(p.n1?n.replace(p.re,p.n1):null), strict:true, part:!!p.part}; }
  return {n, n1:null, strict:false, part:false};
}
function pantryName(name){ return pantryOf(name).n; }

/* --- correspondance frigo ---
   Un article du frigo couvre un ingrédient si tous ses mots se retrouvent dans celui-ci :
   « Poivron » couvre « poivron rouge », mais « Pommes » ne couvre pas « pommes de terre ».
   Dès qu'un des deux noms est déclaré dans PANTRY, on exige les mêmes mots de part et d'autre. */
function ingKey(name){ return [...keywords(pantryName(name))].sort().join(" "); }
function sameProduct(a, b){
  const pa=pantryOf(a), pb=pantryOf(b);
  const ka=keywords(pa.n), kb=keywords(pb.n);
  if(!ka.length || !kb.length) return false;
  if(pa.strict || pb.strict) return ingKey(a)===ingKey(b);
  return kb.every(w => ka.includes(w));
}
function findFridge(ingName){
  return state.fridge.find(f => sameProduct(ingName, f.n)) || null;
}
// équivalences approximatives des petites mesures vers masse (g) / volume (ml)
const SMALL = { "pincée":{g:0.5,ml:0.5}, "c. à café":{g:5,ml:5}, "c. à soupe":{g:15,ml:15}, "poignée":{g:30,ml:30} };
// quantité requise convertie dans l'unité de base de la famille du frigo (null si non quantifiable)
function neededBase(ing, factor, fu){
  const fam = unitFamily(fu);
  if(!fam) return null;
  const q = (ing.q!=null?ing.q:0)*factor;
  if(q<=0) return 0;
  if(unitFamily(ing.u)===fam) return toBase(q, ing.u);
  const eq = SMALL[ing.u];
  if(eq){
    if(fam==="masse" && eq.g!=null) return q*eq.g;
    if(fam==="volume" && eq.ml!=null) return q*eq.ml;
  }
  return null;
}
// statut d'un ingrédient vis-à-vis du frigo : {s:'have'|'low'|'missing', f, debit, short}
function ingStatus(ing, factor){
  factor = factor||1;
  const f = findFridge(ing.n);
  if(!f) return {s:"missing"};
  if(f.q==null) return {s:"have", f, debit:0};
  const need = neededBase(ing, factor, f.u);
  if(need==null || need<=0) return {s:"have", f, debit:0};
  const fBase = toBase(f.q, f.u);
  if(fBase >= need) return {s:"have", f, debit:need};
  return {s:"low", f, debit:fBase, short:need-fBase};
}
function missingFor(recipe, factor){ return recipe.ing.filter(i => ingStatus(i, factor).s !== "have"); }

/* --- affichage des quantités recette ---
   Une recette mise à l'échelle donne des nombres impossibles en cuisine (66,67 g de beurre).
   On arrondit donc l'affichage à des valeurs qu'une balance ou une cuillère peuvent suivre.
   Seul l'affichage est arrondi : le débit du frigo continue de travailler sur les valeurs exactes. */
const LOOSE = new Set(["pincée","poignée","c. à soupe","c. à café"]);   // mesures approximatives par nature
// renvoie {q,u} : l'unité peut changer, « 350 g » se lit mieux que « 0,35 kg »
function niceQty(q, u){
  if(u==="kg" && q<1){ q*=1000; u="g"; }
  if(u==="l"  && q<1){ q*=100;  u="cl"; }
  if(u==="" || LOOSE.has(u)){                    // pièces et cuillères : par demi-unité
    q = Math.round(q*2)/2;
    return {q: q<0.5 ? 0.5 : q, u};
  }
  // masses et volumes : palier proportionnel à l'ordre de grandeur
  const step = q>=200 ? 10 : q>=50 ? 5 : q>=10 ? 1 : q>=2 ? 0.5 : q>=0.5 ? 0.1 : 0.05;
  const r = Math.round(q/step)*step;
  return {q: r>0 ? Math.round(r*1000)/1000 : step, u};   // jamais zéro
}
function qtyOnly(ing,factor){
  if(ing.q==null) return ing.u||"";
  const n=niceQty(ing.q*factor, ing.u);
  return n.u? fmtNum(n.q)+" "+n.u : fmtNum(n.q);
}

  async get(key){
    try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(key); return r?JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){}
    return _mem[key] ?? null;
  },
  async set(key,val){
    try{ if(window.storage&&window.storage.set){ await window.storage.set(key,JSON.stringify(val)); return; } }catch(e){}
    try{ localStorage.setItem(key,JSON.stringify(val)); return; }catch(e){}

  }
};

/* Bascule la matière du menu quand un aplat sombre passe dessous.
   On ne peut pas lire le fond depuis le CSS : on teste donc le chevauchement
   avec les seuls éléments réellement sombres de l'application. */
const DARK_BEHIND = ".pantry-banner, .act-cook, .cf-yes, .ca.primary, .dhero";
function syncNavMaterial(){
  const nav = document.getElementById("nav");
  if(!nav) return;
  const n = nav.getBoundingClientRect();
  let sombre = false;
  document.querySelectorAll(DARK_BEHIND).forEach(el=>{
    if(sombre) return;
    const r = el.getBoundingClientRect();
    if(r.width && r.height && r.left < n.right && r.right > n.left && r.top < n.bottom && r.bottom > n.top) sombre = true;
  });
  nav.classList.toggle("on-dark", sombre);
}
/* Le défilement déclencherait ce test des centaines de fois par seconde : on le
   limite à un passage toutes les 80 ms, en gardant un appel immédiat pour la
   réactivité et un appel de fin pour ne pas rester sur une position périmée.
   Volontairement sans requestAnimationFrame, que certains contextes suspendent. */
let darkLast = 0, darkTimer = 0;
function queueNavMaterial(){
  const now = Date.now();
  clearTimeout(darkTimer);
  if(now - darkLast > 80){ darkLast = now; syncNavMaterial(); }
  else darkTimer = setTimeout(()=>{ darkLast = Date.now(); syncNavMaterial(); }, 80);
}

/* Déplace la capsule sous l'onglet actif.
   Ses deux bords sont animés à des vitesses différentes : celui qui part devant
   arrive vite, celui qui suit met plus longtemps. Entre les deux, la capsule
   s'allonge puis se resserre — c'est ce décalage qui donne l'aspect liquide,
   plutôt qu'un bloc rigide qui glisse. */
/* Courbes calibrées à la mesure : l'écart entre les deux fait toute l'ampleur de
   l'étirement. Plus creusées, la capsule s'allongeait jusqu'à 271 px pour une cible
   de 120 — elle traversait presque toute la barre. Là, le pic tourne autour de 160 px. */
const THUMB_RAPIDE = "cubic-bezier(.3,.58,.34,1)";   // bord d'attaque : part devant
const THUMB_LENT   = "cubic-bezier(.33,.3,.34,1)";   // bord de fuite : traîne puis rattrape
function moveThumb(animer){
  const nav=document.getElementById("nav");
  const btn=document.querySelector(".nav button.active"), thumb=document.getElementById("navThumb");
  if(!btn||!thumb||!nav) return;
  const gauche = btn.offsetLeft;
  const droite = nav.offsetWidth - (btn.offsetLeft + btn.offsetWidth);
  const avant  = parseFloat(thumb.style.left);

  // premier placement, redimensionnement, chargement des polices : on se pose sans animer
  if(!animer || isNaN(avant)){
    thumb.classList.remove("moving");             // un redimensionnement en plein vol ne doit rien laisser traîner
    thumb.style.transition="none";
    thumb.style.left=gauche+"px"; thumb.style.right=droite+"px";
    void thumb.offsetWidth;                       // force la prise en compte avant de rendre la main
    thumb.style.transition="";
    return;
  }
  if(Math.abs(avant-gauche) < 1) return;          // déjà en place, rien à animer

  const versLaDroite = gauche > avant;
  const rapide = ".44s "+THUMB_RAPIDE, lent = ".50s "+THUMB_LENT;
  thumb.style.transition =
    "left "+(versLaDroite?lent:rapide)+", right "+(versLaDroite?rapide:lent)+
    ", background .28s, box-shadow .28s";
  thumb.style.left=gauche+"px"; thumb.style.right=droite+"px";

  thumb.classList.remove("moving");
  void thumb.offsetWidth;                          // redémarre l'aplatissement à chaque bascule
  thumb.classList.add("moving");
}
// le contenu est enveloppé dans .page : on l'anime sans déplacer la zone de défilement elle-même

}

/* Lien profond : l'adresse porte la recette ouverte, ses portions et le mode air fryer,
   pour qu'un lien partagé ouvre exactement ce que l'expéditeur avait sous les yeux.
   Hors serveur (fichier ouvert en local), l'historique refuse ces adresses : on s'abstient. */
const DEEPLINK = location.protocol==="http:" || location.protocol==="https:";
function recipeUrl(id, portions, af){
  if(!DEEPLINK) return "";
  const r = RECIPES.find(x=>x.id===id);
  let u = location.origin + location.pathname + "?r=" + encodeURIComponent(id);
  if(r && portions && portions!==r.portions) u += "&p=" + portions;
  if(af) u += "&af=1";
  return u;
}
function pushUrl(id){
  if(!DEEPLINK) return;
  try{ history.pushState({r:id}, "", recipeUrl(id, state.currentPortions, state.airfryer)); }catch(e){}
}
function stripUrl(){
  if(!DEEPLINK || !location.search) return;
  try{ history.replaceState({}, "", location.pathname); }catch(e){}
}

function openRecipe(id, fromUrl){
  const r=RECIPES.find(x=>x.id===id);
  if(!r) return;
  currentRecipe=r;
  state.currentPortions=r.portions;
  state.cooked=false;
  state.confirmCook=false;
  renderDetail();
  detailEl.classList.add("open");
  detailEl.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  if(!fromUrl) pushUrl(id);
}
// ferme réellement le panneau, sans toucher à l'historique

  detailEl.classList.remove("open");

  stripUrl();
  doClose();
}

            tick=`<span class="tick low">!</span>`; cls="is-low";
          } else { tick=`<span class="tick need"></span>`; cls="is-need"; }
          return `<li class="${cls}">${tick}<span class="iname">${cap(i.n)}${hint}</span><span class="iqty">${qtyOnly(i,factor)}</span></li>`;
        }).join("")}
      </ul>
      <div class="acts">${actions}</div>
      <div style="height:26px"></div>
      <h4 style="font-family:var(--disp);font-weight:700;font-size:18px;margin:0 0 14px">Préparation${v.af?" <span style=\"font-size:13px;color:#A9700F;font-weight:700\">· air fryer</span>":""}</h4>
      <ol class="steps">${v.etapes.map(e=>`<li><div class="st">${e}</div></li>`).join("")}</ol>
    </div>
  `;
  queueNavMaterial();   // le bouton sombre « j'ai cuisiné » peut arriver sous la pastille
}

/* ---------- actions ---------- */
let uid=1;
function saveFridge(){ Store.set("gabcook_fridge", state.fridge); }
function saveShopping(){ Store.set("gabcook_shopping", state.shopping); }

function addToFridge(n,q,u){
  // on range sous le nom du produit : « jaunes d'œufs » et « gousses d'ail » rejoignent Œufs et Ail
  n=pantryName((n||"").trim()); if(!n) return;
  u=u||"";
  const ex=state.fridge.find(f=>ingKey(f.n)===ingKey(n));
  if(ex){
    if(q==null) return;
    if(ex.q==null){ ex.q=roundNice(q); ex.u=u; }
    else if(comparable(ex.u,u)){ ex.q=roundNice(fromBase(toBase(ex.q,ex.u)+toBase(q,u), ex.u)); }
    else { ex.q=roundNice(q); ex.u=u; }
  } else {
    state.fridge.push({n, q:(q==null?null:roundNice(q)), u});
  }
  saveFridge();
}

function cookRecipe(){
  const r=currentRecipe; if(!r) return;
  const factor=state.currentPortions/r.portions;
  const manque=missingFor(r,factor).length;
  let changed=0;
  r.ing.forEach(ing=>{
    const st=ingStatus(ing,factor);
    if(st.f && st.f.q!=null && st.debit>0){
      const nb=toBase(st.f.q, st.f.u) - st.debit;
      if(nb<=0.0001){ const idx=state.fridge.indexOf(st.f); if(idx>-1) state.fridge.splice(idx,1); }
      else { st.f.q=roundNice(fromBase(nb, st.f.u)); }
      changed++;
    }
  });
  saveFridge();
  state.cooked=true;
  state.confirmCook=false;
  renderDetail();
  updateBadges();
  const reste = manque? " ("+manque+" manquant"+(manque>1?"s":"")+" non débité"+(manque>1?"s":"")+")" : "";
  toast(changed? "🧊 Frigo mis à jour — "+changed+" ingrédient"+(changed>1?"s":"")+" débité"+(changed>1?"s":"")+reste : "✅ Plat réalisé");
}

function addMissingToShopping(){
  const r=currentRecipe; if(!r) return;
  const factor=state.currentPortions/r.portions;
  const targets = state.fridge.length
    ? r.ing.map(i=>({i, st:ingStatus(i,factor)})).filter(x=>x.st.s!=="have")
    : r.ing.map(i=>({i, st:{s:"missing"}}));
  let added=0;
  targets.forEach(({i,st})=>{
    const p=pantryOf(i.n);
    // on achète le produit entier : « 5 jaunes d'œufs » entre dans la liste comme « 5 œufs »
    const nom = n => p.part ? ((p.n1 && Math.abs(n)<=1) ? p.n1 : p.n) : i.n;
    if(state.shopping.some(s=>ingKey(s.base)===ingKey(p.n))) return;
    let q,u,label;
    if(st.s==="low" && st.f){
      const n=niceQty(fromBase(st.short, st.f.u), st.f.u);
      q=n.q; u=n.u; label=(u? fmtNum(q)+" "+u+" "+nom(q) : fmtNum(q)+" "+nom(q));
    } else if(i.q==null){
      q=null; u=i.u||""; label=(i.u? i.u+" "+nom(1) : nom(1));
    } else {
      const n=niceQty(i.q*factor, i.u);
      q=n.q; u=n.u; label=(u? fmtNum(q)+" "+u+" "+nom(q) : fmtNum(q)+" "+nom(q));
    }
    state.shopping.push({id:uid++, label, base:p.n, q, u, from:r.nom, checked:false});
    added++;
  });
  saveShopping(); renderDetail(); updateBadges();
  toast(added? added+" article"+(added>1?"s":"")+" ajouté"+(added>1?"s":"")+" aux courses" : "Déjà dans ta liste");
}

/* ---------- partage ---------- */

async function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  // repli : l'API presse-papier est bloquée hors contexte sécurisé (fichier local, http)
  try{
    const ta=document.createElement("textarea");
    ta.value=t; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta);
    if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
      const rg=document.createRange(); rg.selectNodeContents(ta);
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg);
      ta.setSelectionRange(0, t.length);
    } else { ta.select(); }
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

// on n'envoie que le lien : la recette se lit sur le site, pas dans le message
async function shareRecipe(){
  const r=currentRecipe; if(!r) return;
  const lien=recipeUrl(r.id, state.currentPortions, !!viewOf(r).af);
  if(!lien){ toast("Le lien n'existe que depuis le site en ligne"); return; }
  // 1. feuille de partage du téléphone (SMS, WhatsApp, mail...)
  if(navigator.share){
    try{ await navigator.share({title:r.emoji+" "+r.nom, url:lien}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }   // partage annulé : on n'enchaîne pas
  }
  // 2. presse-papier
  if(await copyText(lien)){ toast("📋 Lien copié — colle-le dans un message"); return; }
  // 3. dernier recours : on affiche le lien, sélectionnable à la main
  showCopyBox(lien);
}
// fenêtre de repli, partagée par le partage de recette et le transfert de frigo
function showCopyBox(lien){
  const box=document.getElementById("shareBox"), ta=document.getElementById("shareText");
  ta.value=lien; box.hidden=false;
  ta.focus(); ta.setSelectionRange(0, lien.length); ta.scrollTop=0;   // présélectionné : une seule copie suffit
}

/* ---------- transfert d'un appareil à l'autre ----------
   Le frigo et les courses tiennent entiers dans le lien : ni serveur, ni compte,
   donc rien qui puisse fermer, expirer ou devenir payant. */
function b64url(s){
  const bytes=new TextEncoder().encode(s);
  let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64url(s){
  const bin=atob(s.replace(/-/g,"+").replace(/_/g,"/"));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
// forme compacte en tableaux : un lien collable dans un message doit rester court
function syncUrl(){
  const data={v:1,
    f: state.fridge.map(x=>[x.n, x.q, x.u]),
    s: state.shopping.map(x=>[x.label, x.base, x.q, x.u, x.from, x.checked?1:0])};
  return location.origin + location.pathname + "?sync=" + b64url(JSON.stringify(data));
}
function readSyncLink(){
  const raw = new URLSearchParams(location.search).get("sync");
  if(!raw) return null;
  try{
    const d = JSON.parse(unb64url(raw));
    if(!d || d.v!==1 || !Array.isArray(d.f) || !Array.isArray(d.s)) return null;
    d.f = d.f.filter(a=>Array.isArray(a) && typeof a[0]==="string" && a[0]).slice(0,300);
    d.s = d.s.filter(a=>Array.isArray(a) && typeof a[0]==="string" && a[0]).slice(0,300);
    return d;
  }catch(e){ return null; }
}

let pendingSync=null;
function askImport(d){
  pendingSync=d;
  const nf=d.f.length, ns=d.s.length;
  document.getElementById("importInfo").textContent =
    "Ce lien contient "+nf+" ingrédient"+(nf>1?"s":"")+" et "+ns+" article"+(ns>1?"s":"")+
    " de courses. Les récupérer remplacera ce qui est enregistré sur cet appareil.";
  document.getElementById("importBox").hidden=false;
}
function applyImport(){
  const d=pendingSync; if(!d) return;
  state.fridge  = d.f.map(a=>({n:a[0], q:(a[1]==null?null:a[1]), u:a[2]||""}));
  state.shopping= d.s.map(a=>({id:uid++, label:a[0], base:a[1]||a[0], q:(a[2]==null?null:a[2]), u:a[3]||"", from:a[4]||"", checked:!!a[5]}));
  saveFridge(); saveShopping();
  pendingSync=null;
  document.getElementById("importBox").hidden=true;
  stripUrl();
  setView("fridge");
  toast("🧊 Frigo et courses récupérés sur cet appareil");
}

async function shareSync(){
  if(!DEEPLINK){ toast("Disponible depuis le site en ligne, pas en fichier local"); return; }
  if(!state.fridge.length && !state.shopping.length){ toast("Rien à transférer pour le moment"); return; }
  const url=syncUrl();
  if(url.length>7000){ toast("Liste trop longue pour tenir dans un lien"); return; }
  const texte="🧊 Mon frigo GabCook\nOuvre ce lien sur l'autre appareil pour y récupérer le frigo et la liste de courses :\n"+url;
  if(navigator.share){
    try{ await navigator.share({title:"Mon frigo GabCook", text:texte}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  if(await copyText(url)){ toast("📋 Lien copié — ouvre-le sur l'autre appareil"); return; }
  showCopyBox(url);
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2100);
}

/* ---------- événements ---------- */
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]");
  if(!b) return;
  // la pastille reste au-dessus d'une recette ouverte : on la referme avant de changer d'onglet.
  // Fermeture directe et non via l'historique, dont le retour asynchrone effacerait l'animation de page.
  if(detailEl.classList.contains("open")){ stripUrl(); doClose(); }
  setView(b.dataset.view);
});
document.getElementById("importBox").addEventListener("click",e=>{
  if(e.target.closest("#importYes")){ applyImport(); return; }
  if(e.target.closest("#importNo") || e.target.id==="importBox"){
    pendingSync=null; document.getElementById("importBox").hidden=true; stripUrl();
  }
});
document.getElementById("shareBox").addEventListener("click",e=>{
  // fermeture par le bouton ou en touchant le fond, mais pas en sélectionnant le texte
  if(e.target.closest("#shareClose") || e.target.id==="shareBox") document.getElementById("shareBox").hidden=true;
});

scrollEl.addEventListener("scroll", queueNavMaterial, {passive:true});
detailScroll.addEventListener("scroll", queueNavMaterial, {passive:true});
// selon le contexte, c'est la fenêtre et non le conteneur interne qui défile
addEventListener("scroll", queueNavMaterial, {passive:true});
addEventListener("resize", ()=>{ moveThumb(false); queueNavMaterial(); });
// la largeur des libellés change quand la police s'est chargée
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>moveThumb(false));
document.getElementById("search").addEventListener("input",e=>{
  state.search=e.target.value;
  if(state.view==="home") renderHome();
});
const quick=document.getElementById("quickpick");
RECIPES.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).forEach(r=>{
  const o=document.createElement("option");
  o.value=r.id; o.textContent=r.emoji+"  "+r.nom;
  quick.appendChild(o);
});
quick.addEventListener("change",e=>{ if(e.target.value){ openRecipe(e.target.value); e.target.value=""; } });

scrollEl.addEventListener("click",e=>{
  const card=e.target.closest("[data-recipe]");
  if(card){ openRecipe(card.dataset.recipe); return; }
  const cat=e.target.closest("[data-cat]");
  if(cat){ state.filter=cat.dataset.cat; state.onlyCookable=false; renderHome(); return; }
  const cook=e.target.closest("[data-cook]");
  if(cook){ state.onlyCookable=!state.onlyCookable; renderHome(); return; }
  const fry=e.target.closest("[data-fryer]");
  if(fry){
    state.airfryer=!state.airfryer;
    Store.set("gabcook_airfryer", state.airfryer);
    renderHome();
    toast(state.airfryer? "🍟 Recettes adaptées à l'air fryer" : "Retour aux recettes classiques");
    return;
  }
  const delF=e.target.closest("[data-del-fridge]");
  if(delF){ state.fridge.splice(+delF.dataset.delFridge,1); saveFridge(); renderFridge(); updateBadges(); return; }
  const quickAdd=e.target.closest("[data-quick]");
  if(quickAdd){ const c=COMMON[+quickAdd.dataset.quick]; if(c){ addToFridge(c.n,c.q,c.u); renderFridge(); updateBadges(); } return; }
  if(e.target.closest("#fAdd")){
    const name=document.getElementById("fInput").value;
    const q=parseQty(document.getElementById("fQty").value);
    const u=document.getElementById("fUnit").value;
    if(name.trim()){ addToFridge(name,q,u); renderFridge(); updateBadges(); }
    return;
  }
  if(e.target.closest("#shopAdd")){
    const inp=document.getElementById("shopInput"); const v=inp.value.trim();
    if(v && !state.shopping.some(s=>norm(s.base)===norm(v))){ state.shopping.push({id:uid++,label:v,base:v,q:null,u:"",from:"",checked:false}); saveShopping(); }
    inp.value=""; renderShopping(); updateBadges(); return;
  }
  const tog=e.target.closest("[data-toggle]");
  if(tog){ const s=state.shopping.find(x=>x.id==tog.dataset.toggle); if(s){ s.checked=!s.checked; saveShopping(); renderShopping(); updateBadges(); } return; }
  const delS=e.target.closest("[data-del-shop]");
  if(delS){ state.shopping=state.shopping.filter(x=>x.id!=delS.dataset.delShop); saveShopping(); renderShopping(); updateBadges(); return; }
  if(e.target.closest("#stockBtn")){
    const bought=state.shopping.filter(s=>s.checked);
    bought.forEach(s=>addToFridge(s.base, s.q, s.u));
    state.shopping=state.shopping.filter(s=>!s.checked);
    saveShopping(); renderShopping(); updateBadges();
    toast(bought.length+" article"+(bought.length>1?"s":"")+" rangé"+(bought.length>1?"s":"")+" au frigo"); return;
  }
  if(e.target.closest("#clearBtn")){ state.shopping=[]; saveShopping(); renderShopping(); updateBadges(); return; }
  if(e.target.closest("#syncOut")){ shareSync(); return; }
});

scrollEl.addEventListener("change",e=>{
  const q=e.target.closest("[data-fi-qty]");
  if(q){ const i=+q.dataset.fiQty; if(state.fridge[i]){ state.fridge[i].q=parseQty(q.value); saveFridge(); } return; }
  const u=e.target.closest("[data-fi-unit]");
  if(u){ const i=+u.dataset.fiUnit; if(state.fridge[i]){ state.fridge[i].u=u.value; saveFridge(); } return; }
});

scrollEl.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(e.target.id==="fInput" || e.target.id==="fQty"){
    const name=document.getElementById("fInput").value;
    const qv=parseQty(document.getElementById("fQty").value);
    const u=document.getElementById("fUnit").value;
    if(name.trim()){ addToFridge(name,qv,u); renderFridge(); updateBadges(); }
  }
  if(e.target.id==="shopInput"){
    const v=e.target.value.trim();
    if(v && !state.shopping.some(s=>norm(s.base)===norm(v))){ state.shopping.push({id:uid++,label:v,base:v,q:null,u:"",from:"",checked:false}); saveShopping(); }
    e.target.value=""; renderShopping(); updateBadges();
  }
});

detailScroll.addEventListener("click",e=>{
  if(e.target.closest("#backBtn")){ closeRecipe(); return; }
  if(e.target.closest("#shareBtn")){ shareRecipe(); return; }
  if(e.target.closest("#cookBtn")){
    // débiter le frigo n'a de sens que si on avait vraiment tout : sinon on demande confirmation
    const r=currentRecipe;
    if(r && missingFor(r, state.currentPortions/r.portions).length){ state.confirmCook=true; renderDetail(); }
    else cookRecipe();
    return;
  }
  if(e.target.closest("#cancelCook")){ state.confirmCook=false; renderDetail(); return; }
  if(e.target.closest("#forceCook")){ cookRecipe(); return; }
  if(e.target.closest("#addMissing")){ addMissingToShopping(); return; }
  if(e.target.closest("#pMinus")){ if(state.currentPortions>1){ state.currentPortions--; state.confirmCook=false; renderDetail(); } return; }
  if(e.target.closest("#pPlus")){ state.currentPortions++; state.confirmCook=false; renderDetail(); return; }
});

/* ---------- manifeste (icône écran d'accueil) ----------
   Le manifeste est fabriqué à la volée, donc servi depuis une adresse blob:.
   Les chemins relatifs s'y résoudraient contre le blob et ne mèneraient nulle part :
   start_url et scope doivent donc être absolus. Le scope indique aussi à Android
   quelles adresses appartiennent à l'application une fois installée. */
try{
  const base = location.origin + location.pathname;
  const manifest={name:"GabCook",short_name:"GabCook",
    start_url: base,
    scope: base.replace(/[^/]*$/,""),
    display:"standalone",background_color:"#F7F5F1",theme_color:"#2B2A28",
    icons:[{src:LOGO,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
  const l=document.createElement("link"); l.rel="manifest"; l.href=URL.createObjectURL(blob); document.head.appendChild(l);
}catch(e){}

/* ---------- init ---------- */
(async function init(){
  const f=await Store.get("gabcook_fridge");
  const s=await Store.get("gabcook_shopping");
  state.airfryer = (await Store.get("gabcook_airfryer")) === true;
  if(Array.isArray(f)){
    state.fridge = f.map(x => (typeof x==="string") ? {n:x, q:null, u:""} : {n:x.n, q:(x.q===undefined?null:x.q), u:(x.u||"")});
  }
  if(Array.isArray(s)){
    state.shopping = s.map(x => ({id:x.id, label:x.label, base:x.base, q:(x.q===undefined?null:x.q), u:(x.u||""), from:x.from||"", checked:!!x.checked}));
    uid=(state.shopping.reduce((m,x)=>Math.max(m,x.id||0),0))+1;
  }
  render();
  moveThumb(false);

  // lien de transfert reçu depuis un autre appareil : ?sync=...
  const recu = readSyncLink();
  if(recu){ askImport(recu); return; }

  // ouverture depuis un lien partagé : ?r=recette&p=portions&af=1
  const q = new URLSearchParams(location.search);
  const rid = q.get("r");
  if(rid && RECIPES.some(x=>x.id===rid)){
    // le mode air fryer du lien vaut pour cette visite seulement, il n'écrase pas le réglage enregistré
    if(q.get("af")==="1") state.airfryer=true;
    openRecipe(rid, true);
    const p = parseInt(q.get("p"),10);
    if(p>0 && p<=50){ state.currentPortions=p; renderDetail(); }
  }
})();
</script>
