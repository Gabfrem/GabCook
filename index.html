<style>
  :root{
    --paper:#F7F5F1;
    --card:#FFFFFF;
    --ink:#2B2A28;
    --muted:#8B8175;
    --line:#EAE3D8;
    --camel:#BEA088;
    --camel-deep:#9C7C5C;
    --camel-tint:#F2EBE1;
    --camel-light:#D9C1A3;
    --basil:#3F7D4E;
    --basil-tint:#E7F1E7;
    --tomato:#C7462F;
    --tomato-tint:#FBEAE5;
    --shadow:0 6px 22px rgba(43,42,40,.09);
    --shadow-soft:0 2px 10px rgba(43,42,40,.06);
    --r:16px;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --disp:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:#E7E1D7;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  .app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.12)}
  .scroll{flex:1;overflow-x:hidden;overflow-y:auto;padding:0 18px calc(100px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--paper) 72%,rgba(247,245,241,0));padding:calc(16px + env(safe-area-inset-top)) 18px 10px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo-mark{width:44px;height:44px;border-radius:11px;object-fit:contain;background:#fff;box-shadow:var(--shadow-soft);flex:0 0 auto;border:1px solid var(--line)}
  .brand-txt{display:flex;flex-direction:column;line-height:1.05}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0}
  .brand .ck{color:var(--camel-deep)}
  .brand .tag{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}

  .search{position:relative;margin-top:14px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;padding:13px 14px 13px 42px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-size:15px;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}
  .search input:focus{border-color:var(--camel);box-shadow:0 0 0 3px var(--camel-tint)}
  .search input::placeholder{color:#B4A992}

  .quickpick{margin-top:10px;position:relative}
  .quickpick select{-webkit-appearance:none;appearance:none;width:100%;padding:12px 40px 12px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-size:14.5px;color:var(--ink);font-weight:500;outline:none;cursor:pointer}
  .quickpick select:focus{border-color:var(--camel)}
  .quickpick .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}

  /* ---- navigation en pastille segmentée, matière « liquid glass » ----
     Le verre doit surtout être TRANSPARENT : le fond traverse, il est seulement
     dévié. On teinte donc très peu (10 % de blanc) et on compte sur trois choses :
     la saturation poussée, qui ravive les couleurs vues au travers ;
     un gain de luminosité, qui éclaircit ce qui passe derrière pour garder les
     libellés lisibles ; et surtout des ombres internes décalées en diagonale,
     qui imitent la compression de l'image contre la paroi épaisse du verre. */
  .nav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:70;
       display:flex;padding:7px;border-radius:999px;isolation:isolate;
       background:rgba(255,255,255,.07);
       backdrop-filter:blur(9px) saturate(210%) brightness(1.09);
       -webkit-backdrop-filter:blur(9px) saturate(210%) brightness(1.09);
       box-shadow:
         inset 2px 3px 4px -2.5px rgba(255,255,255,1),      /* paroi haut-gauche : l'image s'y comprime */
         inset -2px -3px 4px -2.5px rgba(255,255,255,.85),  /* paroi bas-droite */
         inset 0 0 18px -5px rgba(255,255,255,.5),          /* halo interne, épaisseur du verre */
         0 0 0 .5px rgba(255,255,255,.5),                   /* liseré extérieur */
         0 12px 30px rgba(43,42,40,.18),                    /* ombre portée */
         0 3px 10px rgba(43,42,40,.10)}
  /* Anneau réfractif : un second flou, plus faible et plus saturé, limité au pourtour
     par un masque en anneau. C'est lui qui décale l'image juste au bord et donne
     l'impression que le fond se courbe en traversant l'épaisseur du verre. */
  .nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
       border:7px solid transparent;
       backdrop-filter:blur(2px) saturate(230%) brightness(1.16);
       -webkit-backdrop-filter:blur(2px) saturate(230%) brightness(1.16);
       -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
       -webkit-mask-composite:xor;
       mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
       mask-composite:exclude}
  /* reflet spéculaire en diagonale, par-dessus tout, sans gêner les clics */
  .nav::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
       background:linear-gradient(128deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.05) 28%,
                  rgba(255,255,255,0) 55%, rgba(255,255,255,.08) 76%, rgba(255,255,255,.38) 100%)}
  /* Capsule de l'onglet actif : une lentille TEINTÉE à la couleur d'accent, avec son
     halo, plutôt qu'un simple verre plus clair. C'est elle qui dit où l'on se trouve,
     donc elle doit se voir sans ambiguïté même posée sur un fond crème. */
  /* La capsule est posée par ses deux bords plutôt que par une largeur : c'est ce qui
     permet de les animer séparément et de l'étirer en chemin (voir moveThumb). */
  .nav .thumb{position:absolute;top:7px;bottom:7px;left:0;right:100%;border-radius:999px;z-index:0;
       background:linear-gradient(180deg, rgba(214,186,158,.72), rgba(190,160,136,.52));
       box-shadow:
         inset 0 1px 0 rgba(255,255,255,.9),        /* arête éclairée du dessus */
         inset 0 0 0 .5px rgba(255,255,255,.5),     /* liseré de la lentille */
         0 0 11px 1px rgba(176,140,108,.5),         /* halo coloré autour de la capsule */
         0 1px 4px rgba(43,42,40,.12)}
  /* Aplatissement à l'élan puis retour : la matière se comporte comme une goutte
     qui s'écrase en accélérant et retrouve son volume en se posant. */
  @keyframes thumbSquash{
    0%{transform:scaleY(1)}
    30%{transform:scaleY(.90)}
    64%{transform:scaleY(1.035)}
    100%{transform:scaleY(1)}
  }
  .nav .thumb.moving{animation:thumbSquash .5s cubic-bezier(.34,.9,.3,1)}
  .nav button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:11px;
       padding:9px 15px;border-radius:999px;color:rgba(43,42,40,.70);
       font-size:12px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;white-space:nowrap;
       transition:color .3s}
  /* brun profond plutôt que le camel clair : sur sa propre capsule teintée,
     le camel n'aurait pas assez de contraste pour du texte de 12 px */
  .nav button.active{color:#6E5133}

  /* ---- verre adaptatif ----
     Un verre clair posé sur un aplat sombre devient illisible : les libellés
     disparaissent. iOS résout ça en changeant la matière selon le fond ; le CSS
     ne sait pas lire ce qu'il y a derrière, alors c'est le script qui pose
     .on-dark quand un élément sombre connu passe sous la pastille.
     Le verre reste translucide : ce sont les encres qui s'inversent. */
  .nav,.nav button,.nav .thumb{transition:background .28s, box-shadow .28s, color .28s}
  .nav.on-dark{background:rgba(255,255,255,.13);
       box-shadow:
         inset 2px 3px 4px -2.5px rgba(255,255,255,.65),
         inset -2px -3px 4px -2.5px rgba(255,255,255,.45),
         inset 0 0 18px -5px rgba(255,255,255,.3),
         0 0 0 .5px rgba(255,255,255,.3),
         0 12px 30px rgba(0,0,0,.35),
         0 3px 10px rgba(0,0,0,.22)}
  .nav.on-dark button{color:rgba(255,255,255,.78)}
  /* la capsule reste claire : c'est son encre qui redevient sombre, comme sur iOS */
  .nav.on-dark .thumb{background:linear-gradient(180deg, rgba(230,207,183,.88), rgba(206,178,150,.72));
       box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 .5px rgba(255,255,255,.5),
                  0 0 12px 1px rgba(190,160,136,.35), 0 1px 4px rgba(0,0,0,.25)}
  .nav.on-dark button.active{color:#3F2E19}
  .nav.on-dark .navbadge{box-shadow:0 0 0 2px rgba(32,30,28,.9)}
  .nav button .ni{position:relative;display:flex}
  .nav button svg{width:17px;height:17px}
  .nav .navbadge{position:absolute;top:-7px;right:-8px;min-width:14px;height:14px;padding:0 3.5px;background:var(--tomato);color:#fff;border-radius:999px;font-size:9px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  /* sans flou d'arrière-plan, le verre deviendrait illisible : on retombe sur un fond plein */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .nav{background:rgba(252,250,247,.97)}
  }

  @keyframes pageIn{from{opacity:0;transform:translateX(var(--slide,22px))}to{opacity:1;transform:translateX(0)}}

  .finame{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fiqty{width:54px;flex:0 0 54px;padding:8px 4px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;text-align:center;outline:none;font-weight:600}

  .confirm .cf-s b{font-weight:700}
  .cf-row{display:flex;gap:8px;margin-top:13px}
  .cf-row .act{flex:1;padding:13px;font-size:14px}

  .chip.fryer.active{background:#C0840F;border-color:#C0840F;color:#fff}
  .badge.af{background:#FBEFD6;color:#A9700F}

  .afbox .aft{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:700;font-size:15px;color:#8A5C0C;margin-bottom:5px}
  .afbox .afs{font-size:13.5px;color:#8A5C0C;line-height:1.5}
  .afbox .afs b{font-weight:700}
  .afbox.ko{background:#FBEAE5;border-color:#EBC3B8}
  .afbox.ko .aft,.afbox.ko .afs{color:#A33520}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2.5px solid var(--camel);outline-offset:2px;border-radius:6px}
</style>

const RECIPES = [
  {id:"carbonara",nom:"Pâtes à la carbonara",emoji:"🍝",cat:"Plat",prep:10,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"spaghetti"},{q:200,u:"g",n:"lardons"},{q:4,u:"",n:"œufs"},{q:100,u:"g",n:"parmesan"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"poivre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Sortez les œufs et le parmesan à l'avance. Râpez le parmesan finement si ce n'est pas déjà fait.","Remplissez une grande casserole d'eau, salez généreusement (l'eau doit être bien salée) et portez à ébullition à feu vif.","Pendant que l'eau chauffe, épluchez et écrasez les gousses d'ail d'un coup de plat de couteau (inutile de les hacher).","Cassez les œufs dans un bol, ajoutez le parmesan râpé et beaucoup de poivre. Mélangez à la fourchette : vous obtenez une crème épaisse. Réservez.","Quand l'eau bout, plongez les spaghetti et laissez cuire le temps indiqué sur le paquet (goûtez 1 min avant la fin : ils doivent être tendres mais encore un peu fermes).","Pendant ce temps, faites chauffer une grande poêle à feu moyen. Ajoutez les lardons et l'ail écrasé, sans matière grasse : les lardons rendent leur gras. Laissez dorer 5 min, puis retirez l'ail.","Juste avant d'égoutter les pâtes, prélevez un grand bol d'eau de cuisson : elle servira à lier la sauce.","Égouttez les pâtes et versez-les tout de suite dans la poêle avec les lardons. Coupez le feu : c'est essentiel, sinon les œufs vont cuire comme une omelette.","Attendez 30 secondes que ça refroidisse un peu, puis versez la crème d'œufs et mélangez vivement. Ajoutez un peu d'eau de cuisson chaude pour rendre la sauce lisse et nappante.","Servez immédiatement, avec un tour de moulin à poivre et un peu de parmesan."]},
  {id:"bolognaise",nom:"Spaghetti bolognaise",emoji:"🍝",cat:"Plat",prep:15,cuisson:40,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"spaghetti"},{q:500,u:"g",n:"bœuf haché"},{q:400,u:"g",n:"tomates concassées"},{q:2,u:"",n:"oignons"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"carotte"},{q:2,u:"c. à soupe",n:"concentré de tomate"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"origan"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez et hachez finement les oignons et l'ail. Épluchez la carotte et coupez-la en tout petits dés.","Faites chauffer l'huile d'olive dans une grande casserole ou sauteuse à feu moyen.","Ajoutez les oignons, l'ail et la carotte. Faites revenir 5 min en remuant, jusqu'à ce que les oignons deviennent translucides et tendres.","Ajoutez la viande hachée. Écrasez-la et détachez-la avec une cuillère en bois pour éviter les gros morceaux.","Laissez la viande dorer 5 à 7 min : elle doit perdre sa couleur rosée et commencer à colorer.","Ajoutez le concentré de tomate et mélangez 1 min (cela enlève son goût acide).","Versez les tomates concassées et l'origan. Salez, poivrez et mélangez.","Baissez le feu au minimum, couvrez et laissez mijoter au moins 30 min en remuant de temps en temps. Plus ça mijote, meilleur c'est.","Pendant les 10 dernières minutes, faites cuire les spaghetti dans une grande casserole d'eau bouillante bien salée.","Goûtez la sauce et rectifiez le sel. Égouttez les pâtes et servez-les nappées de sauce, avec du parmesan râpé."]},
  {id:"quiche",nom:"Quiche lorraine",emoji:"🥧",cat:"Plat",prep:15,cuisson:35,portions:6,diff:"Facile",
   ing:[{q:1,u:"",n:"pâte brisée"},{q:200,u:"g",n:"lardons"},{q:3,u:"",n:"œufs"},{q:20,u:"cl",n:"crème fraîche"},{q:20,u:"cl",n:"lait"},{q:100,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"muscade"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Sortez la pâte du frigo 10 min avant pour qu'elle soit plus facile à manipuler. Préchauffez le four à 200°C (th. 6-7).","Déroulez la pâte dans un moule à tarte avec son papier cuisson. Piquez le fond avec une fourchette (cela l'empêche de gonfler).","Faites chauffer une poêle à feu moyen et faites-y dorer les lardons 5 min, sans matière grasse. Égouttez-les sur du papier absorbant.","Répartissez les lardons sur le fond de pâte.","Dans un saladier, cassez les œufs. Ajoutez la crème, le lait, une pincée de muscade et du poivre.","Battez le tout au fouet jusqu'à obtenir un mélange homogène. Salez très peu : les lardons et le gruyère sont déjà salés.","Versez ce mélange sur les lardons, puis parsemez de gruyère râpé.","Enfournez 30 à 35 min. La quiche est prête quand elle est dorée et que le centre ne tremble plus quand vous bougez le moule.","Laissez tiédir 5 min avant de couper : elle se tiendra mieux. Servez avec une salade verte."]},
  {id:"ratatouille",nom:"Ratatouille",emoji:"🍆",cat:"Plat",prep:20,cuisson:45,portions:4,diff:"Facile",
   ing:[{q:1,u:"",n:"aubergine"},{q:2,u:"",n:"courgettes"},{q:1,u:"",n:"poivron rouge"},{q:1,u:"",n:"poivron jaune"},{q:4,u:"",n:"tomates"},{q:2,u:"",n:"oignons"},{q:3,u:"",n:"gousses d'ail"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"herbes de Provence"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Lavez tous les légumes. Coupez l'aubergine, les courgettes, les poivrons et les tomates en dés d'environ 2 cm (des morceaux réguliers cuisent uniformément).","Épluchez et émincez les oignons. Épluchez et hachez l'ail.","Faites chauffer l'huile d'olive dans une grande cocotte à feu moyen.","Ajoutez les oignons et l'ail, faites revenir 5 min jusqu'à ce qu'ils soient tendres.","Ajoutez les poivrons et laissez cuire 5 min en remuant.","Ajoutez l'aubergine et les courgettes. Faites-les colorer légèrement 5 min (l'aubergine boit l'huile, c'est normal).","Ajoutez les tomates et les herbes de Provence. Salez et poivrez.","Baissez le feu, couvrez et laissez mijoter 40 min en remuant de temps en temps. Les légumes doivent être fondants.","Si c'est trop liquide, retirez le couvercle 10 min avant la fin pour laisser l'eau s'évaporer.","Goûtez, rectifiez l'assaisonnement, et servez chaud, tiède ou froid."]},
  {id:"bourguignon",nom:"Bœuf bourguignon",emoji:"🥩",cat:"Plat",prep:30,cuisson:180,portions:6,diff:"Moyen",
   ing:[{q:1.2,u:"kg",n:"bœuf à braiser"},{q:200,u:"g",n:"lardons"},{q:75,u:"cl",n:"vin rouge"},{q:3,u:"",n:"carottes"},{q:2,u:"",n:"oignons"},{q:250,u:"g",n:"champignons de Paris"},{q:2,u:"c. à soupe",n:"farine"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"bouquet garni"},{q:2,u:"c. à soupe",n:"huile"}],
   etapes:["Sortez la viande 30 min avant pour qu'elle ne soit pas glacée. Coupez-la en gros cubes de 4-5 cm et séchez-les avec du papier absorbant (cela aide à bien les colorer).","Épluchez les carottes et coupez-les en rondelles épaisses. Épluchez et émincez les oignons. Épluchez et écrasez l'ail.","Faites chauffer l'huile dans une grande cocotte à feu vif. Faites dorer les cubes de viande sur toutes les faces, en plusieurs fois pour ne pas surcharger (sinon elle bout au lieu de dorer). Réservez la viande.","Dans la même cocotte, faites revenir les lardons, les oignons et les carottes 5 min.","Remettez la viande, saupoudrez de farine et mélangez 2 min : la farine va épaissir la sauce.","Versez le vin rouge : il doit presque recouvrir la viande. Ajoutez l'ail et le bouquet garni. Salez et poivrez.","Portez à petite ébullition, puis baissez le feu au minimum et couvrez.","Laissez mijoter très doucement 2h30 à 3h en remuant de temps en temps. La viande doit devenir fondante et se défaire facilement.","Pendant ce temps, nettoyez et émincez les champignons. Ajoutez-les 30 min avant la fin.","En fin de cuisson, goûtez la sauce : elle doit être onctueuse. Si elle est trop liquide, laissez réduire à découvert quelques minutes.","Retirez le bouquet garni. Servez bien chaud avec des pommes de terre vapeur, des pâtes ou du riz."]},
  {id:"gratin",nom:"Gratin dauphinois",emoji:"🥔",cat:"Plat",prep:20,cuisson:60,portions:6,diff:"Facile",
   ing:[{q:1,u:"kg",n:"pommes de terre"},{q:40,u:"cl",n:"crème fraîche"},{q:25,u:"cl",n:"lait"},{q:2,u:"",n:"gousses d'ail"},{q:100,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"muscade"},{q:20,u:"g",n:"beurre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Épluchez les pommes de terre.","Coupez-les en fines rondelles (2-3 mm), au couteau ou à la mandoline. Ne les rincez pas : l'amidon aide le gratin à se tenir.","Épluchez l'ail, coupez une gousse en deux et frottez tout l'intérieur du plat avec (cela parfume). Beurrez ensuite le plat.","Écrasez le reste d'ail. Dans une casserole, versez la crème, le lait, l'ail écrasé et une pincée de muscade. Salez et poivrez.","Faites chauffer doucement sans bouillir, juste pour tiédir.","Disposez les rondelles de pomme de terre dans le plat, en couches régulières.","Versez le mélange crème-lait par-dessus : il doit presque recouvrir les pommes de terre.","Parsemez de gruyère râpé.","Enfournez 1h. Le gratin est prêt quand le dessus est bien doré et qu'un couteau s'enfonce facilement dans les pommes de terre.","Laissez reposer 5 min avant de servir."]},
  {id:"croque",nom:"Croque-monsieur",emoji:"🥪",cat:"Plat",prep:10,cuisson:12,portions:2,diff:"Facile",
   ing:[{q:4,u:"",n:"tranches de pain de mie"},{q:2,u:"",n:"tranches de jambon"},{q:80,u:"g",n:"gruyère râpé"},{q:20,u:"g",n:"beurre"},{q:20,u:"cl",n:"lait"},{q:20,u:"g",n:"farine"},{q:1,u:"pincée",n:"muscade"}],
   etapes:["Préparez d'abord la béchamel. Dans une petite casserole, faites fondre le beurre à feu doux.","Ajoutez la farine d'un coup et mélangez vivement au fouet : vous obtenez une pâte. Laissez cuire 1 min sans colorer.","Versez le lait petit à petit en fouettant sans arrêt pour éviter les grumeaux.","Continuez à chauffer en remuant jusqu'à ce que la sauce épaississe et nappe la cuillère. Ajoutez une pincée de muscade, salez et poivrez. Réservez.","Préchauffez le four à 200°C (th. 6-7).","Posez 2 tranches de pain de mie sur une plaque. Tartinez-les d'une couche de béchamel.","Ajoutez une tranche de jambon et un peu de gruyère sur chacune.","Refermez avec les 2 autres tranches de pain. Étalez le reste de béchamel sur le dessus, puis parsemez du reste de gruyère.","Enfournez 10 à 12 min, jusqu'à ce que le dessus soit doré et gratiné.","Servez aussitôt, bien chaud."]},
  {id:"pouletroti",nom:"Poulet rôti",emoji:"🍗",cat:"Plat",prep:15,cuisson:80,portions:4,diff:"Facile",
   ing:[{q:1,u:"",n:"poulet fermier"},{q:40,u:"g",n:"beurre"},{q:4,u:"",n:"gousses d'ail"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"thym"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Sortez le poulet du frigo 30 min avant pour qu'il cuise uniformément. Préchauffez le four à 200°C (th. 6-7).","Épluchez l'ail. Coupez le citron en deux.","Glissez le beurre, les gousses d'ail et le citron à l'intérieur du poulet (cela le parfume et le garde moelleux).","Badigeonnez toute la peau d'huile d'olive, avec les mains ou un pinceau.","Salez et poivrez généreusement partout, puis parsemez de thym.","Posez le poulet dans un plat, cuisses vers le haut, et enfournez.","Comptez environ 1h20 (soit 20 min par 500 g). Toutes les 20 min, sortez le plat et arrosez le poulet avec le jus qui a coulé : cela évite qu'il sèche.","Vérifiez la cuisson en piquant entre la cuisse et le corps : le jus qui s'écoule doit être clair, pas rosé.","Sortez le poulet et laissez-le reposer 10 min sous une feuille d'aluminium : la viande se détend et reste juteuse.","Découpez et servez avec le jus du plat."]},
  {id:"curry",nom:"Curry de poulet",emoji:"🍛",cat:"Plat",prep:15,cuisson:30,portions:4,diff:"Facile",
   ing:[{q:600,u:"g",n:"blanc de poulet"},{q:40,u:"cl",n:"lait de coco"},{q:2,u:"",n:"oignons"},{q:2,u:"c. à soupe",n:"pâte de curry"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"},{q:1,u:"pincée",n:"coriandre"}],
   etapes:["Faites cuire le riz selon les indications du paquet, puis réservez-le au chaud.","Coupez les blancs de poulet en morceaux de la taille d'une bouchée.","Épluchez et émincez les oignons. Épluchez et hachez l'ail et le gingembre.","Faites chauffer l'huile dans une sauteuse à feu moyen. Faites revenir les oignons 4 min jusqu'à ce qu'ils soient translucides.","Ajoutez l'ail et le gingembre, mélangez 1 min (jusqu'à ce que ça sente bon).","Ajoutez les morceaux de poulet et faites-les dorer 5 min en remuant.","Ajoutez la pâte de curry et mélangez 1 min pour enrober le poulet.","Versez le lait de coco, mélangez et portez à petit frémissement.","Baissez le feu et laissez mijoter 20 min à découvert : la sauce épaissit et le poulet devient tendre.","Goûtez, salez si besoin, parsemez de coriandre et servez avec le riz."]},
  {id:"chili",nom:"Chili con carne",emoji:"🌶️",cat:"Plat",prep:15,cuisson:45,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"bœuf haché"},{q:400,u:"g",n:"haricots rouges"},{q:400,u:"g",n:"tomates concassées"},{q:2,u:"",n:"oignons"},{q:1,u:"",n:"poivron rouge"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"c. à café",n:"paprika"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Épluchez et hachez les oignons et l'ail. Lavez le poivron, retirez les graines et coupez-le en dés.","Égouttez et rincez les haricots rouges dans une passoire.","Faites chauffer l'huile dans une grande casserole à feu moyen. Faites revenir oignons, ail et poivron 5 min.","Ajoutez la viande hachée. Écrasez-la à la cuillère et faites-la dorer 5 min.","Ajoutez le cumin et le paprika, mélangez 1 min pour libérer les arômes.","Versez les tomates concassées et les haricots rouges. Salez et mélangez.","Baissez le feu, couvrez à moitié et laissez mijoter 35 min en remuant de temps en temps.","Pendant ce temps, faites cuire le riz selon le paquet.","Goûtez le chili et ajustez le sel et les épices (ajoutez un peu de piment si vous aimez relevé).","Servez le chili bien chaud sur le riz."]},
  {id:"risotto",nom:"Risotto aux champignons",emoji:"🍚",cat:"Plat",prep:10,cuisson:30,portions:4,diff:"Moyen",
   ing:[{q:300,u:"g",n:"riz arborio"},{q:300,u:"g",n:"champignons de Paris"},{q:1,u:"l",n:"bouillon de volaille"},{q:1,u:"",n:"oignon"},{q:10,u:"cl",n:"vin blanc"},{q:80,u:"g",n:"parmesan"},{q:30,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"huile d'olive"}],
   etapes:["Nettoyez les champignons avec un papier humide et émincez-les. Épluchez et hachez finement l'oignon.","Versez le bouillon dans une casserole et gardez-le chaud à feu très doux à côté (important : un bouillon froid stopperait la cuisson).","Faites chauffer l'huile d'olive dans une sauteuse à feu moyen. Faites revenir l'oignon 3 min sans le colorer.","Ajoutez les champignons et laissez-les dorer 5 min, jusqu'à ce qu'ils rendent leur eau puis colorent.","Ajoutez le riz et remuez 2 min : les grains deviennent translucides sur les bords.","Versez le vin blanc et remuez jusqu'à ce qu'il soit absorbé.","Ajoutez une louche de bouillon chaud. Remuez régulièrement jusqu'à ce qu'il soit presque absorbé, puis ajoutez la louche suivante.","Répétez pendant 18 à 20 min, louche après louche. Goûtez : le riz doit être crémeux mais encore légèrement ferme au centre.","Coupez le feu. Ajoutez le beurre et le parmesan, et mélangez énergiquement pour rendre le risotto onctueux.","Servez immédiatement, le risotto n'attend pas."]},
  {id:"pizza",nom:"Pizza margherita",emoji:"🍕",cat:"Plat",prep:20,cuisson:12,portions:2,diff:"Moyen",
   ing:[{q:1,u:"",n:"pâte à pizza"},{q:200,u:"g",n:"sauce tomate"},{q:1,u:"",n:"boule de mozzarella"},{q:1,u:"poignée",n:"basilic frais"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"origan"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Sortez la pâte à température ambiante. Préchauffez le four au maximum (250°C) avec la plaque à l'intérieur : une plaque très chaude donne une pâte croustillante.","Farinez légèrement un plan de travail. Étalez la pâte au rouleau le plus finement possible, en un disque.","Déposez la pâte sur une feuille de papier cuisson.","Étalez la sauce tomate à la cuillère en laissant 1 cm de bord libre. Salez légèrement et saupoudrez d'origan.","Égouttez la mozzarella et déchirez-la en morceaux. Répartissez-la sur la sauce.","Faites glisser la pizza (avec le papier) sur la plaque brûlante.","Enfournez 10 à 12 min : la croûte doit être dorée et gonflée sur les bords, le fromage fondu.","À la sortie, ajoutez les feuilles de basilic frais et un filet d'huile d'olive.","Coupez en parts et servez aussitôt."]},
  {id:"omelette",nom:"Omelette aux fines herbes",emoji:"🍳",cat:"Plat",prep:5,cuisson:5,portions:2,diff:"Facile",
   ing:[{q:5,u:"",n:"œufs"},{q:2,u:"c. à soupe",n:"lait"},{q:20,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"persil"},{q:2,u:"c. à soupe",n:"ciboulette"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Cassez les œufs dans un bol. Ajoutez le lait, une pincée de sel et du poivre.","Battez à la fourchette 20 secondes, juste assez pour mélanger blancs et jaunes.","Lavez et ciselez finement le persil et la ciboulette, puis ajoutez-les aux œufs.","Faites chauffer une poêle antiadhésive à feu moyen et faites-y fondre le beurre jusqu'à ce qu'il mousse (sans brunir).","Versez les œufs. Laissez prendre 30 secondes, puis ramenez délicatement les bords vers le centre avec une spatule en inclinant la poêle.","Continuez jusqu'à ce que le dessous soit pris mais le dessus encore un peu baveux (l'omelette finit de cuire hors du feu).","Repliez l'omelette en deux à l'aide de la spatule.","Faites-la glisser sur une assiette et servez aussitôt."]},
  {id:"soupeoignon",nom:"Soupe à l'oignon",emoji:"🧅",cat:"Entrée",prep:15,cuisson:40,portions:4,diff:"Facile",
   ing:[{q:6,u:"",n:"oignons"},{q:1,u:"l",n:"bouillon de bœuf"},{q:40,u:"g",n:"beurre"},{q:1,u:"c. à soupe",n:"farine"},{q:100,u:"g",n:"gruyère râpé"},{q:4,u:"",n:"tranches de pain"},{q:10,u:"cl",n:"vin blanc"}],
   etapes:["Épluchez les oignons et émincez-les en fines lamelles (c'est l'étape la plus longue mais la plus importante).","Faites fondre le beurre dans une grande casserole à feu moyen-doux.","Ajoutez les oignons et laissez-les cuire doucement 20 min en remuant souvent. Ils doivent devenir dorés et fondants (caramélisés), sans brûler. Baissez le feu si besoin.","Saupoudrez de farine et mélangez 1 min.","Versez le vin blanc et grattez le fond de la casserole pour décoller les sucs.","Ajoutez le bouillon, salez et poivrez. Laissez mijoter 20 min à feu doux.","Préchauffez le grill du four. Répartissez la soupe dans des bols qui vont au four.","Posez une tranche de pain sur chaque bol et couvrez généreusement de gruyère râpé.","Passez sous le grill quelques minutes, jusqu'à ce que le fromage soit fondu et doré.","Servez très chaud (attention, les bols sont brûlants)."]},
  {id:"cesar",nom:"Salade César",emoji:"🥗",cat:"Entrée",prep:20,cuisson:10,portions:2,diff:"Facile",
   ing:[{q:1,u:"",n:"cœur de laitue romaine"},{q:2,u:"",n:"blancs de poulet"},{q:50,u:"g",n:"parmesan"},{q:2,u:"",n:"tranches de pain"},{q:2,u:"c. à soupe",n:"mayonnaise"},{q:1,u:"",n:"gousse d'ail"},{q:1,u:"c. à café",n:"moutarde"},{q:2,u:"c. à soupe",n:"huile d'olive"}],
   etapes:["Faites chauffer un filet d'huile dans une poêle à feu moyen. Salez et poivrez les blancs de poulet, puis faites-les cuire 5-6 min de chaque côté jusqu'à ce qu'ils soient dorés et cuits à cœur. Réservez.","Préparez les croûtons : coupez le pain en dés. Faites-les dorer à la poêle dans un peu d'huile avec l'ail écrasé, en remuant, jusqu'à ce qu'ils soient croustillants.","Préparez la sauce : dans un bol, mélangez la mayonnaise, la moutarde, un peu de parmesan râpé et un filet d'huile d'olive. Poivrez.","Lavez la laitue romaine, essorez-la et coupez-la en morceaux.","Coupez le poulet en lanières.","Dans un grand saladier, mélangez la laitue avec la sauce.","Ajoutez le poulet et les croûtons.","Parsemez de copeaux de parmesan (faits avec un économe) et servez aussitôt."]},
  {id:"nicoise",nom:"Salade niçoise",emoji:"🥗",cat:"Entrée",prep:20,cuisson:10,portions:4,diff:"Facile",
   ing:[{q:200,u:"g",n:"thon"},{q:4,u:"",n:"œufs"},{q:4,u:"",n:"tomates"},{q:1,u:"",n:"poivron vert"},{q:200,u:"g",n:"haricots verts"},{q:100,u:"g",n:"olives noires"},{q:1,u:"",n:"oignon rouge"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à soupe",n:"vinaigre"}],
   etapes:["Faites cuire les œufs durs : plongez-les dans l'eau bouillante 10 min, puis rafraîchissez-les sous l'eau froide.","Faites cuire les haricots verts 8 min à l'eau bouillante salée : ils doivent rester un peu croquants. Égouttez et passez-les sous l'eau froide.","Lavez les tomates et coupez-les en quartiers. Lavez le poivron, retirez les graines et émincez-le. Épluchez et émincez l'oignon rouge.","Écalez les œufs et coupez-les en quartiers.","Égouttez le thon.","Préparez la vinaigrette : dans un bol, mélangez l'huile d'olive, le vinaigre, du sel et du poivre.","Disposez joliment tous les ingrédients dans un grand plat : légumes, haricots, œufs, thon émietté et olives.","Arrosez de vinaigrette juste avant de servir (sinon la salade rend de l'eau)."]},
  {id:"guacamole",nom:"Guacamole",emoji:"🥑",cat:"Apéro",prep:10,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:3,u:"",n:"avocats mûrs"},{q:1,u:"",n:"citron vert"},{q:1,u:"",n:"tomate"},{q:1,u:"",n:"petit oignon"},{q:1,u:"",n:"gousse d'ail"},{q:1,u:"pincée",n:"coriandre"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"piment"}],
   etapes:["Choisissez des avocats bien mûrs (ils cèdent légèrement sous le doigt). Coupez-les en deux, retirez le noyau et récupérez la chair à la cuillère dans un bol.","Pressez le citron vert et versez le jus sur les avocats (cela évite qu'ils noircissent).","Écrasez la chair à la fourchette, plus ou moins finement selon la texture voulue.","Coupez la tomate en petits dés (retirez les pépins). Épluchez et hachez très finement l'oignon et l'ail.","Ajoutez la tomate, l'oignon et l'ail au guacamole.","Ciselez la coriandre et incorporez-la avec le sel et une pincée de piment.","Mélangez et goûtez : ajustez le sel et le citron.","Servez frais, avec des chips de maïs pour tremper."]},
  {id:"houmous",nom:"Houmous",emoji:"🧆",cat:"Apéro",prep:10,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"pois chiches"},{q:2,u:"c. à soupe",n:"tahini"},{q:1,u:"",n:"citron"},{q:2,u:"",n:"gousses d'ail"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"pincée",n:"paprika"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Égouttez et rincez les pois chiches sous l'eau froide.","Pressez le citron. Épluchez l'ail.","Mettez les pois chiches dans un mixeur avec le tahini, le jus de citron et l'ail.","Mixez quelques secondes.","Ajoutez l'huile d'olive et le cumin, puis mixez à nouveau jusqu'à obtenir une texture lisse.","Si c'est trop épais, ajoutez 1 à 2 cuillères d'eau froide et mixez encore : le houmous devient crémeux.","Salez et goûtez : rectifiez le citron ou le sel selon votre goût.","Versez dans un bol, faites un puits avec le dos d'une cuillère, arrosez d'un filet d'huile et saupoudrez de paprika."]},
  {id:"crepes",nom:"Crêpes",emoji:"🥞",cat:"Dessert",prep:10,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:250,u:"g",n:"farine"},{q:4,u:"",n:"œufs"},{q:50,u:"cl",n:"lait"},{q:50,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"sucre"},{q:1,u:"pincée",n:"sel"},{q:1,u:"c. à soupe",n:"huile"}],
   etapes:["Versez la farine dans un grand saladier avec le sucre et le sel. Faites un puits (un creux) au centre.","Cassez les œufs dans le puits. Commencez à mélanger au fouet en incorporant peu à peu la farine des bords.","Ajoutez le lait petit à petit en fouettant, pour éviter les grumeaux. La pâte doit être bien lisse et fluide.","Faites fondre le beurre et incorporez-le à la pâte.","Si possible, laissez reposer la pâte 30 min : les crêpes seront plus souples.","Faites chauffer une poêle à feu moyen-vif et huilez-la légèrement avec un papier absorbant.","Versez une petite louche de pâte et tournez la poêle pour l'étaler finement.","Laissez cuire environ 1 min : quand les bords se décollent et que le dessous est doré, retournez la crêpe.","Faites cuire l'autre face 30 secondes, puis réservez. Répétez avec le reste de pâte.","Garnissez selon l'envie : sucre, confiture, pâte à tartiner, citron..."]},
  {id:"pancakes",nom:"Pancakes",emoji:"🥞",cat:"Petit-déj",prep:10,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:200,u:"g",n:"farine"},{q:2,u:"",n:"œufs"},{q:25,u:"cl",n:"lait"},{q:1,u:"sachet",n:"levure chimique"},{q:2,u:"c. à soupe",n:"sucre"},{q:30,u:"g",n:"beurre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Dans un saladier, mélangez la farine, le sucre, la levure et le sel.","Dans un autre bol, battez les œufs avec le lait.","Versez le mélange liquide sur les ingrédients secs et fouettez juste assez pour obtenir une pâte lisse (ne mélangez pas trop, quelques petits grumeaux sont acceptables).","Faites fondre le beurre et incorporez-le à la pâte. Laissez reposer 10 min si vous avez le temps.","Faites chauffer une poêle antiadhésive à feu moyen, sans matière grasse ou à peine.","Versez une petite louche de pâte pour former un disque épais.","Attendez que des bulles apparaissent à la surface et que les bords soient pris (2 min environ).","Retournez le pancake et faites cuire l'autre face 1 min.","Réservez au chaud et répétez avec le reste de pâte.","Servez tièdes, empilés, avec du sirop d'érable ou du miel."]},
  {id:"mousse",nom:"Mousse au chocolat",emoji:"🍫",cat:"Dessert",prep:20,cuisson:0,portions:6,diff:"Facile",
   ing:[{q:200,u:"g",n:"chocolat noir"},{q:6,u:"",n:"œufs"},{q:30,u:"g",n:"sucre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Cassez le chocolat en morceaux dans un bol. Faites-le fondre au bain-marie (bol posé sur une casserole d'eau frémissante) ou au micro-ondes par tranches de 30 secondes en remuant.","Laissez tiédir le chocolat fondu quelques minutes.","Séparez les blancs des jaunes d'œufs : cassez chaque œuf et faites passer le jaune d'une coquille à l'autre en laissant couler le blanc dans un bol.","Incorporez les jaunes un à un au chocolat tiédi, en mélangeant bien.","Ajoutez une pincée de sel aux blancs, puis montez-les en neige ferme au batteur (ils doivent former des pics).","Ajoutez le sucre et fouettez encore 30 secondes pour les serrer.","Incorporez d'abord un tiers des blancs au chocolat pour l'assouplir, en mélangeant normalement.","Ajoutez le reste des blancs et mélangez très délicatement, de bas en haut, pour garder l'air : c'est ce qui rend la mousse aérienne.","Répartissez dans des verrines.","Réservez au frais au moins 3h avant de déguster."]},
  {id:"tartepommes",nom:"Tarte aux pommes",emoji:"🥧",cat:"Dessert",prep:25,cuisson:35,portions:6,diff:"Facile",
   ing:[{q:1,u:"",n:"pâte brisée"},{q:5,u:"",n:"pommes"},{q:50,u:"g",n:"sucre"},{q:30,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"confiture d'abricot"},{q:1,u:"pincée",n:"cannelle"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Déroulez la pâte dans un moule avec son papier et piquez le fond à la fourchette.","Épluchez les pommes, coupez-les en quatre, retirez le cœur et les pépins.","Coupez chaque quartier en fines lamelles.","Disposez les lamelles en rosace sur la pâte, en les faisant se chevaucher légèrement.","Saupoudrez de sucre et d'un peu de cannelle.","Répartissez des petits morceaux de beurre sur les pommes.","Enfournez 35 min : les pommes doivent être tendres et légèrement dorées sur les bords.","Faites tiédir la confiture d'abricot (au micro-ondes ou dans une casserole) et badigeonnez-en la tarte au pinceau pour la faire briller.","Laissez tiédir avant de servir."]},
  {id:"tiramisu",nom:"Tiramisu",emoji:"☕",cat:"Dessert",prep:25,cuisson:0,portions:6,diff:"Moyen",
   ing:[{q:250,u:"g",n:"mascarpone"},{q:3,u:"",n:"œufs"},{q:80,u:"g",n:"sucre"},{q:24,u:"",n:"biscuits à la cuillère"},{q:25,u:"cl",n:"café fort"},{q:2,u:"c. à soupe",n:"cacao"}],
   etapes:["Préparez un café bien fort (25 cl) et laissez-le refroidir dans une assiette creuse.","Séparez les blancs des jaunes d'œufs.","Fouettez les jaunes avec le sucre jusqu'à ce que le mélange blanchisse et double de volume.","Ajoutez le mascarpone et fouettez doucement jusqu'à obtenir une crème lisse.","Montez les blancs en neige ferme dans un autre bol.","Incorporez les blancs délicatement à la crème au mascarpone, de bas en haut, pour garder l'air.","Trempez rapidement chaque biscuit dans le café (1 seconde de chaque côté, sinon il se gorge trop) et tapissez le fond d'un plat.","Étalez la moitié de la crème par-dessus.","Refaites une couche de biscuits imbibés, puis le reste de crème. Lissez le dessus.","Couvrez et réservez au frais au moins 4h, idéalement une nuit.","Juste avant de servir, saupoudrez de cacao à travers une petite passoire."]},
  {id:"cookies",nom:"Cookies aux pépites de chocolat",emoji:"🍪",cat:"Dessert",prep:15,cuisson:12,portions:20,diff:"Facile",
   ing:[{q:250,u:"g",n:"farine"},{q:125,u:"g",n:"beurre"},{q:100,u:"g",n:"sucre roux"},{q:1,u:"",n:"œuf"},{q:200,u:"g",n:"pépites de chocolat"},{q:1,u:"c. à café",n:"levure chimique"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Sortez le beurre à l'avance pour qu'il soit bien mou.","Dans un saladier, travaillez le beurre mou avec le sucre roux à la cuillère jusqu'à obtenir une crème.","Ajoutez l'œuf et mélangez.","Ajoutez la farine, la levure et le sel. Mélangez juste assez pour former une pâte (ne travaillez pas trop).","Incorporez les pépites de chocolat.","Formez des boules de la taille d'une grosse noix avec les mains.","Déposez-les sur une plaque avec du papier cuisson, bien espacées (elles s'étalent en cuisant).","Aplatissez-les légèrement.","Enfournez 10 à 12 min : les cookies doivent être dorés sur les bords mais encore mous au centre (ils durcissent en refroidissant).","Laissez-les refroidir 5 min sur la plaque avant de les décoller."]},
  {id:"bananabread",nom:"Banana bread",emoji:"🍌",cat:"Petit-déj",prep:15,cuisson:50,portions:8,diff:"Facile",
   ing:[{q:3,u:"",n:"bananes mûres"},{q:200,u:"g",n:"farine"},{q:100,u:"g",n:"sucre"},{q:80,u:"g",n:"beurre"},{q:2,u:"",n:"œufs"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"pincée",n:"cannelle"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 170°C (th. 5-6). Beurrez un moule à cake ou tapissez-le de papier cuisson.","Épluchez les bananes et écrasez-les à la fourchette jusqu'à obtenir une purée (des bananes bien mûres, presque noires, sont idéales).","Faites fondre le beurre. Dans un saladier, mélangez-le avec le sucre.","Ajoutez les œufs un à un en mélangeant.","Incorporez la purée de bananes.","Ajoutez la farine, la levure, la cannelle et le sel. Mélangez juste assez pour obtenir une pâte homogène.","Versez la pâte dans le moule et lissez le dessus.","Enfournez 50 min. Vérifiez la cuisson en plantant la lame d'un couteau au centre : elle doit ressortir sèche.","Laissez tiédir 10 min, puis démoulez et laissez refroidir sur une grille."]},
  {id:"wok",nom:"Wok de légumes",emoji:"🥦",cat:"Plat",prep:15,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:1,u:"",n:"brocoli"},{q:2,u:"",n:"carottes"},{q:1,u:"",n:"poivron rouge"},{q:200,u:"g",n:"champignons"},{q:200,u:"g",n:"nouilles chinoises"},{q:3,u:"c. à soupe",n:"sauce soja"},{q:1,u:"",n:"morceau de gingembre"},{q:2,u:"",n:"gousses d'ail"},{q:2,u:"c. à soupe",n:"huile"}],
   etapes:["Faites cuire les nouilles selon le paquet, égouttez-les et réservez (arrosez-les d'un filet d'huile pour éviter qu'elles collent).","Lavez tous les légumes. Détaillez le brocoli en petits bouquets, coupez les carottes en fines rondelles, le poivron en lanières et les champignons en lamelles (des morceaux fins cuisent vite et uniformément).","Épluchez et hachez l'ail et le gingembre.","Faites chauffer l'huile dans un wok ou une grande poêle à feu vif : elle doit être bien chaude.","Ajoutez l'ail et le gingembre, faites sauter 30 secondes.","Ajoutez les légumes en commençant par les plus durs (carottes, brocoli), puis les plus tendres (poivron, champignons). Faites sauter 5-6 min en remuant sans arrêt : ils doivent rester croquants.","Ajoutez les nouilles et la sauce soja.","Faites sauter encore 3 min pour tout réchauffer et enrober.","Servez aussitôt, bien chaud."]},
  {id:"tacos",nom:"Tacos au bœuf",emoji:"🌮",cat:"Plat",prep:15,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"bœuf haché"},{q:8,u:"",n:"tortillas"},{q:1,u:"",n:"oignon"},{q:1,u:"",n:"poivron rouge"},{q:100,u:"g",n:"cheddar râpé"},{q:1,u:"",n:"tomate"},{q:2,u:"c. à café",n:"épices tacos"},{q:1,u:"c. à soupe",n:"huile"},{q:1,u:"poignée",n:"salade"}],
   etapes:["Épluchez et émincez l'oignon. Lavez le poivron, retirez les graines et coupez-le en dés.","Faites chauffer l'huile dans une poêle à feu moyen. Faites revenir l'oignon et le poivron 5 min.","Ajoutez la viande hachée et faites-la dorer en l'écrasant à la cuillère.","Ajoutez les épices tacos et un petit verre d'eau. Mélangez et laissez mijoter 5 min, jusqu'à ce que la sauce épaississe.","Pendant ce temps, lavez et coupez la tomate en dés, et émincez la salade.","Réchauffez les tortillas quelques secondes de chaque côté dans une poêle sèche.","Garnissez chaque tortilla d'un peu de viande, de salade, de tomate et de cheddar râpé.","Roulez les tacos et servez aussitôt."]},
  {id:"padthai",nom:"Pad thaï",emoji:"🍜",cat:"Plat",prep:20,cuisson:15,portions:2,diff:"Moyen",
   ing:[{q:200,u:"g",n:"nouilles de riz"},{q:200,u:"g",n:"crevettes"},{q:2,u:"",n:"œufs"},{q:100,u:"g",n:"pousses de soja"},{q:2,u:"",n:"gousses d'ail"},{q:3,u:"c. à soupe",n:"sauce nuoc-mâm"},{q:2,u:"c. à soupe",n:"sauce soja"},{q:50,u:"g",n:"cacahuètes"},{q:1,u:"",n:"citron vert"},{q:2,u:"c. à soupe",n:"huile"}],
   etapes:["Faites tremper les nouilles de riz dans un saladier d'eau chaude 10-15 min, jusqu'à ce qu'elles soient souples mais encore fermes. Égouttez.","Préparez tout à l'avance (le pad thaï se cuit très vite) : épluchez et hachez l'ail, pressez le citron vert, concassez les cacahuètes.","Décortiquez les crevettes si nécessaire.","Faites chauffer l'huile dans un wok à feu vif. Faites sauter l'ail 20 secondes.","Ajoutez les crevettes et faites-les colorer 2 min.","Poussez tout sur un côté du wok. Cassez les œufs dans l'espace libre et brouillez-les rapidement à la spatule.","Ajoutez les nouilles égouttées, la sauce nuoc-mâm et la sauce soja. Mélangez pour tout enrober.","Ajoutez les pousses de soja et faites sauter 2 min de plus.","Servez aussitôt, parsemé de cacahuètes concassées, avec un quartier de citron vert à presser."]},
  {id:"blanquette",nom:"Blanquette de veau",emoji:"🍲",cat:"Plat",prep:20,cuisson:90,portions:4,diff:"Moyen",
   ing:[{q:800,u:"g",n:"épaule de veau"},{q:3,u:"",n:"carottes"},{q:1,u:"",n:"oignon"},{q:1,u:"",n:"poireau"},{q:250,u:"g",n:"champignons de Paris"},{q:40,u:"g",n:"beurre"},{q:40,u:"g",n:"farine"},{q:20,u:"cl",n:"crème fraîche"},{q:1,u:"",n:"jaune d'œuf"},{q:1,u:"",n:"bouquet garni"}],
   etapes:["Sortez la viande du frigo un peu avant. Coupez le veau en gros cubes de 4-5 cm.","Mettez les cubes dans une grande cocotte et couvrez-les d'eau froide. Portez à ébullition.","Une écume grise va remonter à la surface : retirez-la à l'écumoire (cela clarifie le bouillon).","Épluchez les carottes et coupez-les en rondelles. Épluchez l'oignon. Lavez le poireau et coupez-le en tronçons.","Ajoutez les carottes, l'oignon, le poireau et le bouquet garni dans la cocotte. Salez légèrement.","Couvrez et laissez mijoter doucement 1h15 : la viande doit devenir bien tendre.","Pendant ce temps, nettoyez et émincez les champignons. Faites-les revenir 5 min dans un peu de beurre, puis réservez.","Quand la viande est cuite, prélevez le bouillon à la louche (gardez-le) et réservez la viande et les légumes au chaud.","Préparez la sauce : dans une casserole, faites fondre le beurre, ajoutez la farine et mélangez 1 min (c'est un roux).","Versez peu à peu le bouillon chaud filtré en fouettant, jusqu'à obtenir une sauce onctueuse.","Dans un bol, mélangez la crème et le jaune d'œuf. Hors du feu, incorporez-le à la sauce (ne faites plus bouillir, sinon la sauce tranche).","Remettez la viande, les légumes et les champignons dans la sauce, réchauffez doucement et servez avec du riz."]},
  {id:"hachis",nom:"Hachis parmentier",emoji:"🥔",cat:"Plat",prep:25,cuisson:30,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"bœuf haché"},{q:1,u:"kg",n:"pommes de terre"},{q:1,u:"",n:"oignon"},{q:20,u:"cl",n:"lait"},{q:40,u:"g",n:"beurre"},{q:80,u:"g",n:"gruyère râpé"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"muscade"}],
   etapes:["Épluchez les pommes de terre et coupez-les en morceaux. Plongez-les dans une casserole d'eau froide salée, portez à ébullition et laissez cuire 20 min (un couteau doit s'y enfoncer facilement).","Pendant ce temps, épluchez et hachez l'oignon et l'ail.","Faites chauffer l'huile dans une poêle. Faites revenir l'oignon et l'ail 3 min.","Ajoutez la viande hachée, écrasez-la à la cuillère et faites-la dorer 5 min. Salez et poivrez.","Égouttez les pommes de terre. Écrasez-les au presse-purée avec le lait, le beurre et une pincée de muscade, jusqu'à obtenir une purée lisse.","Préchauffez le four à 200°C (th. 6-7).","Étalez la viande au fond d'un plat à gratin.","Recouvrez avec la purée et lissez la surface à la fourchette (les stries dorent joliment).","Parsemez de gruyère râpé.","Enfournez 20 min, jusqu'à ce que le dessus soit gratiné et doré. Servez avec une salade verte."]},
  {id:"lasagnes",nom:"Lasagnes à la bolognaise",emoji:"🍝",cat:"Plat",prep:30,cuisson:45,portions:6,diff:"Moyen",
   ing:[{q:250,u:"g",n:"plaques de lasagnes"},{q:500,u:"g",n:"bœuf haché"},{q:800,u:"g",n:"tomates concassées"},{q:1,u:"",n:"oignon"},{q:1,u:"",n:"carotte"},{q:2,u:"",n:"gousses d'ail"},{q:50,u:"g",n:"beurre"},{q:50,u:"g",n:"farine"},{q:60,u:"cl",n:"lait"},{q:150,u:"g",n:"gruyère râpé"},{q:2,u:"c. à soupe",n:"huile d'olive"}],
   etapes:["Préparez la bolognaise : épluchez et hachez l'oignon, l'ail et la carotte. Faites-les revenir dans un peu d'huile, ajoutez la viande hachée et faites dorer, puis les tomates concassées. Salez et laissez mijoter 20 min.","Préparez la béchamel : faites fondre le beurre dans une casserole, ajoutez la farine et mélangez 1 min.","Versez le lait petit à petit en fouettant, jusqu'à obtenir une sauce épaisse et lisse. Salez, poivrez et ajoutez une pincée de muscade.","Préchauffez le four à 180°C (th. 6).","Dans un plat, étalez un peu de bolognaise au fond.","Posez une couche de plaques de lasagnes, puis de la bolognaise, puis un peu de béchamel.","Répétez les couches jusqu'à épuisement des ingrédients (plaques, bolognaise, béchamel).","Terminez par une couche de béchamel et parsemez de gruyère râpé.","Enfournez 40 min : le dessus doit être bien doré et les plaques tendres (plantez un couteau pour vérifier).","Laissez reposer 10 min avant de couper : les lasagnes se tiendront mieux."]},
  {id:"milanaise",nom:"Escalope milanaise",emoji:"🍗",cat:"Plat",prep:15,cuisson:10,portions:2,diff:"Facile",
   ing:[{q:2,u:"",n:"escalopes de veau"},{q:100,u:"g",n:"chapelure"},{q:2,u:"",n:"œufs"},{q:50,u:"g",n:"farine"},{q:40,u:"g",n:"parmesan"},{q:4,u:"c. à soupe",n:"huile"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Posez chaque escalope entre deux feuilles de film alimentaire et aplatissez-la avec un rouleau ou le fond d'une casserole (elle cuira plus vite et régulièrement).","Préparez trois assiettes creuses : une avec la farine, une avec les œufs battus, une avec la chapelure mélangée au parmesan râpé.","Passez chaque escalope d'abord dans la farine et tapotez pour retirer l'excédent.","Puis dans l'œuf battu.","Puis dans la chapelure, en appuyant bien pour qu'elle adhère partout.","Faites chauffer l'huile dans une grande poêle à feu moyen.","Faites cuire les escalopes 3 à 4 min de chaque côté, jusqu'à ce que la panure soit dorée et croustillante.","Égouttez sur du papier absorbant, salez légèrement et servez avec un quartier de citron."]},
  {id:"basquaise",nom:"Poulet basquaise",emoji:"🌶️",cat:"Plat",prep:20,cuisson:45,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"cuisses de poulet"},{q:1,u:"",n:"poivron rouge"},{q:1,u:"",n:"poivron vert"},{q:4,u:"",n:"tomates"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:2,u:"",n:"tranches de jambon de Bayonne"},{q:2,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"piment d'Espelette"},{q:1,u:"pincée",n:"thym"}],
   etapes:["Faites chauffer l'huile dans une cocotte à feu moyen-vif. Faites dorer les cuisses de poulet sur toutes les faces, puis réservez-les.","Lavez les poivrons, retirez les graines et émincez-les. Épluchez et émincez l'oignon et l'ail.","Dans la même cocotte, faites revenir l'oignon, l'ail et les poivrons 8 min, jusqu'à ce qu'ils ramollissent.","Coupez les tomates en morceaux et le jambon en lanières. Ajoutez-les dans la cocotte avec le piment d'Espelette.","Remettez le poulet. Salez et parsemez de thym.","Couvrez et laissez mijoter 40 min à feu doux, en remuant de temps en temps.","Le poulet doit être tendre et la sauce parfumée. Goûtez et rectifiez l'assaisonnement.","Servez avec du riz."]},
  {id:"tikka",nom:"Poulet tikka massala",emoji:"🍛",cat:"Plat",prep:20,cuisson:30,portions:4,diff:"Moyen",
   ing:[{q:600,u:"g",n:"blancs de poulet"},{q:2,u:"",n:"yaourts nature"},{q:400,u:"g",n:"tomates concassées"},{q:15,u:"cl",n:"crème"},{q:1,u:"",n:"oignon"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:2,u:"c. à café",n:"garam massala"},{q:1,u:"c. à café",n:"paprika"},{q:2,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Coupez le poulet en cubes. Dans un bol, mélangez-les avec le yaourt et la moitié des épices (garam massala, paprika). Laissez mariner 15 min.","Faites cuire le riz selon le paquet et réservez-le au chaud.","Épluchez et hachez l'oignon, l'ail et le gingembre.","Faites chauffer l'huile dans une sauteuse. Faites revenir l'oignon 4 min, puis l'ail et le gingembre 1 min.","Ajoutez le poulet mariné et faites-le dorer 5 min en remuant.","Ajoutez le reste des épices et mélangez 1 min.","Versez les tomates concassées et la crème, puis mélangez.","Laissez mijoter 15 min à feu doux : la sauce épaissit et devient onctueuse.","Goûtez, salez si besoin, et servez avec le riz."]},
  {id:"rotiporc",nom:"Rôti de porc",emoji:"🥩",cat:"Plat",prep:15,cuisson:75,portions:6,diff:"Facile",
   ing:[{q:1,u:"kg",n:"rôti de porc"},{q:800,u:"g",n:"pommes de terre"},{q:2,u:"",n:"oignons"},{q:4,u:"",n:"gousses d'ail"},{q:3,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"thym"},{q:2,u:"",n:"feuilles de laurier"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Sortez le rôti du frigo 30 min avant. Préchauffez le four à 200°C (th. 6-7).","Épluchez les oignons et coupez-les en quartiers. Épluchez les gousses d'ail et laissez-les entières.","Badigeonnez le rôti d'huile. Salez, poivrez et parsemez de thym sur toutes les faces.","Posez le rôti dans un plat avec les oignons, l'ail et le laurier.","Enfournez 40 min.","Pendant ce temps, épluchez les pommes de terre et coupez-les en gros morceaux.","Sortez le plat, disposez les pommes de terre autour du rôti et mélangez-les au jus.","Poursuivez la cuisson 35 min, en arrosant le rôti et les pommes de terre de jus de temps en temps.","Vérifiez : la viande doit être cuite à cœur et les pommes de terre tendres et dorées.","Laissez reposer le rôti 10 min avant de le découper en tranches."]},
  {id:"cotesporc",nom:"Côtes de porc à la moutarde",emoji:"🥩",cat:"Plat",prep:10,cuisson:20,portions:2,diff:"Facile",
   ing:[{q:2,u:"",n:"côtes de porc"},{q:2,u:"c. à soupe",n:"moutarde"},{q:15,u:"cl",n:"crème fraîche"},{q:1,u:"",n:"oignon"},{q:5,u:"cl",n:"vin blanc"},{q:20,u:"g",n:"beurre"},{q:1,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"persil"}],
   etapes:["Faites chauffer le beurre et l'huile dans une poêle à feu moyen-vif.","Salez et poivrez les côtes de porc, puis faites-les dorer 4 min de chaque côté. Réservez-les dans une assiette.","Épluchez et émincez l'oignon. Faites-le revenir dans la même poêle 3 min.","Versez le vin blanc et grattez le fond pour décoller les sucs. Laissez réduire de moitié.","Ajoutez la moutarde et la crème, puis mélangez.","Remettez les côtes dans la poêle avec le jus qu'elles ont rendu.","Laissez mijoter 8 min à feu doux : la sauce doit napper.","Parsemez de persil et servez avec des pâtes ou du riz."]},
  {id:"boulettes",nom:"Boulettes de viande à la tomate",emoji:"🍝",cat:"Plat",prep:20,cuisson:30,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"bœuf haché"},{q:50,u:"g",n:"chapelure"},{q:1,u:"",n:"œuf"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:800,u:"g",n:"tomates concassées"},{q:40,u:"g",n:"parmesan"},{q:2,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"origan"}],
   etapes:["Épluchez et hachez l'oignon et l'ail.","Dans un saladier, mélangez la viande hachée avec la chapelure, l'œuf et la moitié de l'oignon haché. Salez et poivrez.","Malaxez à la main jusqu'à obtenir un mélange homogène.","Formez des boulettes de la taille d'une noix en roulant la viande entre vos paumes.","Faites chauffer l'huile dans une sauteuse. Faites dorer les boulettes sur toutes les faces, puis réservez-les.","Dans la même sauteuse, faites revenir le reste d'oignon et l'ail 2 min.","Ajoutez les tomates concassées et l'origan. Salez.","Remettez les boulettes dans la sauce, couvrez et laissez mijoter 20 min.","Parsemez de parmesan et servez avec des spaghetti."]},
  {id:"cordonbleu",nom:"Cordon bleu maison",emoji:"🍗",cat:"Plat",prep:20,cuisson:12,portions:2,diff:"Facile",
   ing:[{q:2,u:"",n:"escalopes de poulet"},{q:2,u:"",n:"tranches de jambon"},{q:2,u:"",n:"tranches de fromage à raclette"},{q:100,u:"g",n:"chapelure"},{q:2,u:"",n:"œufs"},{q:50,u:"g",n:"farine"},{q:4,u:"c. à soupe",n:"huile"}],
   etapes:["Aplatissez les escalopes entre deux feuilles de film alimentaire.","Coupez chaque escalope en deux dans l'épaisseur, sans séparer complètement (comme un livre qui s'ouvre).","Glissez à l'intérieur une tranche de jambon et une de fromage, puis refermez en appuyant sur les bords.","Préparez trois assiettes : farine, œufs battus, chapelure.","Passez chaque cordon bleu dans la farine, puis l'œuf, puis la chapelure, en appuyant bien.","Pour une panure bien solide, repassez-les une 2e fois dans l'œuf puis la chapelure.","Faites chauffer l'huile dans une poêle à feu moyen.","Faites cuire les cordons bleus 5 à 6 min de chaque côté, jusqu'à ce que la panure soit dorée et le fromage fondu.","Égouttez sur du papier absorbant et servez avec des frites ou une salade."]},
  {id:"stroganoff",nom:"Bœuf Stroganoff",emoji:"🥩",cat:"Plat",prep:15,cuisson:20,portions:4,diff:"Moyen",
   ing:[{q:600,u:"g",n:"rumsteck"},{q:250,u:"g",n:"champignons"},{q:1,u:"",n:"oignon"},{q:20,u:"cl",n:"crème fraîche"},{q:1,u:"c. à soupe",n:"moutarde"},{q:1,u:"c. à café",n:"paprika"},{q:30,u:"g",n:"beurre"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Coupez le bœuf en fines lanières (plus facile s'il est très froid).","Épluchez et émincez l'oignon. Nettoyez et émincez les champignons.","Faites fondre le beurre dans une poêle à feu moyen. Faites revenir l'oignon 3 min, puis ajoutez les champignons et laissez dorer 5 min. Réservez.","Montez le feu, ajoutez l'huile et saisissez les lanières de bœuf 2 min à feu vif : elles doivent rester rosées (une cuisson trop longue les durcit).","Remettez les légumes dans la poêle.","Ajoutez la crème, la moutarde et le paprika. Mélangez et réchauffez doucement sans bouillir.","Salez, poivrez et goûtez. Servez aussitôt avec le riz."]},
  {id:"pouletcreme",nom:"Poulet à la crème et champignons",emoji:"🍗",cat:"Plat",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"blancs de poulet"},{q:250,u:"g",n:"champignons de Paris"},{q:20,u:"cl",n:"crème fraîche"},{q:1,u:"",n:"oignon"},{q:5,u:"cl",n:"vin blanc"},{q:30,u:"g",n:"beurre"},{q:1,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"persil"}],
   etapes:["Coupez les blancs de poulet en morceaux.","Épluchez et émincez l'oignon. Nettoyez et émincez les champignons.","Faites chauffer le beurre et l'huile dans une sauteuse à feu moyen. Faites dorer les morceaux de poulet 5 min sur toutes les faces.","Ajoutez l'oignon et les champignons, et laissez cuire 5 min.","Versez le vin blanc et grattez le fond pour décoller les sucs. Laissez réduire 2 min.","Versez la crème et mélangez.","Baissez le feu et laissez mijoter 15 min : la sauce épaissit et le poulet devient tendre.","Salez, poivrez, parsemez de persil et servez avec du riz ou des tagliatelles."]},
  {id:"saucisseslentilles",nom:"Saucisses aux lentilles",emoji:"🌭",cat:"Plat",prep:15,cuisson:40,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"saucisses de Toulouse"},{q:300,u:"g",n:"lentilles vertes"},{q:2,u:"",n:"carottes"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:100,u:"g",n:"lardons"},{q:2,u:"",n:"feuilles de laurier"},{q:1,u:"c. à soupe",n:"huile"}],
   etapes:["Rincez les lentilles à l'eau froide dans une passoire (inutile de les faire tremper).","Épluchez et émincez l'oignon. Épluchez et hachez l'ail. Épluchez les carottes et coupez-les en dés.","Faites chauffer l'huile dans une cocotte. Faites revenir l'oignon, l'ail, les carottes et les lardons 5 min.","Ajoutez les lentilles et le laurier.","Couvrez d'eau (environ deux fois le volume des lentilles). Ne salez pas encore : le sel durcit les lentilles.","Portez à ébullition, puis baissez le feu, couvrez et laissez mijoter 30 min. Les lentilles doivent être tendres.","Pendant ce temps, faites griller les saucisses à la poêle en les retournant, jusqu'à ce qu'elles soient dorées et cuites.","Salez les lentilles en fin de cuisson et servez les saucisses posées dessus."]},
  {id:"teriyaki",nom:"Poulet teriyaki",emoji:"🍗",cat:"Plat",prep:15,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:600,u:"g",n:"blancs de poulet"},{q:6,u:"c. à soupe",n:"sauce soja"},{q:3,u:"c. à soupe",n:"miel"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"c. à soupe",n:"huile"},{q:1,u:"c. à soupe",n:"graines de sésame"},{q:200,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Coupez le poulet en morceaux de la taille d'une bouchée.","Préparez la sauce : dans un bol, mélangez la sauce soja, le miel, l'ail et le gingembre râpés.","Faites chauffer l'huile dans une poêle à feu moyen-vif. Faites dorer les morceaux de poulet 5 min.","Versez la sauce sur le poulet.","Laissez cuire 8 min en remuant : la sauce épaissit et enrobe le poulet d'un glaçage brillant.","Parsemez de graines de sésame.","Servez avec le riz."]},
  {id:"boeufoignons",nom:"Bœuf aux oignons",emoji:"🥢",cat:"Plat",prep:15,cuisson:15,portions:2,diff:"Facile",
   ing:[{q:300,u:"g",n:"bavette de bœuf"},{q:2,u:"",n:"oignons"},{q:3,u:"c. à soupe",n:"sauce soja"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"c. à café",n:"maïzena"},{q:2,u:"c. à soupe",n:"huile"},{q:150,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Coupez le bœuf en fines lanières. Mélangez-les avec la maïzena et un peu de sauce soja (cela les rend tendres).","Épluchez et émincez les oignons. Épluchez et hachez l'ail et le gingembre.","Faites chauffer l'huile dans un wok à feu vif. Saisissez le bœuf 2 min en remuant, puis réservez-le.","Dans le même wok, faites revenir les oignons, l'ail et le gingembre 4 min.","Remettez le bœuf et ajoutez le reste de sauce soja.","Faites sauter 2 min à feu vif pour tout enrober.","Servez aussitôt avec le riz."]},
  {id:"porccaramel",nom:"Porc au caramel",emoji:"🍖",cat:"Plat",prep:15,cuisson:30,portions:4,diff:"Facile",
   ing:[{q:600,u:"g",n:"échine de porc"},{q:3,u:"c. à soupe",n:"sucre"},{q:4,u:"c. à soupe",n:"sauce soja"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"",n:"oignon"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Coupez le porc en cubes. Épluchez et émincez l'oignon, l'ail et le gingembre.","Dans une cocotte, versez le sucre et un peu d'eau. Faites chauffer sans remuer jusqu'à obtenir un caramel doré (surveillez, cela va vite).","Ajoutez les cubes de porc et remuez pour les enrober de caramel.","Ajoutez la sauce soja, l'oignon, l'ail et le gingembre.","Versez de l'eau jusqu'à presque recouvrir la viande.","Laissez mijoter 25 min à feu doux : la sauce réduit et devient sirupeuse.","Servez avec le riz."]},
  {id:"tartiflette",nom:"Tartiflette",emoji:"🧀",cat:"Plat",prep:20,cuisson:35,portions:4,diff:"Moyen",
   ing:[{q:1,u:"kg",n:"pommes de terre"},{q:1,u:"",n:"reblochon"},{q:200,u:"g",n:"lardons"},{q:2,u:"",n:"oignons"},{q:10,u:"cl",n:"crème fraîche"},{q:5,u:"cl",n:"vin blanc"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Épluchez les pommes de terre et coupez-les en morceaux. Faites-les cuire 20 min à l'eau bouillante salée, puis égouttez et coupez-les en rondelles.","Épluchez et émincez les oignons.","Faites revenir les oignons et les lardons dans une poêle 5 min, sans matière grasse.","Versez le vin blanc et laissez évaporer 2 min.","Préchauffez le four à 200°C (th. 6-7).","Dans un plat, disposez une couche de pommes de terre, puis une couche du mélange lardons-oignons. Répétez.","Arrosez de crème.","Coupez le reblochon en deux dans l'épaisseur et posez les deux moitiés sur le dessus, croûte vers le haut.","Enfournez 25 min : le fromage doit être fondu, coulant et doré.","Servez bien chaud avec une salade verte."]},
  {id:"yassa",nom:"Poulet yassa",emoji:"🍗",cat:"Plat",prep:20,cuisson:40,portions:4,diff:"Moyen",
   ing:[{q:4,u:"",n:"cuisses de poulet"},{q:4,u:"",n:"oignons"},{q:3,u:"",n:"citrons"},{q:1,u:"c. à soupe",n:"moutarde"},{q:3,u:"",n:"gousses d'ail"},{q:3,u:"c. à soupe",n:"huile"},{q:2,u:"",n:"feuilles de laurier"},{q:1,u:"pincée",n:"piment"},{q:200,u:"g",n:"riz"}],
   etapes:["Coupez le poulet en morceaux si nécessaire. Pressez les citrons.","Dans un saladier, mélangez le poulet avec le jus de citron, la moutarde, l'ail écrasé et un peu d'huile. Laissez mariner 30 min.","Épluchez et émincez finement les oignons (il en faut beaucoup, c'est la base du plat).","Égouttez le poulet en gardant la marinade. Faites-le dorer à la poêle dans un peu d'huile, puis réservez.","Dans une cocotte, faites fondre les oignons à feu doux 15 min, en remuant, jusqu'à ce qu'ils soient bien tendres.","Ajoutez la marinade réservée, le laurier et le piment.","Remettez le poulet et couvrez d'eau à hauteur. Salez.","Laissez mijoter 30 min à feu doux.","Pendant ce temps, faites cuire le riz.","Goûtez la sauce, rectifiez l'assaisonnement et servez le poulet et les oignons sur le riz."]},
  {id:"saumoncreme",nom:"Saumon au four à la crème",emoji:"🐟",cat:"Plat",prep:10,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"pavés de saumon"},{q:20,u:"cl",n:"crème fraîche"},{q:2,u:"",n:"échalotes"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"aneth"},{q:20,u:"g",n:"beurre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez un plat allant au four.","Épluchez et ciselez finement les échalotes. Pressez le citron.","Déposez les pavés de saumon dans le plat, côté peau en dessous.","Répartissez les échalotes autour et arrosez du jus de citron.","Nappez les pavés de crème et parsemez d'aneth. Salez et poivrez.","Enfournez 18 à 20 min : le saumon est cuit quand sa chair devient rosée pâle et se détache facilement à la fourchette.","Servez avec du riz ou des légumes vapeur, en nappant de la sauce du plat."]},
  {id:"saumonteriyaki",nom:"Pavé de saumon teriyaki",emoji:"🐟",cat:"Plat",prep:10,cuisson:12,portions:2,diff:"Facile",
   ing:[{q:2,u:"",n:"pavés de saumon"},{q:3,u:"c. à soupe",n:"sauce soja"},{q:2,u:"c. à soupe",n:"miel"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"",n:"gousse d'ail"},{q:1,u:"c. à soupe",n:"graines de sésame"},{q:1,u:"c. à soupe",n:"huile"},{q:150,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Préparez la sauce : mélangez la sauce soja, le miel, le gingembre et l'ail râpés.","Faites chauffer l'huile dans une poêle à feu moyen-vif.","Posez les pavés de saumon côté peau et laissez cuire 3 min sans y toucher (la peau devient croustillante).","Retournez-les délicatement et faites cuire 2 min.","Versez la sauce dans la poêle et laissez-la réduire 3 min en arrosant le saumon : elle devient brillante et nappe le poisson.","Parsemez de graines de sésame et servez avec le riz."]},
  {id:"cabillaud",nom:"Dos de cabillaud rôti",emoji:"🐟",cat:"Plat",prep:10,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"dos de cabillaud"},{q:200,u:"g",n:"tomates cerises"},{q:2,u:"",n:"gousses d'ail"},{q:3,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"thym"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7). Huilez légèrement un plat.","Lavez les tomates cerises. Épluchez et émincez l'ail. Pressez le citron.","Déposez les dos de cabillaud dans le plat.","Répartissez les tomates cerises et l'ail autour.","Arrosez d'huile d'olive et de jus de citron. Salez, poivrez et parsemez de thym.","Enfournez 15 min : le poisson est cuit quand sa chair est opaque et se détache en flocons.","Servez avec du riz ou une purée, arrosé du jus du plat."]},
  {id:"meuniere",nom:"Filet de poisson meunière",emoji:"🐟",cat:"Plat",prep:10,cuisson:10,portions:2,diff:"Facile",
   ing:[{q:2,u:"",n:"filets de poisson blanc"},{q:3,u:"c. à soupe",n:"farine"},{q:40,u:"g",n:"beurre"},{q:1,u:"",n:"citron"},{q:2,u:"c. à soupe",n:"persil"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Sortez les filets et épongez-les avec du papier absorbant. Salez et poivrez.","Farinez-les légèrement des deux côtés et tapotez pour retirer l'excédent (cela donne une belle croûte dorée).","Faites chauffer le beurre dans une poêle à feu moyen jusqu'à ce qu'il mousse.","Déposez les filets et faites-les cuire 3 min sans y toucher.","Retournez-les délicatement avec une spatule et faites cuire 3 min de l'autre côté.","Pressez le citron dans la poêle pour déglacer : le beurre citronné va napper le poisson.","Parsemez de persil ciselé et servez aussitôt, arrosé du beurre."]},
  {id:"moules",nom:"Moules marinières",emoji:"🦪",cat:"Plat",prep:15,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:2,u:"kg",n:"moules"},{q:3,u:"",n:"échalotes"},{q:2,u:"",n:"gousses d'ail"},{q:20,u:"cl",n:"vin blanc"},{q:40,u:"g",n:"beurre"},{q:4,u:"c. à soupe",n:"persil"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Triez les moules : jetez celles qui sont cassées, ou ouvertes et qui ne se referment pas quand vous les tapotez. Rincez-les plusieurs fois à l'eau froide et retirez les filaments (les barbes).","Épluchez et ciselez les échalotes et l'ail.","Faites fondre le beurre dans une très grande casserole. Faites revenir les échalotes et l'ail 2 min.","Versez le vin blanc et portez à ébullition.","Ajoutez les moules et couvrez immédiatement.","Laissez cuire 5 à 7 min à feu vif en secouant la casserole une ou deux fois, jusqu'à ce que les moules soient ouvertes.","Jetez celles qui sont restées fermées.","Poivrez, parsemez de persil et servez aussitôt avec des frites."]},
  {id:"paella",nom:"Paella",emoji:"🥘",cat:"Plat",prep:30,cuisson:40,portions:6,diff:"Difficile",
   ing:[{q:500,u:"g",n:"riz rond"},{q:4,u:"",n:"cuisses de poulet"},{q:150,u:"g",n:"chorizo"},{q:200,u:"g",n:"crevettes"},{q:500,u:"g",n:"moules"},{q:1,u:"",n:"poivron rouge"},{q:100,u:"g",n:"petits pois"},{q:1,u:"",n:"oignon"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"pincée",n:"safran"},{q:200,u:"g",n:"tomates concassées"},{q:1,u:"l",n:"bouillon"},{q:3,u:"c. à soupe",n:"huile"}],
   etapes:["Faites chauffer l'huile dans une grande poêle (ou un plat à paella) à feu moyen. Faites dorer les cuisses de poulet sur toutes les faces, puis réservez.","Coupez le chorizo en rondelles et faites-le colorer 2 min. Réservez avec le poulet.","Épluchez et émincez l'oignon et l'ail. Lavez le poivron, retirez les graines et émincez-le.","Dans la même poêle, faites revenir l'oignon, l'ail et le poivron 5 min.","Ajoutez les tomates concassées et laissez cuire 3 min.","Ajoutez le riz et remuez 2 min pour bien l'enrober.","Versez le bouillon chaud avec le safran. Remettez le poulet et le chorizo. Répartissez le riz uniformément.","Laissez cuire 15 min à feu moyen sans remuer (le riz doit rester à plat).","Disposez les crevettes, les moules nettoyées et les petits pois sur le dessus.","Poursuivez 10 min, jusqu'à ce que le riz ait absorbé le liquide et que les moules soient ouvertes.","Coupez le feu, couvrez d'un torchon et laissez reposer 5 min avant de servir."]},
  {id:"gambas",nom:"Gambas à l'ail",emoji:"🦐",cat:"Plat",prep:10,cuisson:10,portions:2,diff:"Facile",
   ing:[{q:12,u:"",n:"gambas"},{q:4,u:"",n:"gousses d'ail"},{q:3,u:"c. à soupe",n:"persil"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"piment"},{q:1,u:"",n:"citron"}],
   etapes:["Décortiquez les gambas si nécessaire (gardez éventuellement la queue). Épluchez et émincez finement l'ail.","Lavez et ciselez le persil. Pressez le citron.","Faites chauffer l'huile d'olive dans une poêle à feu moyen avec l'ail et le piment, jusqu'à ce que l'ail commence à parfumer (sans le brûler).","Ajoutez les gambas et faites-les cuire 2 min de chaque côté : elles sont prêtes quand elles deviennent roses et fermes.","Arrosez du jus de citron.","Parsemez de persil et servez aussitôt avec du pain pour saucer."]},
  {id:"papillote",nom:"Papillote de saumon",emoji:"🐟",cat:"Plat",prep:10,cuisson:20,portions:2,diff:"Facile",
   ing:[{q:2,u:"",n:"pavés de saumon"},{q:1,u:"",n:"courgette"},{q:1,u:"",n:"carotte"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"aneth"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 190°C (th. 6-7).","Lavez la courgette et la carotte. Épluchez la carotte. Taillez les deux en fines lamelles (à l'économe, c'est plus rapide).","Pressez le citron.","Découpez deux grandes feuilles de papier cuisson. Déposez un pavé de saumon au centre de chacune, avec les lamelles de légumes autour.","Arrosez d'huile d'olive et de jus de citron. Salez, poivrez et parsemez d'aneth.","Refermez les papillotes hermétiquement en repliant bien les bords (la vapeur doit rester à l'intérieur).","Enfournez 20 min : la papillote gonfle légèrement.","Ouvrez avec précaution (la vapeur est brûlante) et servez directement dans la papillote."]},
  {id:"currycrevettes",nom:"Curry de crevettes",emoji:"🦐",cat:"Plat",prep:15,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"crevettes"},{q:40,u:"cl",n:"lait de coco"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:2,u:"c. à soupe",n:"pâte de curry"},{q:1,u:"pincée",n:"coriandre"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Épluchez et hachez l'oignon, l'ail et le gingembre.","Faites chauffer l'huile dans une sauteuse à feu moyen. Faites revenir l'oignon 3 min, puis l'ail et le gingembre 1 min.","Ajoutez la pâte de curry et mélangez 1 min.","Versez le lait de coco et portez à petit frémissement. Laissez cuire 5 min.","Ajoutez les crevettes et laissez cuire 5 min : elles sont prêtes quand elles sont roses et fermes (ne les cuisez pas trop, sinon elles durcissent).","Parsemez de coriandre et servez avec le riz."]},
  {id:"fishchips",nom:"Fish and chips",emoji:"🐟",cat:"Plat",prep:20,cuisson:20,portions:4,diff:"Moyen",
   ing:[{q:4,u:"",n:"filets de cabillaud"},{q:200,u:"g",n:"farine"},{q:25,u:"cl",n:"bière"},{q:800,u:"g",n:"pommes de terre"},{q:1,u:"c. à café",n:"levure chimique"},{q:1,u:"l",n:"huile de friture"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez les pommes de terre et coupez-les en frites régulières. Épongez-les dans un torchon.","Préparez la pâte à beignet : mélangez la farine et la levure, puis versez la bière petit à petit en fouettant, jusqu'à obtenir une pâte lisse.","Faites chauffer l'huile de friture à 180°C (un morceau de pain doit y dorer en 30 secondes).","Plongez les frites et faites-les cuire 8 min. Égouttez-les sur du papier absorbant (elles finiront de dorer plus tard).","Trempez chaque filet de cabillaud dans la pâte pour bien l'enrober.","Plongez-les dans l'huile chaude et faites-les cuire 5 à 6 min, jusqu'à ce que la pâte soit dorée et croustillante. Égouttez.","Replongez les frites 2 min dans l'huile pour les rendre bien croustillantes.","Salez les frites et servez aussitôt avec le poisson."]},
  {id:"pesto",nom:"Pâtes au pesto",emoji:"🌿",cat:"Plat",prep:10,cuisson:12,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"pâtes"},{q:1,u:"",n:"bouquet de basilic"},{q:40,u:"g",n:"pignons de pin"},{q:60,u:"g",n:"parmesan"},{q:1,u:"",n:"gousse d'ail"},{q:8,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Portez une grande casserole d'eau salée à ébullition et faites-y cuire les pâtes selon le paquet.","Pendant ce temps, préparez le pesto : mettez le basilic lavé, les pignons, l'ail épluché, le parmesan et l'huile d'olive dans un mixeur.","Mixez jusqu'à obtenir une pâte verte et lisse. Salez.","Avant d'égoutter les pâtes, prélevez un peu d'eau de cuisson.","Égouttez les pâtes et remettez-les dans la casserole, feu éteint.","Ajoutez le pesto et mélangez. Détendez avec un peu d'eau de cuisson pour bien enrober les pâtes.","Servez aussitôt avec un peu de parmesan (ne réchauffez pas le pesto, il perdrait sa belle couleur)."]},
  {id:"patessaumon",nom:"Pâtes au saumon",emoji:"🍝",cat:"Plat",prep:10,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"pâtes"},{q:150,u:"g",n:"saumon fumé"},{q:20,u:"cl",n:"crème fraîche"},{q:1,u:"",n:"échalote"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"aneth"},{q:20,u:"g",n:"beurre"}],
   etapes:["Faites cuire les pâtes dans une grande casserole d'eau bouillante salée.","Pendant ce temps, épluchez et ciselez l'échalote. Coupez le saumon fumé en lanières. Pressez le citron.","Faites revenir l'échalote dans le beurre 2 min à feu doux.","Ajoutez la crème et laissez frémir 2 min.","Coupez le feu, puis ajoutez le saumon fumé (il ne doit pas cuire, juste tiédir).","Assaisonnez avec le jus de citron, l'aneth et du poivre.","Égouttez les pâtes et mélangez-les à la sauce. Servez aussitôt."]},
  {id:"arrabbiata",nom:"Penne all'arrabbiata",emoji:"🌶️",cat:"Plat",prep:10,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"penne"},{q:400,u:"g",n:"tomates concassées"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"",n:"piment"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:2,u:"c. à soupe",n:"persil"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Faites cuire les penne dans une grande casserole d'eau bouillante salée.","Épluchez et émincez l'ail. Émincez le piment (retirez les graines pour qu'il soit moins fort).","Faites chauffer l'huile d'olive dans une poêle à feu moyen. Faites revenir l'ail et le piment 1 min, sans les brûler.","Ajoutez les tomates concassées. Salez.","Laissez mijoter 12 min à feu doux : la sauce épaissit.","Égouttez les penne et versez-les dans la poêle avec la sauce.","Mélangez sur le feu 1 min pour bien enrober.","Parsemez de persil et servez."]},
  {id:"macncheese",nom:"Mac and cheese",emoji:"🧀",cat:"Plat",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"macaronis"},{q:200,u:"g",n:"cheddar"},{q:50,u:"cl",n:"lait"},{q:40,u:"g",n:"beurre"},{q:40,u:"g",n:"farine"},{q:30,u:"g",n:"chapelure"},{q:1,u:"pincée",n:"muscade"}],
   etapes:["Faites cuire les macaronis dans l'eau bouillante salée, un peu moins que le temps indiqué (ils finiront au four). Égouttez.","Préchauffez le four à 190°C (th. 6-7).","Préparez la béchamel : faites fondre le beurre, ajoutez la farine et mélangez 1 min, puis versez le lait petit à petit en fouettant jusqu'à épaississement.","Coupez le feu. Ajoutez le cheddar râpé et la muscade, et mélangez jusqu'à ce que le fromage soit fondu.","Ajoutez les macaronis à la sauce et mélangez.","Versez le tout dans un plat à gratin et parsemez de chapelure.","Enfournez 15 min, jusqu'à ce que le dessus soit doré et gratiné.","Servez bien chaud."]},
  {id:"gnocchicreme",nom:"Gnocchis à la crème",emoji:"🥔",cat:"Plat",prep:5,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"gnocchis"},{q:20,u:"cl",n:"crème fraîche"},{q:200,u:"g",n:"champignons"},{q:100,u:"g",n:"lardons"},{q:40,u:"g",n:"parmesan"},{q:1,u:"",n:"oignon"},{q:1,u:"c. à soupe",n:"huile"}],
   etapes:["Épluchez et émincez l'oignon. Nettoyez et émincez les champignons.","Faites chauffer l'huile dans une poêle. Faites revenir l'oignon, les lardons et les champignons 6 min.","Ajoutez la crème et laissez frémir 3 min.","Pendant ce temps, plongez les gnocchis dans une casserole d'eau bouillante salée.","Ils sont cuits quand ils remontent à la surface (2 à 3 min). Égouttez-les.","Ajoutez les gnocchis à la sauce et mélangez délicatement.","Parsemez de parmesan, poivrez et servez aussitôt."]},
  {id:"rizcantonais",nom:"Riz cantonais",emoji:"🍚",cat:"Plat",prep:15,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:300,u:"g",n:"riz"},{q:3,u:"",n:"œufs"},{q:150,u:"g",n:"jambon"},{q:100,u:"g",n:"petits pois"},{q:2,u:"",n:"oignons nouveaux"},{q:3,u:"c. à soupe",n:"sauce soja"},{q:2,u:"c. à soupe",n:"huile"}],
