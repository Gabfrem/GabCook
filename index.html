   etapes:["Faites cuire le riz selon le paquet, puis laissez-le refroidir (l'idéal est de le cuire la veille : un riz froid ne colle pas).","Battez les œufs. Faites-en une omelette fine dans une poêle huilée, puis coupez-la en lanières.","Coupez le jambon en petits dés. Émincez les oignons nouveaux.","Faites chauffer l'huile dans un wok à feu vif. Faites sauter le jambon et les petits pois 2 min.","Ajoutez le riz froid et faites-le sauter 3 min en remuant, pour bien le réchauffer.","Ajoutez l'omelette en lanières, la sauce soja et les oignons nouveaux.","Mélangez 1 min et servez aussitôt."]},
  {id:"aglioolio",nom:"Spaghetti aglio e olio",emoji:"🧄",cat:"Plat",prep:5,cuisson:12,portions:2,diff:"Facile",
   ing:[{q:200,u:"g",n:"spaghetti"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"",n:"piment"},{q:5,u:"c. à soupe",n:"huile d'olive"},{q:3,u:"c. à soupe",n:"persil"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Faites cuire les spaghetti dans une grande casserole d'eau bien salée.","Pendant ce temps, épluchez et émincez finement l'ail. Émincez le piment.","Faites chauffer l'huile d'olive dans une poêle à feu doux. Ajoutez l'ail et le piment et laissez-les dorer très doucement (l'ail ne doit surtout pas brûler, sinon il devient amer).","Avant d'égoutter les pâtes, prélevez un peu d'eau de cuisson.","Égouttez les spaghetti et versez-les dans la poêle.","Ajoutez un peu d'eau de cuisson et mélangez vivement : l'huile et l'eau forment une sauce qui enrobe les pâtes.","Parsemez de persil et servez aussitôt."]},
  {id:"onepot",nom:"One pot pasta tomate",emoji:"🍅",cat:"Plat",prep:10,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"pâtes"},{q:300,u:"g",n:"tomates cerises"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:70,u:"cl",n:"bouillon"},{q:1,u:"poignée",n:"basilic"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:40,u:"g",n:"parmesan"}],
   etapes:["Lavez les tomates cerises et coupez-les en deux. Épluchez et émincez l'oignon et l'ail.","Dans une grande sauteuse, mettez les pâtes crues, les tomates, l'oignon et l'ail.","Ajoutez l'huile d'olive, puis versez le bouillon (il doit recouvrir les pâtes). Salez.","Portez à ébullition, puis laissez cuire 10 à 12 min à feu moyen en remuant souvent, pour que les pâtes n'attachent pas.","Les pâtes sont prêtes quand elles sont tendres et que le liquide a réduit en une sauce nappante (ajoutez un peu d'eau si ça sèche trop vite).","Ajoutez le basilic ciselé et le parmesan.","Mélangez et servez directement dans la sauteuse."]},
  {id:"lasagnesvege",nom:"Lasagnes végétariennes",emoji:"🍆",cat:"Plat",prep:30,cuisson:45,portions:6,diff:"Moyen",
   ing:[{q:250,u:"g",n:"plaques de lasagnes"},{q:1,u:"",n:"aubergine"},{q:2,u:"",n:"courgettes"},{q:800,u:"g",n:"tomates concassées"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:50,u:"g",n:"beurre"},{q:50,u:"g",n:"farine"},{q:60,u:"cl",n:"lait"},{q:150,u:"g",n:"gruyère râpé"},{q:3,u:"c. à soupe",n:"huile d'olive"}],
   etapes:["Lavez l'aubergine et les courgettes, puis coupez-les en petits dés.","Faites chauffer l'huile d'olive dans une poêle. Faites revenir les dés d'aubergine et de courgette 8 min.","Épluchez et hachez l'oignon et l'ail, ajoutez-les avec les tomates concassées. Salez et laissez mijoter 15 min.","Préparez la béchamel : faites fondre le beurre, ajoutez la farine, mélangez, puis versez le lait en fouettant jusqu'à épaississement.","Préchauffez le four à 180°C (th. 6).","Dans un plat, alternez des couches de plaques de lasagnes, de légumes et de béchamel.","Terminez par de la béchamel et parsemez de gruyère râpé.","Enfournez 40 min : le dessus doit être doré et les plaques tendres.","Laissez reposer 10 min avant de couper."]},
  {id:"rizpilaf",nom:"Riz pilaf",emoji:"🍚",cat:"Plat",prep:5,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:300,u:"g",n:"riz"},{q:1,u:"",n:"oignon"},{q:60,u:"cl",n:"bouillon"},{q:30,u:"g",n:"beurre"},{q:1,u:"",n:"feuille de laurier"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez et émincez finement l'oignon.","Faites fondre le beurre dans une casserole à feu moyen. Faites revenir l'oignon 3 min sans le colorer.","Ajoutez le riz et remuez 2 min : les grains deviennent nacrés (translucides).","Versez le bouillon chaud (environ 1,5 fois le volume du riz) et ajoutez le laurier. Salez.","Portez à ébullition, puis baissez le feu au minimum et couvrez.","Laissez cuire 18 min sans soulever le couvercle (la vapeur cuit le riz).","Coupez le feu et laissez reposer 5 min, toujours couvert.","Égrainez à la fourchette et servez."]},
  {id:"dahl",nom:"Dahl de lentilles corail",emoji:"🍛",cat:"Plat",prep:10,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:250,u:"g",n:"lentilles corail"},{q:20,u:"cl",n:"lait de coco"},{q:400,u:"g",n:"tomates concassées"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"c. à soupe",n:"curry"},{q:1,u:"c. à café",n:"curcuma"},{q:1,u:"c. à soupe",n:"huile"}],
   etapes:["Rincez les lentilles corail à l'eau froide dans une passoire.","Épluchez et hachez l'oignon, l'ail et le gingembre.","Faites chauffer l'huile dans une casserole à feu moyen. Faites revenir l'oignon 4 min, puis l'ail et le gingembre 1 min.","Ajoutez les épices (curcuma, cumin) et mélangez 30 secondes pour libérer les arômes.","Ajoutez les lentilles corail et mélangez pour les enrober.","Versez le lait de coco et de l'eau (environ deux fois le volume des lentilles). Salez.","Portez à ébullition, puis laissez mijoter 20 min à feu doux en remuant de temps en temps. Les lentilles corail se défont et épaississent le dahl.","Ajoutez un peu d'eau si c'est trop épais. Goûtez et rectifiez le sel.","Parsemez de coriandre et servez avec du riz ou du pain naan."]},
  {id:"currylegumes",nom:"Curry de légumes",emoji:"🍛",cat:"Plat",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:3,u:"",n:"pommes de terre"},{q:2,u:"",n:"carottes"},{q:1,u:"",n:"courgette"},{q:0.5,u:"",n:"chou-fleur"},{q:40,u:"cl",n:"lait de coco"},{q:1,u:"",n:"oignon"},{q:2,u:"c. à soupe",n:"pâte de curry"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Lavez et coupez tous les légumes en morceaux réguliers : chou-fleur en bouquets, carottes en rondelles, courgette en dés, pommes de terre en cubes.","Épluchez et hachez l'oignon, l'ail et le gingembre.","Faites chauffer l'huile dans une sauteuse. Faites revenir l'oignon 4 min, puis l'ail et le gingembre 1 min.","Ajoutez la pâte de curry et mélangez 1 min.","Ajoutez les légumes les plus durs (pommes de terre, carottes, chou-fleur) et mélangez 2 min.","Versez le lait de coco. Portez à frémissement, couvrez et laissez cuire 15 min.","Ajoutez la courgette et poursuivez 10 min, jusqu'à ce que tous les légumes soient tendres (la pointe d'un couteau s'y enfonce facilement).","Salez, parsemez de coriandre et servez avec le riz."]},
  {id:"soupelegumes",nom:"Soupe de légumes",emoji:"🥕",cat:"Entrée",prep:15,cuisson:30,portions:4,diff:"Facile",
   ing:[{q:2,u:"",n:"pommes de terre"},{q:3,u:"",n:"carottes"},{q:1,u:"",n:"poireau"},{q:1,u:"",n:"courgette"},{q:1,u:"",n:"oignon"},{q:1,u:"l",n:"bouillon"},{q:5,u:"cl",n:"crème"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez tous les légumes : pommes de terre, carottes, poireau, oignon.","Coupez-les en morceaux (plus ils sont petits, plus ça cuit vite).","Faites chauffer un peu d'huile dans une grande casserole. Faites revenir l'oignon et le poireau 3 min.","Ajoutez le reste des légumes et couvrez d'eau (jusqu'à 2 cm au-dessus).","Salez, portez à ébullition, puis baissez le feu et laissez cuire 25 min à couvert. Les légumes doivent être bien tendres.","Mixez la soupe au mixeur plongeant jusqu'à obtenir une texture lisse.","Ajoutez un peu d'eau si elle est trop épaisse. Goûtez et rectifiez le sel.","Poivrez et servez chaud, éventuellement avec un filet de crème."]},
  {id:"veloutepotiron",nom:"Velouté de potiron",emoji:"🎃",cat:"Entrée",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:800,u:"g",n:"potiron"},{q:1,u:"",n:"pomme de terre"},{q:1,u:"",n:"oignon"},{q:70,u:"cl",n:"bouillon"},{q:10,u:"cl",n:"crème fraîche"},{q:1,u:"pincée",n:"muscade"},{q:20,u:"g",n:"beurre"}],
   etapes:["Épluchez le potiron, retirez les graines et coupez la chair en cubes.","Épluchez et émincez l'oignon. Épluchez et coupez la pomme de terre en morceaux (elle rend le velouté onctueux).","Faites chauffer un peu d'huile dans une casserole. Faites revenir l'oignon 3 min.","Ajoutez le potiron et la pomme de terre.","Couvrez d'eau ou de bouillon à hauteur. Salez.","Portez à ébullition, puis laissez cuire 25 min à feu moyen : les morceaux doivent être fondants.","Mixez finement, puis ajoutez la crème et une pincée de muscade.","Réchauffez doucement, poivrez et servez."]},
  {id:"gratincourgettes",nom:"Gratin de courgettes",emoji:"🥒",cat:"Plat",prep:15,cuisson:35,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"courgettes"},{q:20,u:"cl",n:"crème fraîche"},{q:2,u:"",n:"œufs"},{q:100,u:"g",n:"gruyère râpé"},{q:2,u:"",n:"gousses d'ail"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"muscade"}],
   etapes:["Préchauffez le four à 190°C (th. 6-7).","Lavez les courgettes et coupez-les en rondelles.","Faites-les revenir 8 min à la poêle dans un peu d'huile d'olive, pour qu'elles rendent leur eau (sinon le gratin serait trop liquide).","Épluchez et hachez l'ail, ajoutez-le en fin de cuisson.","Dans un bol, battez les œufs avec la crème. Salez, poivrez et ajoutez la moitié du gruyère.","Mélangez les courgettes à cet appareil.","Versez dans un plat à gratin et parsemez du reste de gruyère.","Enfournez 25 min : le gratin doit être pris et bien doré.","Laissez tiédir 5 min avant de servir."]},
  {id:"gratinchoufleur",nom:"Gratin de chou-fleur",emoji:"🥦",cat:"Plat",prep:15,cuisson:30,portions:4,diff:"Facile",
   ing:[{q:1,u:"",n:"chou-fleur"},{q:50,u:"cl",n:"lait"},{q:40,u:"g",n:"beurre"},{q:40,u:"g",n:"farine"},{q:100,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"muscade"}],
   etapes:["Détaillez le chou-fleur en bouquets et lavez-les. Faites-les cuire 10 min à l'eau bouillante salée : ils doivent être tendres mais pas en purée. Égouttez bien.","Préchauffez le four à 200°C (th. 6-7).","Préparez la béchamel : faites fondre le beurre, ajoutez la farine et mélangez 1 min, puis versez le lait petit à petit en fouettant jusqu'à épaississement. Ajoutez la muscade, salez et poivrez.","Coupez le feu et ajoutez la moitié du gruyère à la béchamel.","Disposez les bouquets de chou-fleur dans un plat.","Nappez de béchamel.","Parsemez du reste de gruyère.","Enfournez 20 min, jusqu'à ce que le dessus soit gratiné et doré."]},
  {id:"shakshuka",nom:"Shakshuka",emoji:"🍳",cat:"Plat",prep:10,cuisson:25,portions:2,diff:"Facile",
   ing:[{q:4,u:"",n:"œufs"},{q:400,u:"g",n:"tomates concassées"},{q:1,u:"",n:"poivron rouge"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"c. à café",n:"paprika"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"coriandre"}],
   etapes:["Lavez les poivrons, retirez les graines et coupez-les en lanières. Épluchez et émincez l'oignon et l'ail.","Faites chauffer l'huile d'olive dans une grande poêle. Faites revenir l'oignon et les poivrons 8 min.","Ajoutez l'ail, le cumin et le paprika, et mélangez 1 min.","Versez les tomates concassées. Salez et laissez mijoter 10 min : la sauce épaissit.","Avec le dos d'une cuillère, creusez des petits puits dans la sauce.","Cassez un œuf dans chaque puits.","Couvrez et laissez cuire 6 à 8 min à feu doux : les blancs doivent être pris mais les jaunes encore coulants.","Parsemez de coriandre et servez directement dans la poêle, avec du pain."]},
  {id:"tortilla",nom:"Tortilla espagnole",emoji:"🥔",cat:"Plat",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"pommes de terre"},{q:6,u:"",n:"œufs"},{q:1,u:"",n:"oignon"},{q:6,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez les pommes de terre et coupez-les en fines rondelles. Épluchez et émincez l'oignon.","Faites chauffer une bonne quantité d'huile d'olive dans une poêle. Ajoutez les pommes de terre et l'oignon.","Laissez cuire doucement 15 min en remuant de temps en temps : les pommes de terre doivent devenir tendres sans dorer.","Égouttez-les pour retirer l'excès d'huile.","Battez les œufs dans un grand saladier, salez, puis ajoutez les pommes de terre et l'oignon. Mélangez.","Faites chauffer un peu d'huile dans la poêle. Versez le mélange et laissez cuire 6 min à feu doux : les bords prennent.","Posez une grande assiette sur la poêle et retournez la tortilla d'un coup (faites-le au-dessus de l'évier). Faites-la glisser à nouveau dans la poêle, côté cru en dessous.","Faites cuire encore 4 min : le centre doit être juste pris.","Laissez tiédir et servez en parts."]},
  {id:"falafels",nom:"Falafels",emoji:"🧆",cat:"Plat",prep:20,cuisson:15,portions:4,diff:"Moyen",
   ing:[{q:250,u:"g",n:"pois chiches secs"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"bouquet de persil"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"c. à café",n:"coriandre moulue"},{q:2,u:"c. à soupe",n:"farine"},{q:50,u:"cl",n:"huile de friture"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Important : utilisez des pois chiches secs trempés une nuit (les pois chiches en boîte rendraient la pâte trop humide). Égouttez-les.","Épluchez l'oignon et l'ail.","Mettez les pois chiches, l'oignon, l'ail, le persil, le cumin et le sel dans un mixeur.","Mixez par à-coups jusqu'à obtenir une pâte grossière qui se tient quand on la presse (pas une purée lisse).","Ajoutez la levure, mélangez et laissez reposer 15 min.","Formez des petites boules aplaties avec les mains.","Faites chauffer l'huile de friture à 170°C. Plongez les falafels par petites quantités.","Faites-les frire 3 à 4 min, jusqu'à ce qu'ils soient bien dorés et croustillants.","Égouttez sur du papier absorbant et servez avec une sauce au yaourt."]},
  {id:"parmigiana",nom:"Aubergines à la parmigiana",emoji:"🍆",cat:"Plat",prep:25,cuisson:35,portions:4,diff:"Moyen",
   ing:[{q:3,u:"",n:"aubergines"},{q:800,u:"g",n:"tomates concassées"},{q:2,u:"",n:"boules de mozzarella"},{q:80,u:"g",n:"parmesan"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"poignée",n:"basilic"},{q:6,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"oignon"}],
   etapes:["Lavez les aubergines et coupez-les en tranches dans la longueur (environ 1 cm).","Faites-les dorer à la poêle dans l'huile d'olive, 3 min de chaque côté, puis égouttez-les sur du papier absorbant.","Préparez la sauce tomate : faites revenir l'ail haché dans un peu d'huile, ajoutez les tomates concassées et le basilic, salez et laissez mijoter 15 min.","Préchauffez le four à 180°C (th. 6).","Dans un plat, étalez un peu de sauce tomate.","Disposez une couche d'aubergines, de la sauce, du parmesan et de la mozzarella en morceaux.","Répétez les couches jusqu'à épuisement, en terminant par de la mozzarella et du parmesan.","Enfournez 30 min : le dessus doit être doré et bouillonnant.","Laissez reposer 10 min avant de servir."]},
  {id:"currypoischiches",nom:"Curry de pois chiches",emoji:"🍛",cat:"Plat",prep:10,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:400,u:"g",n:"pois chiches"},{q:400,u:"g",n:"tomates concassées"},{q:20,u:"cl",n:"lait de coco"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"",n:"morceau de gingembre"},{q:1,u:"c. à soupe",n:"curry"},{q:100,u:"g",n:"épinards"},{q:1,u:"c. à soupe",n:"huile"},{q:200,u:"g",n:"riz"}],
   etapes:["Faites cuire le riz selon le paquet et réservez-le au chaud.","Égouttez et rincez les pois chiches.","Épluchez et hachez l'oignon, l'ail et le gingembre.","Faites chauffer l'huile dans une sauteuse. Faites revenir l'oignon 4 min, puis l'ail et le gingembre 1 min.","Ajoutez la pâte de curry et mélangez 1 min.","Versez les tomates concassées et le lait de coco. Mélangez.","Ajoutez les pois chiches et laissez mijoter 15 min : la sauce épaissit.","Salez, parsemez de coriandre et servez avec le riz."]},
  {id:"buddhabowl",nom:"Buddha bowl",emoji:"🥗",cat:"Plat",prep:20,cuisson:20,portions:2,diff:"Facile",
   ing:[{q:150,u:"g",n:"quinoa"},{q:200,u:"g",n:"pois chiches"},{q:1,u:"",n:"avocat"},{q:1,u:"",n:"carotte"},{q:0.5,u:"",n:"concombre"},{q:100,u:"g",n:"chou rouge"},{q:2,u:"c. à soupe",n:"sauce soja"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à soupe",n:"graines de sésame"},{q:1,u:"",n:"citron"}],
   etapes:["Faites cuire le quinoa selon le paquet (rincez-le avant), puis laissez-le tiédir.","Préchauffez le four à 200°C. Coupez la patate douce en cubes, mélangez-les avec un filet d'huile, du sel et du paprika, puis enfournez 25 min jusqu'à ce qu'ils soient tendres et dorés.","Égouttez et rincez les pois chiches.","Lavez et coupez l'avocat en lamelles. Râpez la carotte. Coupez le concombre en dés.","Préparez la sauce : mélangez le yaourt, un peu de citron, du sel et un filet d'huile.","Dans un grand bol, disposez le quinoa au centre.","Arrangez tout autour, par petits tas : patate douce, pois chiches, avocat, carotte et concombre.","Nappez de sauce, parsemez de graines et servez."]},
  {id:"taboule",nom:"Taboulé",emoji:"🥗",cat:"Entrée",prep:20,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:250,u:"g",n:"semoule"},{q:3,u:"",n:"tomates"},{q:1,u:"",n:"concombre"},{q:1,u:"",n:"oignon"},{q:1,u:"",n:"bouquet de menthe"},{q:1,u:"",n:"bouquet de persil"},{q:2,u:"",n:"citrons"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Versez la semoule dans un saladier. Ajoutez un filet d'huile d'olive et mélangez (cela évite qu'elle colle).","Versez de l'eau chaude à hauteur, couvrez et laissez gonfler 10 min.","Égrainez la semoule à la fourchette.","Lavez et coupez les tomates en petits dés (retirez les pépins) et le concombre en dés.","Épluchez et émincez finement l'oignon. Lavez et ciselez la menthe et le persil.","Ajoutez tous les légumes et les herbes à la semoule.","Pressez les citrons et arrosez-en le taboulé, avec un filet d'huile d'olive. Salez et poivrez.","Mélangez et réservez au frais au moins 1h avant de servir (le taboulé est meilleur bien froid)."]},
  {id:"saladegrecque",nom:"Salade grecque",emoji:"🥗",cat:"Entrée",prep:15,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"tomates"},{q:1,u:"",n:"concombre"},{q:200,u:"g",n:"feta"},{q:1,u:"",n:"oignon rouge"},{q:100,u:"g",n:"olives noires"},{q:1,u:"pincée",n:"origan"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Lavez les tomates et coupez-les en quartiers. Lavez le concombre et coupez-le en demi-rondelles épaisses.","Lavez le poivron, retirez les graines et coupez-le en lanières. Épluchez et émincez finement l'oignon rouge.","Mettez tous les légumes dans un saladier.","Ajoutez les olives et la feta coupée en cubes.","Préparez la vinaigrette : mélangez l'huile d'olive, un peu de vinaigre, de l'origan, du sel et du poivre.","Arrosez la salade de vinaigrette.","Mélangez délicatement pour ne pas écraser la feta et servez."]},
  {id:"saladepates",nom:"Salade de pâtes",emoji:"🍝",cat:"Entrée",prep:15,cuisson:12,portions:4,diff:"Facile",
   ing:[{q:300,u:"g",n:"pâtes"},{q:200,u:"g",n:"tomates cerises"},{q:150,u:"g",n:"mozzarella"},{q:1,u:"",n:"poivron"},{q:80,u:"g",n:"olives"},{q:1,u:"poignée",n:"basilic"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à soupe",n:"vinaigre balsamique"}],
   etapes:["Faites cuire les pâtes dans l'eau bouillante salée, puis égouttez-les et passez-les sous l'eau froide pour les refroidir (elles ne colleront pas).","Lavez et coupez les tomates cerises en deux et le concombre en dés.","Coupez la mozzarella (ou la feta) en cubes.","Mettez les pâtes refroidies, les légumes, la mozzarella et les olives dans un grand saladier.","Préparez la vinaigrette : mélangez l'huile d'olive, le vinaigre, du sel et du poivre.","Ajoutez le basilic ciselé.","Versez la vinaigrette, mélangez et réservez au frais jusqu'au service."]},
  {id:"gaspacho",nom:"Gaspacho",emoji:"🍅",cat:"Entrée",prep:15,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:800,u:"g",n:"tomates mûres"},{q:1,u:"",n:"concombre"},{q:1,u:"",n:"poivron rouge"},{q:0.5,u:"",n:"oignon"},{q:1,u:"",n:"gousse d'ail"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à soupe",n:"vinaigre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Lavez les tomates et coupez-les en morceaux. Épluchez le concombre et coupez-le en morceaux. Lavez le poivron, retirez les graines et coupez-le.","Épluchez l'ail.","Mettez tous les légumes dans un mixeur ou un blender avec l'ail.","Ajoutez l'huile d'olive, un peu de vinaigre et du sel.","Mixez longuement jusqu'à obtenir une texture bien lisse.","Si c'est trop épais, ajoutez un peu d'eau froide et mixez à nouveau.","Goûtez et rectifiez le sel et le vinaigre.","Réservez au frais au moins 2h : le gaspacho se sert très froid, éventuellement avec des petits dés de légumes."]},
  {id:"coleslaw",nom:"Coleslaw",emoji:"🥬",cat:"Entrée",prep:15,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:0.5,u:"",n:"chou blanc"},{q:2,u:"",n:"carottes"},{q:3,u:"c. à soupe",n:"mayonnaise"},{q:2,u:"c. à soupe",n:"yaourt nature"},{q:1,u:"c. à café",n:"moutarde"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Émincez le chou blanc le plus finement possible (au couteau ou à la mandoline).","Épluchez les carottes et râpez-les.","Épluchez et émincez très finement l'oignon.","Mettez le chou, les carottes et l'oignon dans un grand saladier.","Préparez la sauce : mélangez la mayonnaise, un peu de vinaigre, une pointe de moutarde, du sel et du poivre.","Versez la sauce sur les légumes et mélangez bien.","Réservez au frais au moins 1h avant de servir : le chou s'attendrit et les saveurs se mélangent."]},
  {id:"veloutetomate",nom:"Velouté de tomate",emoji:"🍅",cat:"Entrée",prep:10,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:800,u:"g",n:"tomates"},{q:1,u:"",n:"oignon"},{q:2,u:"",n:"gousses d'ail"},{q:40,u:"cl",n:"bouillon"},{q:10,u:"cl",n:"crème fraîche"},{q:1,u:"poignée",n:"basilic"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sucre"}],
   etapes:["Épluchez et émincez l'oignon et l'ail.","Faites chauffer un peu d'huile d'olive dans une casserole. Faites revenir l'oignon et l'ail 4 min.","Ajoutez le concentré de tomate et mélangez 1 min.","Versez les tomates concassées et un peu d'eau ou de bouillon. Salez et ajoutez une pincée de sucre (cela adoucit l'acidité de la tomate).","Laissez mijoter 20 min à feu doux.","Mixez finement.","Ajoutez la crème, réchauffez doucement, poivrez.","Parsemez de basilic et servez chaud."]},
  {id:"tzatziki",nom:"Tzatziki",emoji:"🥒",cat:"Apéro",prep:15,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:2,u:"",n:"yaourts grecs"},{q:1,u:"",n:"concombre"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"c. à soupe",n:"menthe"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Lavez le concombre et râpez-le (avec ou sans la peau, au choix).","Mettez le concombre râpé dans une passoire, salez légèrement et laissez dégorger 15 min : il rend son eau, c'est essentiel pour un tzatziki qui ne soit pas liquide.","Pressez le concombre entre vos mains pour extraire le maximum d'eau.","Épluchez et écrasez l'ail. Ciselez la menthe (ou l'aneth).","Dans un bol, mélangez le yaourt grec, le concombre pressé, l'ail et la menthe.","Ajoutez un filet d'huile d'olive et un peu de jus de citron. Salez et poivrez.","Mélangez et réservez au frais au moins 30 min avant de servir avec du pain pita."]},
  {id:"tapenade",nom:"Tapenade",emoji:"🫒",cat:"Apéro",prep:10,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:200,u:"g",n:"olives noires"},{q:2,u:"c. à soupe",n:"câpres"},{q:3,u:"",n:"filets d'anchois"},{q:1,u:"",n:"gousse d'ail"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"citron"}],
   etapes:["Dénoyautez les olives noires si elles ont encore leur noyau.","Égouttez les câpres. Épluchez l'ail.","Mettez les olives, les câpres, l'ail et les filets d'anchois dans un mixeur.","Ajoutez l'huile d'olive.","Mixez par à-coups jusqu'à obtenir une pâte (lisse ou avec des morceaux, selon votre goût).","Poivrez (inutile de saler, les olives et les anchois le sont déjà).","Servez sur des toasts grillés."]},
  {id:"caviaraubergine",nom:"Caviar d'aubergine",emoji:"🍆",cat:"Apéro",prep:10,cuisson:40,portions:4,diff:"Facile",
   ing:[{q:2,u:"",n:"aubergines"},{q:2,u:"",n:"gousses d'ail"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"citron"},{q:1,u:"c. à café",n:"cumin"},{q:2,u:"c. à soupe",n:"persil"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7).","Lavez les aubergines et piquez-les avec une fourchette (cela évite qu'elles éclatent).","Posez-les sur une plaque et enfournez 40 min : elles doivent être bien tendres et fripées.","Laissez-les tiédir, puis coupez-les en deux et récupérez la chair à la cuillère.","Épluchez et écrasez l'ail. Pressez le citron.","Mettez la chair d'aubergine, l'ail, le jus de citron et l'huile d'olive dans un bol.","Écrasez à la fourchette (ou mixez) jusqu'à obtenir une purée grossière.","Salez, poivrez et parsemez de persil. Servez avec du pain."]},
  {id:"bruschetta",nom:"Bruschetta",emoji:"🍅",cat:"Apéro",prep:15,cuisson:5,portions:4,diff:"Facile",
   ing:[{q:8,u:"",n:"tranches de pain de campagne"},{q:4,u:"",n:"tomates"},{q:2,u:"",n:"gousses d'ail"},{q:1,u:"poignée",n:"basilic"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Lavez les tomates et coupez-les en petits dés (retirez les pépins pour éviter le jus).","Épluchez et hachez très finement l'ail. Lavez et ciselez le basilic.","Dans un bol, mélangez les tomates, l'ail, le basilic, un filet d'huile d'olive, du sel et du poivre. Laissez reposer 10 min.","Coupez le pain en tranches et faites-les griller (au four, au grille-pain ou à la poêle).","Frottez chaque tranche chaude avec une gousse d'ail coupée (facultatif, mais parfumé).","Répartissez la préparation aux tomates sur les toasts.","Arrosez d'un filet d'huile d'olive et servez aussitôt (sinon le pain ramollit)."]},
  {id:"nachos",nom:"Nachos gratinés",emoji:"🧀",cat:"Apéro",prep:10,cuisson:10,portions:4,diff:"Facile",
   ing:[{q:200,u:"g",n:"chips de maïs"},{q:150,u:"g",n:"cheddar râpé"},{q:1,u:"",n:"tomate"},{q:0.5,u:"",n:"oignon rouge"},{q:2,u:"c. à soupe",n:"jalapeños"},{q:4,u:"c. à soupe",n:"crème fraîche"},{q:1,u:"pincée",n:"coriandre"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7).","Étalez les chips de maïs dans un plat allant au four, en une couche pas trop épaisse.","Parsemez généreusement de cheddar râpé.","Répartissez les tranches de jalapeños par-dessus.","Enfournez 8 min, jusqu'à ce que le fromage soit fondu et bouillonnant.","Pendant ce temps, préparez une guacamole ou une salsa rapide (tomates en dés, oignon, citron).","Sortez les nachos et servez aussitôt, avec la guacamole et de la crème pour tremper."]},
  {id:"oeufsbrouilles",nom:"Œufs brouillés",emoji:"🍳",cat:"Petit-déj",prep:5,cuisson:5,portions:2,diff:"Facile",
   ing:[{q:5,u:"",n:"œufs"},{q:20,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"crème fraîche"},{q:1,u:"c. à soupe",n:"ciboulette"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Cassez les œufs dans un bol. Salez, poivrez et battez-les à la fourchette.","Faites fondre le beurre dans une poêle antiadhésive à feu doux (le feu doux est la clé d'œufs crémeux).","Versez les œufs.","Attendez quelques secondes, puis remuez doucement avec une spatule en ramenant les bords vers le centre.","Continuez à remuer sans arrêt : les œufs prennent petit à petit en formant de petits amas crémeux.","Coupez le feu quand ils sont encore un peu baveux (ils finissent de cuire avec la chaleur).","Ajoutez la ciboulette ciselée et servez aussitôt sur du pain grillé."]},
  {id:"painperdu",nom:"Pain perdu",emoji:"🍞",cat:"Petit-déj",prep:10,cuisson:10,portions:4,diff:"Facile",
   ing:[{q:8,u:"",n:"tranches de pain rassis"},{q:3,u:"",n:"œufs"},{q:40,u:"cl",n:"lait"},{q:60,u:"g",n:"sucre"},{q:30,u:"g",n:"beurre"},{q:1,u:"c. à café",n:"vanille"},{q:1,u:"pincée",n:"cannelle"}],
   etapes:["Cassez les œufs dans un plat creux. Ajoutez le lait, le sucre et une pincée de cannelle, puis battez le tout.","Trempez chaque tranche de pain (du pain un peu rassis est idéal) dans le mélange, 30 secondes de chaque côté, pour qu'elle s'imbibe bien sans se déliter.","Faites fondre le beurre dans une poêle à feu moyen.","Déposez les tranches et faites-les dorer 2 à 3 min de chaque côté, jusqu'à ce qu'elles soient bien dorées.","Saupoudrez d'un peu de sucre.","Servez tiède, nature ou avec du sirop d'érable, de la confiture ou des fruits."]},
  {id:"gaufres",nom:"Gaufres",emoji:"🧇",cat:"Petit-déj",prep:15,cuisson:15,portions:6,diff:"Facile",
   ing:[{q:250,u:"g",n:"farine"},{q:3,u:"",n:"œufs"},{q:40,u:"cl",n:"lait"},{q:100,u:"g",n:"beurre fondu"},{q:50,u:"g",n:"sucre"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"c. à café",n:"vanille"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Dans un saladier, mélangez la farine, le sucre, la levure et le sel.","Séparez les blancs des jaunes d'œufs.","Ajoutez les jaunes et le lait aux ingrédients secs, et fouettez jusqu'à obtenir une pâte lisse.","Faites fondre le beurre et incorporez-le à la pâte.","Montez les blancs en neige ferme et incorporez-les délicatement (c'est ce qui rend les gaufres légères).","Faites chauffer le gaufrier et huilez-le légèrement si besoin.","Versez une louche de pâte, refermez et laissez cuire 3 à 4 min, jusqu'à ce que la gaufre soit dorée.","Servez tiède avec du sucre glace, du chocolat ou de la chantilly."]},
  {id:"muffinsmyrtilles",nom:"Muffins aux myrtilles",emoji:"🫐",cat:"Petit-déj",prep:15,cuisson:25,portions:12,diff:"Facile",
   ing:[{q:250,u:"g",n:"farine"},{q:150,u:"g",n:"myrtilles"},{q:120,u:"g",n:"sucre"},{q:2,u:"",n:"œufs"},{q:15,u:"cl",n:"lait"},{q:80,u:"g",n:"beurre fondu"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Disposez des caissettes en papier dans un moule à muffins.","Dans un saladier, mélangez la farine, le sucre, la levure et le sel.","Dans un autre bol, battez les œufs avec le lait et le beurre fondu.","Versez le mélange liquide sur les ingrédients secs et mélangez juste ce qu'il faut (une pâte trop travaillée donne des muffins durs ; quelques grumeaux sont normaux).","Incorporez délicatement les myrtilles (roulez-les dans un peu de farine pour qu'elles ne tombent pas au fond).","Répartissez la pâte dans les caissettes, aux trois quarts.","Enfournez 20 à 25 min. Vérifiez avec la pointe d'un couteau : elle doit ressortir sèche.","Laissez tiédir avant de déguster."]},
  {id:"fondant",nom:"Fondant au chocolat",emoji:"🍫",cat:"Dessert",prep:15,cuisson:12,portions:6,diff:"Facile",
   ing:[{q:200,u:"g",n:"chocolat noir"},{q:150,u:"g",n:"beurre"},{q:4,u:"",n:"œufs"},{q:120,u:"g",n:"sucre"},{q:60,u:"g",n:"farine"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7). Beurrez et farinez des ramequins.","Cassez le chocolat en morceaux et coupez le beurre en dés. Faites-les fondre ensemble au bain-marie ou au micro-ondes, en remuant.","Dans un saladier, fouettez les œufs avec le sucre jusqu'à ce que le mélange mousse.","Incorporez le chocolat fondu tiédi.","Ajoutez la farine et mélangez juste assez pour l'incorporer.","Répartissez la pâte dans les ramequins.","Enfournez 10 à 11 min seulement : c'est le secret. Le tour doit être pris mais le centre encore tremblotant (c'est ce qui fait le cœur coulant).","Laissez reposer 1 min, démoulez délicatement sur une assiette et servez aussitôt, encore chaud."]},
  {id:"brownie",nom:"Brownie",emoji:"🍫",cat:"Dessert",prep:15,cuisson:25,portions:8,diff:"Facile",
   ing:[{q:200,u:"g",n:"chocolat noir"},{q:120,u:"g",n:"beurre"},{q:150,u:"g",n:"sucre"},{q:3,u:"",n:"œufs"},{q:80,u:"g",n:"farine"},{q:100,u:"g",n:"noix"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Tapissez un moule carré de papier cuisson.","Faites fondre le chocolat en morceaux avec le beurre au bain-marie ou au micro-ondes, en remuant.","Dans un saladier, fouettez les œufs avec le sucre.","Incorporez le chocolat fondu.","Ajoutez la farine et mélangez juste assez.","Ajoutez les noix concassées.","Versez dans le moule et lissez.","Enfournez 20 à 25 min : le brownie doit rester moelleux au centre (la lame d'un couteau ressort légèrement humide, c'est normal, il ne faut pas trop cuire).","Laissez complètement refroidir avant de couper en carrés."]},
  {id:"gateauyaourt",nom:"Gâteau au yaourt",emoji:"🍰",cat:"Dessert",prep:10,cuisson:30,portions:8,diff:"Facile",
   ing:[{q:1,u:"",n:"yaourt nature"},{q:3,u:"pots",n:"farine"},{q:2,u:"pots",n:"sucre"},{q:0.5,u:"pot",n:"huile"},{q:3,u:"",n:"œufs"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"c. à café",n:"vanille"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez un moule à manqué.","Utilisez le pot de yaourt vide comme mesure. Versez le yaourt dans un saladier.","Ajoutez 2 pots de sucre et mélangez.","Ajoutez les œufs un à un.","Ajoutez 3 pots de farine et le sachet de levure, puis mélangez.","Ajoutez un demi-pot d'huile et mélangez jusqu'à obtenir une pâte lisse.","Versez dans le moule.","Enfournez 30 min. Vérifiez la cuisson avec un couteau : la lame doit ressortir sèche.","Laissez tiédir avant de démouler."]},
  {id:"cremebrulee",nom:"Crème brûlée",emoji:"🍮",cat:"Dessert",prep:15,cuisson:50,portions:4,diff:"Moyen",
   ing:[{q:50,u:"cl",n:"crème liquide"},{q:5,u:"",n:"jaunes d'œufs"},{q:80,u:"g",n:"sucre"},{q:1,u:"",n:"gousse de vanille"},{q:4,u:"c. à soupe",n:"cassonade"}],
   etapes:["Préchauffez le four à 100°C (th. 3-4). Fendez la gousse de vanille en deux et grattez les graines.","Faites chauffer la crème avec la vanille (graines et gousse) jusqu'aux premiers frémissements, puis coupez le feu et laissez infuser 10 min.","Dans un saladier, fouettez les jaunes d'œufs avec le sucre jusqu'à ce que le mélange blanchisse légèrement.","Retirez la gousse, puis versez la crème chaude sur les jaunes en fouettant doucement (ne fouettez pas trop, pour éviter les bulles).","Répartissez la crème dans des ramequins plats.","Enfournez 45 min à 1h : la crème doit être prise mais encore légèrement tremblotante au centre.","Laissez refroidir, puis réservez au frais au moins 3h.","Juste avant de servir, saupoudrez de sucre roux et caramélisez au chalumeau (ou sous le grill très chaud) jusqu'à obtenir une croûte dorée et croustillante."]},
  {id:"cremecaramel",nom:"Crème caramel",emoji:"🍮",cat:"Dessert",prep:15,cuisson:40,portions:6,diff:"Moyen",
   ing:[{q:50,u:"cl",n:"lait"},{q:4,u:"",n:"œufs"},{q:100,u:"g",n:"sucre"},{q:1,u:"c. à café",n:"vanille"},{q:80,u:"g",n:"sucre pour le caramel"}],
   etapes:["Préchauffez le four à 160°C (th. 5-6).","Préparez le caramel : dans une casserole, faites chauffer une partie du sucre avec un peu d'eau, sans remuer, jusqu'à obtenir un caramel ambré.","Versez-le aussitôt au fond des ramequins et inclinez-les pour bien répartir (attention, c'est brûlant).","Faites chauffer le lait jusqu'aux premiers frémissements.","Dans un saladier, fouettez les œufs avec le reste du sucre et la vanille.","Versez le lait chaud sur les œufs en fouettant doucement.","Répartissez ce mélange dans les ramequins, sur le caramel.","Placez les ramequins dans un plat, versez de l'eau chaude à mi-hauteur (bain-marie : cela cuit la crème en douceur) et enfournez 40 min.","La crème doit être prise. Laissez refroidir, puis réservez au frais 3h.","Pour démouler, passez une lame autour et retournez sur une assiette : le caramel nappe la crème."]},
  {id:"rizaulait",nom:"Riz au lait",emoji:"🍚",cat:"Dessert",prep:5,cuisson:35,portions:4,diff:"Facile",
   ing:[{q:150,u:"g",n:"riz rond"},{q:1,u:"l",n:"lait"},{q:100,u:"g",n:"sucre"},{q:1,u:"",n:"gousse de vanille"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Rincez rapidement le riz rond à l'eau froide.","Versez le lait dans une casserole avec le sucre et la vanille. Portez à frémissement.","Ajoutez le riz.","Baissez le feu au minimum et laissez cuire 30 à 35 min en remuant souvent, pour éviter que ça attache au fond.","Le riz au lait est prêt quand le riz est tendre et le mélange crémeux (il épaissira encore en refroidissant).","Versez dans des ramequins.","Dégustez tiède ou froid."]},
  {id:"pannacotta",nom:"Panna cotta",emoji:"🍮",cat:"Dessert",prep:10,cuisson:5,portions:4,diff:"Facile",
   ing:[{q:50,u:"cl",n:"crème liquide"},{q:60,u:"g",n:"sucre"},{q:3,u:"",n:"feuilles de gélatine"},{q:1,u:"",n:"gousse de vanille"},{q:4,u:"c. à soupe",n:"coulis de fruits rouges"}],
   etapes:["Faites tremper les feuilles de gélatine dans un bol d'eau froide 5 min, pour les ramollir.","Versez la crème et le lait dans une casserole avec le sucre et la vanille.","Faites chauffer jusqu'aux premiers frémissements (sans faire bouillir), puis coupez le feu.","Essorez la gélatine entre vos mains et ajoutez-la dans la crème chaude. Mélangez jusqu'à ce qu'elle soit complètement dissoute.","Versez dans des verrines ou des ramequins.","Laissez tiédir, puis réservez au frais au moins 4h : la pannacotta doit être prise mais encore tremblotante.","Servez avec un coulis de fruits rouges."]},
  {id:"clafoutis",nom:"Clafoutis aux cerises",emoji:"🍒",cat:"Dessert",prep:15,cuisson:35,portions:6,diff:"Facile",
   ing:[{q:500,u:"g",n:"cerises"},{q:100,u:"g",n:"farine"},{q:100,u:"g",n:"sucre"},{q:3,u:"",n:"œufs"},{q:30,u:"cl",n:"lait"},{q:20,u:"g",n:"beurre"},{q:1,u:"c. à café",n:"vanille"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez un plat.","Lavez les cerises (traditionnellement on garde les noyaux, mais dénoyautez-les pour plus de confort).","Répartissez les cerises dans le plat.","Dans un saladier, battez les œufs avec le sucre.","Ajoutez la farine et mélangez.","Versez le lait petit à petit en fouettant, jusqu'à obtenir une pâte lisse et fluide (comme une pâte à crêpes).","Versez la pâte sur les cerises.","Enfournez 35 min : le clafoutis doit être doré et pris au centre.","Saupoudrez de sucre et servez tiède."]},
  {id:"citronmeringuee",nom:"Tarte au citron meringuée",emoji:"🍋",cat:"Dessert",prep:30,cuisson:30,portions:8,diff:"Difficile",
   ing:[{q:1,u:"",n:"pâte sablée"},{q:4,u:"",n:"citrons"},{q:4,u:"",n:"œufs"},{q:150,u:"g",n:"sucre"},{q:80,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"maïzena"},{q:80,u:"g",n:"sucre glace"}],
   etapes:["Préchauffez le four à 180°C. Étalez la pâte dans un moule, piquez le fond et faites-la cuire à blanc 15 min (posez du papier cuisson et des poids type haricots secs pour qu'elle ne gonfle pas).","Préparez la crème au citron : pressez les citrons. Dans une casserole, mélangez le jus, le sucre, les œufs et la maïzena.","Faites chauffer à feu doux en fouettant sans arrêt, jusqu'à ce que la crème épaississe.","Hors du feu, incorporez le beurre. Versez la crème sur le fond de tarte cuit et lissez.","Préparez la meringue : montez les blancs en neige, puis ajoutez le sucre en continuant de fouetter jusqu'à obtenir une meringue lisse et brillante qui forme des pics.","Répartissez la meringue sur la crème au citron, en formant des pics avec le dos d'une cuillère.","Faites dorer au four quelques minutes (ou au chalumeau), en surveillant : la meringue doit juste colorer.","Laissez refroidir avant de servir."]},
  {id:"tatin",nom:"Tarte Tatin",emoji:"🍎",cat:"Dessert",prep:25,cuisson:40,portions:6,diff:"Moyen",
   ing:[{q:1,u:"",n:"pâte brisée"},{q:6,u:"",n:"pommes"},{q:120,u:"g",n:"sucre"},{q:60,u:"g",n:"beurre"},{q:1,u:"pincée",n:"cannelle"}],
   etapes:["Préchauffez le four à 190°C (th. 6-7). Épluchez les pommes, coupez-les en quartiers et retirez le cœur.","Préparez le caramel : dans un moule qui va au four (ou une poêle à manche métallique), faites fondre le beurre avec le sucre jusqu'à obtenir un caramel doré.","Disposez les quartiers de pommes serrés dans le caramel, face bombée vers le bas.","Laissez cuire 10 min sur feu moyen pour que les pommes s'imprègnent de caramel.","Recouvrez les pommes avec la pâte, en rentrant les bords à l'intérieur du moule (comme pour border un lit).","Enfournez 25 min : la pâte doit être dorée.","Laissez tiédir 5 min seulement (pas plus, sinon le caramel colle).","Posez une grande assiette sur le moule et retournez d'un coup (attention au caramel chaud). Les pommes caramélisées se retrouvent sur le dessus."]},
  {id:"cheesecake",nom:"Cheesecake",emoji:"🍰",cat:"Dessert",prep:20,cuisson:45,portions:8,diff:"Moyen",
   ing:[{q:200,u:"g",n:"spéculoos"},{q:80,u:"g",n:"beurre fondu"},{q:600,u:"g",n:"fromage frais"},{q:120,u:"g",n:"sucre"},{q:3,u:"",n:"œufs"},{q:10,u:"cl",n:"crème"},{q:1,u:"c. à café",n:"vanille"}],
   etapes:["Émiettez les biscuits (dans un sac, écrasés au rouleau). Mélangez-les avec le beurre fondu.","Tassez ce mélange au fond d'un moule (idéalement à charnière) avec le dos d'une cuillère. Réservez au frais.","Préchauffez le four à 160°C (th. 5-6).","Dans un saladier, fouettez le fromage frais avec le sucre jusqu'à ce que ce soit lisse.","Ajoutez les œufs un à un, puis la crème et la vanille. Mélangez sans trop incorporer d'air.","Versez sur le fond de biscuits.","Enfournez 45 min : les bords doivent être pris mais le centre encore légèrement tremblotant (il se raffermit en refroidissant).","Laissez refroidir dans le four éteint, porte entrouverte (cela évite qu'il craque).","Réservez au frais au moins 4h, idéalement une nuit, avant de démouler."]},
  {id:"madeleines",nom:"Madeleines",emoji:"🍰",cat:"Dessert",prep:15,cuisson:12,portions:20,diff:"Facile",
   ing:[{q:200,u:"g",n:"farine"},{q:3,u:"",n:"œufs"},{q:130,u:"g",n:"sucre"},{q:120,u:"g",n:"beurre fondu"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"",n:"citron"},{q:1,u:"c. à soupe",n:"miel"}],
   etapes:["Faites fondre le beurre et laissez-le tiédir. Beurrez et farinez les moules à madeleines.","Dans un saladier, fouettez les œufs avec le sucre jusqu'à ce que le mélange blanchisse.","Ajoutez la farine et la levure, puis mélangez.","Incorporez le beurre fondu tiède et le zeste de citron.","Réservez la pâte au frais 30 min si possible (le choc de température aide à former la bosse).","Préchauffez le four à 220°C (th. 7-8).","Remplissez les moules aux trois quarts.","Enfournez 4 min à 220°C, puis baissez à 200°C et poursuivez 4 à 5 min : la bosse se forme et les bords dorent.","Démoulez tièdes."]},
  {id:"cakemarbre",nom:"Cake marbré",emoji:"🍫",cat:"Dessert",prep:20,cuisson:45,portions:8,diff:"Facile",
   ing:[{q:200,u:"g",n:"farine"},{q:150,u:"g",n:"sucre"},{q:120,u:"g",n:"beurre"},{q:3,u:"",n:"œufs"},{q:10,u:"cl",n:"lait"},{q:2,u:"c. à soupe",n:"cacao"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"c. à café",n:"vanille"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez et farinez un moule à cake.","Dans un saladier, fouettez le beurre mou avec le sucre jusqu'à obtenir une crème.","Ajoutez les œufs un à un.","Ajoutez la farine et la levure, puis mélangez jusqu'à obtenir une pâte lisse.","Séparez la pâte en deux bols. Dans l'un, ajoutez le cacao (avec un peu de lait si besoin pour garder la même texture).","Versez les deux pâtes en alternance dans le moule (une louche de nature, une de chocolat, etc.).","Passez la lame d'un couteau en zigzag dans la pâte pour créer le marbrage.","Enfournez 45 min. Vérifiez la cuisson avec un couteau : il doit ressortir sec.","Laissez tiédir avant de démouler."]},
  {id:"compote",nom:"Compote de pommes",emoji:"🍎",cat:"Dessert",prep:10,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:6,u:"",n:"pommes"},{q:2,u:"c. à soupe",n:"sucre"},{q:1,u:"",n:"citron"},{q:1,u:"pincée",n:"cannelle"},{q:5,u:"c. à soupe",n:"eau"}],
   etapes:["Épluchez les pommes, coupez-les en quatre, retirez le cœur et les pépins, puis coupez-les en morceaux.","Mettez les morceaux dans une casserole avec un fond d'eau (pour ne pas que ça attache).","Ajoutez le sucre et une pincée de cannelle.","Couvrez et laissez cuire 20 min à feu doux, en remuant de temps en temps.","Les pommes sont prêtes quand elles s'écrasent facilement.","Écrasez à la fourchette pour une compote avec des morceaux, ou mixez pour une texture lisse.","Dégustez tiède ou froide."]},
  {id:"saladefruits",nom:"Salade de fruits",emoji:"🍓",cat:"Dessert",prep:20,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:1,u:"",n:"pomme"},{q:1,u:"",n:"banane"},{q:2,u:"",n:"oranges"},{q:2,u:"",n:"kiwis"},{q:200,u:"g",n:"fraises"},{q:100,u:"g",n:"raisin"},{q:1,u:"",n:"citron"},{q:1,u:"c. à soupe",n:"sucre"},{q:1,u:"pincée",n:"menthe"}],
   etapes:["Lavez tous les fruits.","Épluchez ceux qui le nécessitent (kiwi, banane, orange).","Coupez tous les fruits en morceaux de taille régulière.","Mettez-les dans un grand saladier.","Pressez un citron et arrosez-en les fruits (cela évite qu'ils noircissent, notamment la banane et la pomme).","Ajoutez un peu de sucre ou de miel si les fruits sont peu sucrés.","Mélangez délicatement et réservez au frais au moins 1h avant de servir."]},
  {id:"quatrequarts",nom:"Quatre-quarts",emoji:"🍰",cat:"Dessert",prep:15,cuisson:45,portions:8,diff:"Facile",
   ing:[{q:3,u:"",n:"œufs"},{q:180,u:"g",n:"farine"},{q:180,u:"g",n:"sucre"},{q:180,u:"g",n:"beurre"},{q:1,u:"sachet",n:"levure chimique"},{q:1,u:"c. à café",n:"vanille"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez et farinez un moule à cake.","Pesez les œufs : leur poids détermine celui des autres ingrédients (même poids de beurre, de sucre et de farine, d'où le nom).","Faites fondre le beurre et laissez-le tiédir.","Dans un saladier, fouettez les œufs avec le sucre jusqu'à ce que le mélange blanchisse et double de volume.","Ajoutez le beurre fondu tiède.","Ajoutez la farine et la levure, et mélangez délicatement.","Versez dans le moule.","Enfournez 40 min. Vérifiez avec un couteau : la lame doit ressortir sèche.","Laissez tiédir avant de démouler."]},
  {id:"endivesjambon",nom:"Endives au jambon",emoji:"🥬",cat:"Plat",prep:15,cuisson:40,portions:4,diff:"Facile",
   ing:[{q:8,u:"",n:"endives"},{q:8,u:"",n:"tranches de jambon"},{q:50,u:"g",n:"beurre"},{q:50,u:"g",n:"farine"},{q:60,u:"cl",n:"lait"},{q:120,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"muscade"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Retirez les premières feuilles des endives, puis creusez leur base en cône avec la pointe d'un couteau : c'est la partie la plus amère.","Faites-les cuire 20 min à l'eau bouillante salée, ou à la vapeur. Elles sont prêtes quand un couteau s'y enfonce sans résistance.","Égouttez-les, puis pressez-les délicatement entre vos mains pour chasser l'eau. Cette étape est décisive : une endive gorgée d'eau noie le gratin.","Préchauffez le four à 200°C (th. 6-7).","Préparez la béchamel : faites fondre le beurre dans une casserole, ajoutez la farine d'un coup et mélangez 1 min au fouet sans colorer.","Versez le lait petit à petit en fouettant sans arrêt, jusqu'à ce que la sauce nappe la cuillère. Ajoutez la muscade, salez et poivrez.","Enroulez chaque endive dans une tranche de jambon et rangez-les côte à côte dans un plat.","Nappez de béchamel et parsemez de gruyère râpé.","Enfournez 20 min, jusqu'à ce que le dessus soit doré et bouillonnant.","Laissez reposer 5 min avant de servir : le gratin se tient mieux."]},
  {id:"potaufeu",nom:"Pot-au-feu",emoji:"🍲",cat:"Plat",prep:20,cuisson:180,portions:6,diff:"Facile",
   ing:[{q:1.2,u:"kg",n:"bœuf à braiser"},{q:4,u:"",n:"carottes"},{q:3,u:"",n:"poireaux"},{q:3,u:"",n:"navets"},{q:2,u:"",n:"oignons"},{q:4,u:"",n:"pommes de terre"},{q:1,u:"",n:"bouquet garni"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"pincée",n:"gros sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Mettez la viande dans une grande marmite et couvrez largement d'eau froide. Partir à froid fait passer le goût de la viande dans le bouillon.","Portez doucement à frémissement. Une écume grise remonte : retirez-la à l'écumoire jusqu'à ce que le bouillon redevienne clair.","Épluchez les oignons et l'ail, et ajoutez-les avec le bouquet garni.","Salez au gros sel, poivrez, baissez le feu au minimum et couvrez à moitié.","Laissez mijoter 2h à tout petits bouillons. Un bouillon qui bout fort rend la viande sèche et le liquide trouble.","Pendant ce temps, épluchez les carottes et les navets, coupez-les en gros tronçons. Lavez les poireaux et ficelez-les en botte pour qu'ils ne se défassent pas.","Après 2h, ajoutez les carottes et les navets, et laissez cuire 30 min.","Ajoutez les poireaux et les pommes de terre épluchées, puis poursuivez 30 min : tout doit être tendre sans s'écraser.","Goûtez le bouillon et rectifiez le sel.","Servez la viande découpée avec les légumes et une louche de bouillon, accompagnée de moutarde, de cornichons et de gros sel."]},
  {id:"tajine",nom:"Tajine de poulet aux olives",emoji:"🍗",cat:"Plat",prep:20,cuisson:60,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"cuisses de poulet"},{q:2,u:"",n:"oignons"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"",n:"citron confit"},{q:150,u:"g",n:"olives vertes"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"c. à café",n:"gingembre moulu"},{q:1,u:"pincée",n:"safran"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"",n:"bouquet de coriandre"}],
   etapes:["Épluchez et émincez les oignons. Épluchez et hachez l'ail.","Faites chauffer l'huile d'olive dans une cocotte à feu moyen. Faites dorer les cuisses de poulet 5 min de chaque côté, puis réservez-les.","Dans la même cocotte, faites revenir les oignons 5 min jusqu'à ce qu'ils soient translucides.","Ajoutez l'ail, le cumin, le gingembre et le safran. Mélangez 1 min : les épices doivent libérer leur parfum sans brûler.","Remettez le poulet, versez un grand verre d'eau (environ 20 cl) et salez très peu : les olives et le citron confit sont déjà salés.","Couvrez et laissez mijoter 40 min à feu doux, en retournant le poulet à mi-cuisson.","Rincez les olives à l'eau claire pour retirer l'excès de sel. Coupez le citron confit en fines lamelles.","Ajoutez les olives et le citron dans la cocotte, puis poursuivez 15 min à découvert : la sauce doit réduire et napper.","Parsemez de coriandre ciselée juste avant de servir.","Servez avec de la semoule ou du pain pour saucer."]},
  {id:"couscous",nom:"Couscous poulet et merguez",emoji:"🍛",cat:"Plat",prep:25,cuisson:60,portions:6,diff:"Moyen",
   ing:[{q:6,u:"",n:"cuisses de poulet"},{q:6,u:"",n:"merguez"},{q:500,u:"g",n:"semoule"},{q:4,u:"",n:"carottes"},{q:2,u:"",n:"courgettes"},{q:2,u:"",n:"navets"},{q:400,u:"g",n:"pois chiches"},{q:2,u:"",n:"oignons"},{q:2,u:"c. à soupe",n:"ras-el-hanout"},{q:2,u:"c. à soupe",n:"concentré de tomate"},{q:3,u:"c. à soupe",n:"huile d'olive"}],
   etapes:["Épluchez et émincez les oignons. Épluchez les carottes et les navets et coupez-les en gros tronçons. Lavez les courgettes et coupez-les en tronçons épais.","Faites chauffer l'huile d'olive dans un grand faitout. Faites dorer les cuisses de poulet 5 min de chaque côté, puis réservez-les.","Faites revenir les oignons 5 min dans la même graisse.","Ajoutez le ras-el-hanout et le concentré de tomate, et mélangez 1 min pour réveiller les épices.","Remettez le poulet, ajoutez les carottes et les navets, puis couvrez d'eau à hauteur. Salez et portez à frémissement.","Laissez mijoter 30 min à couvert.","Ajoutez les courgettes et les pois chiches égouttés, puis poursuivez 20 min : les légumes doivent être tendres sans se défaire.","Pendant ce temps, faites griller les merguez à la poêle en les retournant, jusqu'à ce qu'elles soient bien colorées.","Préparez la semoule : versez-la dans un saladier, ajoutez un filet d'huile et du sel, puis couvrez d'eau bouillante juste à hauteur. Couvrez et laissez gonfler 5 min, puis égrainez à la fourchette.","Servez la semoule avec la viande et les légumes, et un bol de bouillon à côté pour arroser."]},
  {id:"burger",nom:"Burger maison",emoji:"🍔",cat:"Plat",prep:20,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"pains à burger"},{q:600,u:"g",n:"bœuf haché"},{q:4,u:"",n:"tranches de cheddar"},{q:1,u:"",n:"oignon rouge"},{q:2,u:"",n:"tomates"},{q:4,u:"",n:"feuilles de salade"},{q:2,u:"c. à soupe",n:"ketchup"},{q:2,u:"c. à soupe",n:"mayonnaise"},{q:1,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Sortez la viande du frigo 15 min avant : trop froide, elle cuit mal au centre.","Divisez le bœuf haché en 4 et formez des galettes un peu plus larges que le pain, car elles se rétractent en cuisant.","Creusez un léger puits au centre de chaque steak avec le pouce : cela l'empêche de gonfler en dôme.","Lavez la salade et les tomates. Coupez les tomates en rondelles et l'oignon rouge en fines lamelles.","Coupez les pains en deux et faites-les griller 1 min côté mie, à la poêle sèche : un pain grillé ne se détrempe pas.","Faites chauffer l'huile dans une poêle à feu vif. Salez les steaks juste avant de les poser (saler à l'avance fait ressortir l'eau).","Faites-les cuire 3 min sans y toucher, retournez-les, posez une tranche de cheddar dessus et poursuivez 2 à 3 min.","Tartinez la base des pains de mayonnaise et le chapeau de ketchup.","Montez dans l'ordre : salade, steak au fromage, tomate, oignon, puis refermez.","Servez aussitôt, tant que le fromage est fondant."]},
  {id:"nuggets",nom:"Nuggets de poulet maison",emoji:"🍗",cat:"Plat",prep:20,cuisson:12,portions:4,diff:"Facile",
   ing:[{q:600,u:"g",n:"blancs de poulet"},{q:100,u:"g",n:"farine"},{q:2,u:"",n:"œufs"},{q:150,u:"g",n:"chapelure"},{q:1,u:"c. à café",n:"paprika"},{q:75,u:"cl",n:"huile de friture"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Coupez les blancs de poulet en morceaux réguliers, de la taille d'une bouchée.","Préparez trois assiettes creuses : la farine mélangée au paprika, au sel et au poivre dans la première, les œufs battus dans la deuxième, la chapelure dans la troisième.","Passez chaque morceau dans la farine et tapotez pour retirer l'excédent.","Trempez-le dans l'œuf battu, puis roulez-le dans la chapelure en appuyant bien pour qu'elle adhère partout.","Posez les nuggets sur une assiette et laissez-les reposer 10 min au frais : la panure tient nettement mieux.","Faites chauffer l'huile de friture à 175°C (un morceau de pain doit y dorer en 40 secondes).","Plongez les nuggets par petites quantités, sans surcharger, et faites-les cuire 4 à 5 min jusqu'à ce qu'ils soient bien dorés.","Égouttez-les sur du papier absorbant.","Coupez-en un en deux pour vérifier : la chair doit être blanche à cœur.","Salez légèrement et servez aussitôt, avec du ketchup ou une sauce au yaourt."]},
  {id:"quesadillas",nom:"Quesadillas au poulet",emoji:"🌯",cat:"Plat",prep:15,cuisson:12,portions:4,diff:"Facile",
   ing:[{q:8,u:"",n:"tortillas"},{q:300,u:"g",n:"blancs de poulet"},{q:200,u:"g",n:"cheddar râpé"},{q:1,u:"",n:"poivron rouge"},{q:1,u:"",n:"oignon"},{q:1,u:"c. à café",n:"cumin"},{q:1,u:"c. à café",n:"paprika"},{q:1,u:"c. à soupe",n:"huile"}],
   etapes:["Coupez les blancs de poulet en lanières fines. Émincez l'oignon et le poivron.","Faites chauffer l'huile dans une poêle à feu moyen-vif. Faites revenir l'oignon et le poivron 5 min.","Ajoutez le poulet, le cumin et le paprika. Salez et faites cuire 6 min en remuant, jusqu'à ce que la viande soit dorée.","Débarrassez la garniture dans un bol et essuyez la poêle.","Posez une tortilla dans la poêle sèche à feu moyen.","Répartissez du cheddar sur une moitié seulement, ajoutez de la garniture, puis un peu de cheddar par-dessus (le fromage sert de colle des deux côtés).","Repliez la tortilla en demi-lune et appuyez avec une spatule.","Faites cuire 2 min de chaque côté, jusqu'à ce que la tortilla soit dorée et le fromage fondu.","Répétez avec les autres tortillas.","Laissez tiédir 1 min, puis coupez en parts : la garniture ne coulera pas."]},
  {id:"oeufscocotte",nom:"Œufs cocotte",emoji:"🥚",cat:"Plat",prep:10,cuisson:12,portions:4,diff:"Facile",
   ing:[{q:4,u:"",n:"œufs"},{q:20,u:"cl",n:"crème fraîche"},{q:100,u:"g",n:"lardons"},{q:50,u:"g",n:"gruyère râpé"},{q:20,u:"g",n:"beurre"},{q:1,u:"pincée",n:"muscade"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Préchauffez le four à 180°C (th. 6). Beurrez généreusement 4 ramequins.","Faites revenir les lardons 5 min à la poêle, sans matière grasse, puis égouttez-les sur du papier absorbant.","Répartissez-les au fond des ramequins.","Versez 2 c. à soupe de crème dans chaque ramequin, ajoutez une pincée de muscade et du poivre.","Cassez un œuf dans chaque ramequin en veillant à ne pas percer le jaune.","Parsemez de gruyère râpé, sans recouvrir complètement le jaune.","Posez les ramequins dans un plat et versez de l'eau chaude à mi-hauteur : le bain-marie évite que le blanc devienne caoutchouteux.","Enfournez 10 à 12 min. Le blanc doit être juste pris et le jaune encore coulant.","Sortez-les et attendez 1 min : la cuisson continue dans le ramequin brûlant.","Servez aussitôt avec des mouillettes de pain grillé."]},
  {id:"moussaka",nom:"Moussaka",emoji:"🍆",cat:"Plat",prep:30,cuisson:50,portions:6,diff:"Moyen",
   ing:[{q:3,u:"",n:"aubergines"},{q:600,u:"g",n:"agneau haché"},{q:400,u:"g",n:"tomates concassées"},{q:2,u:"",n:"oignons"},{q:3,u:"",n:"gousses d'ail"},{q:50,u:"g",n:"beurre"},{q:50,u:"g",n:"farine"},{q:50,u:"cl",n:"lait"},{q:100,u:"g",n:"gruyère râpé"},{q:1,u:"c. à café",n:"cannelle"},{q:4,u:"c. à soupe",n:"huile d'olive"}],
   etapes:["Lavez les aubergines et coupez-les en tranches de 1 cm dans la longueur. Salez-les et laissez-les dégorger 15 min sur du papier absorbant.","Épongez-les, puis faites-les dorer à la poêle dans l'huile d'olive, 3 min de chaque côté. Réservez sur du papier absorbant.","Épluchez et hachez les oignons et l'ail. Faites-les revenir 5 min dans la même poêle.","Ajoutez l'agneau haché, écrasez-le à la cuillère et faites-le dorer 6 min.","Ajoutez les tomates concassées et la cannelle. Salez, poivrez et laissez mijoter 15 min à découvert : la sauce doit être épaisse, pas liquide.","Préchauffez le four à 180°C (th. 6).","Préparez la béchamel : faites fondre le beurre, ajoutez la farine et mélangez 1 min, puis versez le lait petit à petit en fouettant jusqu'à épaississement. Salez et poivrez.","Dans un plat, alternez une couche d'aubergines et une couche de viande, en terminant par les aubergines.","Nappez de béchamel et parsemez de gruyère râpé.","Enfournez 30 min : le dessus doit être doré et gonflé.","Laissez reposer 10 min avant de couper, sinon les couches glissent."]},
  {id:"bobun",nom:"Bo bun au bœuf",emoji:"🍜",cat:"Plat",prep:30,cuisson:10,portions:4,diff:"Moyen",
   ing:[{q:400,u:"g",n:"bavette de bœuf"},{q:250,u:"g",n:"nouilles de riz"},{q:1,u:"",n:"carotte"},{q:1,u:"",n:"concombre"},{q:1,u:"",n:"salade"},{q:1,u:"",n:"bouquet de menthe"},{q:80,u:"g",n:"cacahuètes"},{q:4,u:"c. à soupe",n:"sauce nuoc-mâm"},{q:2,u:"c. à soupe",n:"sucre"},{q:1,u:"",n:"citron vert"},{q:3,u:"",n:"gousses d'ail"},{q:2,u:"c. à soupe",n:"huile"}],
   etapes:["Coupez la bavette en fines lanières. Hachez l'ail et mélangez-le à la viande avec 1 c. à soupe de sauce nuoc-mâm. Laissez mariner 15 min.","Préparez la sauce : mélangez le reste de nuoc-mâm, le sucre, le jus du citron vert et 4 c. à soupe d'eau. Remuez jusqu'à ce que le sucre soit dissous, puis goûtez : ça doit être à la fois salé, sucré et acide.","Faites cuire les nouilles de riz selon le paquet, puis rincez-les à l'eau froide et égouttez-les bien (rincées, elles ne collent pas).","Lavez la salade et ciselez-la finement. Râpez la carotte. Coupez le concombre en fins bâtonnets.","Effeuillez la menthe. Concassez grossièrement les cacahuètes.","Faites chauffer l'huile dans une poêle ou un wok à feu très vif.","Saisissez la viande 2 à 3 min en remuant : elle doit colorer vite et rester rosée à cœur.","Répartissez les nouilles dans 4 grands bols.","Disposez par-dessus la salade, la carotte, le concombre, la menthe et la viande chaude.","Parsemez de cacahuètes et versez la sauce au moment de servir. Mélangez tout avant de manger."]},
  {id:"pissaladiere",nom:"Pissaladière",emoji:"🧅",cat:"Plat",prep:20,cuisson:50,portions:6,diff:"Facile",
   ing:[{q:1,u:"",n:"pâte à pizza"},{q:1,u:"kg",n:"oignons"},{q:12,u:"",n:"filets d'anchois"},{q:100,u:"g",n:"olives noires"},{q:3,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"thym"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez et émincez très finement les oignons. C'est long, mais c'est tout le plat.","Faites chauffer l'huile d'olive dans une grande sauteuse à feu doux.","Ajoutez les oignons, salez légèrement, couvrez et laissez fondre 30 min en remuant de temps en temps. Ils doivent devenir blonds et confits, jamais colorés vivement.","Retirez le couvercle et laissez évaporer l'eau 5 min : la garniture doit être sèche, sinon la pâte se détrempe.","Préchauffez le four à 200°C (th. 6-7).","Étalez la pâte sur une plaque avec son papier cuisson, en rectangle.","Répartissez les oignons en couche régulière, en laissant 1 cm de bord libre.","Disposez les filets d'anchois en croisillons et parsemez d'olives noires.","Arrosez d'un filet d'huile d'olive et parsemez de thym.","Enfournez 20 min : les bords doivent être dorés et croustillants.","Servez tiède, coupée en carrés."]},
  {id:"tartetomate",nom:"Tarte à la tomate et à la moutarde",emoji:"🍅",cat:"Plat",prep:15,cuisson:35,portions:6,diff:"Facile",
   ing:[{q:1,u:"",n:"pâte brisée"},{q:6,u:"",n:"tomates"},{q:2,u:"c. à soupe",n:"moutarde"},{q:150,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"herbes de Provence"},{q:2,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 190°C (th. 6-7). Déroulez la pâte dans un moule à tarte avec son papier et piquez le fond à la fourchette.","Étalez la moutarde sur le fond de pâte à la cuillère, en couche fine et régulière.","Parsemez de gruyère râpé : cette couche isole la pâte du jus des tomates.","Lavez les tomates et coupez-les en rondelles de 5 mm.","Posez-les sur du papier absorbant, salez-les légèrement et laissez-les rendre leur eau 10 min.","Épongez-les, puis disposez-les en rosace sur la tarte, en les faisant se chevaucher.","Arrosez d'huile d'olive et parsemez d'herbes de Provence.","Enfournez 35 min : les bords de la pâte doivent être dorés et les tomates légèrement confites.","Laissez tiédir 10 min avant de couper, la tarte se tient mieux."]},
  {id:"galettes",nom:"Galettes de sarrasin complètes",emoji:"🥞",cat:"Plat",prep:15,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:250,u:"g",n:"farine de sarrasin"},{q:50,u:"cl",n:"eau"},{q:5,u:"",n:"œufs"},{q:4,u:"",n:"tranches de jambon"},{q:150,u:"g",n:"gruyère râpé"},{q:40,u:"g",n:"beurre"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Versez la farine de sarrasin dans un saladier avec le sel. Creusez un puits et cassez-y 1 œuf.","Versez l'eau petit à petit en fouettant, jusqu'à obtenir une pâte lisse et fluide, un peu plus liquide qu'une pâte à crêpes.","Laissez reposer la pâte 1h si vous avez le temps : les galettes se déchirent moins.","Faites chauffer une grande poêle ou une crêpière à feu moyen-vif et beurrez-la légèrement.","Versez une louche de pâte et étalez-la aussitôt en tournant la poêle, pour obtenir une galette fine.","Laissez cuire 2 min : les bords se décollent et le dessous se colore.","Retournez la galette, puis posez au centre une tranche de jambon et une poignée de gruyère.","Cassez un œuf au milieu et laissez cuire 2 à 3 min : le blanc doit prendre et le jaune rester coulant.","Repliez les quatre bords vers le centre pour former un carré, en laissant le jaune apparent.","Faites glisser sur une assiette et servez aussitôt. Recommencez avec le reste de pâte."]},
  {id:"frites",nom:"Frites maison",emoji:"🍟",cat:"Accompagnement",prep:15,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:1,u:"kg",n:"pommes de terre"},{q:1,u:"l",n:"huile de friture"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Choisissez des pommes de terre à chair farineuse, type bintje, et épluchez-les.","Coupez-les en bâtonnets réguliers d'environ 1 cm de côté : des frites de même taille cuisent en même temps.","Rincez-les à l'eau froide pour retirer l'amidon, puis séchez-les très soigneusement dans un torchon. L'eau qui reste fait éclabousser l'huile.","Faites chauffer l'huile de friture à 150°C.","Plongez les frites par petites quantités et faites-les cuire 6 à 8 min : elles doivent être tendres mais encore pâles. C'est la précuisson.","Égouttez-les sur du papier absorbant et laissez-les refroidir au moins 10 min.","Remontez l'huile à 180°C.","Replongez les frites 2 à 3 min, jusqu'à ce qu'elles soient dorées et croustillantes.","Égouttez-les à nouveau.","Salez aussitôt, mélangez et servez immédiatement : les frites n'attendent pas."]},
  {id:"rosti",nom:"Rösti de pommes de terre",emoji:"🥔",cat:"Accompagnement",prep:15,cuisson:20,portions:4,diff:"Facile",
   ing:[{q:800,u:"g",n:"pommes de terre"},{q:1,u:"",n:"oignon"},{q:40,u:"g",n:"beurre"},{q:2,u:"c. à soupe",n:"huile"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Épluchez les pommes de terre et râpez-les avec une râpe à gros trous.","Mettez-les dans un torchon propre et pressez fort au-dessus de l'évier : il faut chasser un maximum d'eau, c'est ce qui rend le rösti croustillant.","Épluchez et râpez l'oignon, puis mélangez-le aux pommes de terre. Salez et poivrez.","Faites chauffer l'huile et la moitié du beurre dans une poêle antiadhésive à feu moyen.","Versez la préparation et étalez-la en galette régulière, en tassant bien avec une spatule.","Laissez cuire 10 min sans y toucher : une croûte dorée doit se former dessous.","Faites glisser le rösti sur une assiette, posez la poêle à l'envers dessus et retournez l'ensemble d'un coup.","Ajoutez le reste de beurre dans la poêle et remettez le rösti à cuire 8 à 10 min de l'autre côté.","Vérifiez la cuisson en piquant le centre : les pommes de terre doivent être tendres.","Faites glisser sur un plat et servez coupé en parts."]},
  {id:"puree",nom:"Purée maison",emoji:"🥔",cat:"Accompagnement",prep:10,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:1,u:"kg",n:"pommes de terre"},{q:20,u:"cl",n:"lait"},{q:60,u:"g",n:"beurre"},{q:1,u:"pincée",n:"muscade"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez les pommes de terre et coupez-les en morceaux de taille égale.","Mettez-les dans une casserole, couvrez d'eau froide et salez.","Portez à ébullition et laissez cuire 20 à 25 min : un couteau doit s'enfoncer sans résistance.","Égouttez-les et laissez-les s'évaporer 1 min dans la casserole chaude, hors du feu : une pomme de terre sèche donne une purée plus onctueuse.","Écrasez-les au presse-purée ou à la fourchette. N'utilisez jamais de mixeur, la purée deviendrait élastique.","Faites tiédir le lait dans une petite casserole. Un lait froid rendrait la purée collante.","Ajoutez le beurre coupé en morceaux et mélangez jusqu'à ce qu'il soit fondu.","Versez le lait chaud petit à petit en mélangeant, jusqu'à la texture qui vous plaît.","Ajoutez la muscade, goûtez et rectifiez le sel.","Servez bien chaud."]},
  {id:"legumesrotis",nom:"Légumes rôtis au four",emoji:"🥕",cat:"Accompagnement",prep:15,cuisson:35,portions:4,diff:"Facile",
   ing:[{q:2,u:"",n:"courgettes"},{q:1,u:"",n:"poivron rouge"},{q:2,u:"",n:"carottes"},{q:1,u:"",n:"oignon rouge"},{q:1,u:"",n:"aubergine"},{q:4,u:"c. à soupe",n:"huile d'olive"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"pincée",n:"herbes de Provence"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7).","Lavez tous les légumes. Épluchez les carottes et l'oignon.","Coupez-les en morceaux d'environ 3 cm, tous de taille comparable pour qu'ils cuisent ensemble.","Épluchez les gousses d'ail et laissez-les entières, en chemise : elles parfument sans brûler.","Mettez tout dans un grand saladier, versez l'huile d'olive, salez, poivrez et parsemez d'herbes.","Mélangez avec les mains jusqu'à ce que chaque morceau brille.","Étalez les légumes sur une plaque, en une seule couche. Entassés, ils cuiraient à la vapeur au lieu de rôtir.","Enfournez 20 min.","Remuez avec une spatule et poursuivez 15 min : les bords doivent être caramélisés.","Goûtez, rectifiez le sel et servez chaud ou tiède."]},
  {id:"poeleechampignons",nom:"Poêlée de champignons à l'ail",emoji:"🍄",cat:"Accompagnement",prep:10,cuisson:15,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"champignons de Paris"},{q:3,u:"",n:"gousses d'ail"},{q:1,u:"",n:"bouquet de persil"},{q:30,u:"g",n:"beurre"},{q:1,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Nettoyez les champignons avec un papier humide plutôt qu'à l'eau, qu'ils boivent comme une éponge.","Coupez le bout terreux du pied, puis émincez-les en lamelles épaisses.","Épluchez et hachez finement l'ail. Lavez et ciselez le persil.","Faites chauffer l'huile dans une grande poêle à feu vif. La poêle doit être bien chaude et pas trop chargée.","Ajoutez les champignons sans les remuer pendant 2 min : ils doivent saisir avant de rendre leur eau.","Remuez et laissez cuire 5 min : ils vont rendre beaucoup d'eau.","Poursuivez jusqu'à ce que toute l'eau se soit évaporée et que les champignons commencent à dorer.","Baissez le feu, ajoutez le beurre et l'ail haché, et faites revenir 2 min sans laisser l'ail brunir.","Salez et poivrez seulement maintenant : saler plus tôt ferait sortir l'eau tout de suite.","Parsemez de persil et servez aussitôt."]},
  {id:"chevrechaud",nom:"Salade de chèvre chaud",emoji:"🧀",cat:"Entrée",prep:15,cuisson:8,portions:4,diff:"Facile",
   ing:[{q:2,u:"",n:"crottins de chèvre"},{q:8,u:"",n:"tranches de pain"},{q:1,u:"",n:"salade"},{q:2,u:"c. à soupe",n:"miel"},{q:3,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à soupe",n:"vinaigre balsamique"},{q:50,u:"g",n:"cerneaux de noix"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le gril du four.","Lavez et essorez la salade, puis répartissez-la dans 4 assiettes.","Préparez la vinaigrette : mélangez l'huile d'olive, le vinaigre balsamique, du sel et du poivre.","Coupez chaque crottin de chèvre en deux dans l'épaisseur, pour obtenir 4 demi-crottins.","Posez les tranches de pain sur une plaque et déposez un demi-crottin sur 4 d'entre elles.","Arrosez chaque fromage d'un filet de miel.","Passez sous le gril 5 à 6 min : le fromage doit gonfler légèrement et se colorer sur le dessus, sans couler.","Concassez grossièrement les noix.","Disposez les toasts chauds sur la salade, parsemez de noix et arrosez de vinaigrette.","Servez immédiatement, tant que le fromage est fondant."]},
  {id:"veloutechampignons",nom:"Velouté de champignons",emoji:"🍄",cat:"Entrée",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:500,u:"g",n:"champignons de Paris"},{q:1,u:"",n:"oignon"},{q:1,u:"",n:"pomme de terre"},{q:75,u:"cl",n:"bouillon de volaille"},{q:10,u:"cl",n:"crème fraîche"},{q:20,u:"g",n:"beurre"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Nettoyez les champignons avec un papier humide et émincez-les. Gardez 4 belles lamelles de côté pour la décoration.","Épluchez et émincez l'oignon. Épluchez la pomme de terre et coupez-la en dés.","Faites fondre le beurre dans une casserole à feu moyen et faites revenir l'oignon 4 min.","Ajoutez les champignons et laissez-les cuire 8 min : ils rendent leur eau, puis commencent à dorer.","Ajoutez la pomme de terre en dés. C'est elle qui donnera au velouté sa texture, sans farine.","Versez le bouillon, salez légèrement et portez à frémissement.","Laissez mijoter 15 min, jusqu'à ce que la pomme de terre s'écrase facilement.","Mixez très finement au mixeur plongeant.","Ajoutez la crème, mélangez et réchauffez sans faire bouillir. Goûtez et rectifiez le sel.","Servez avec les lamelles de champignon cru et un tour de moulin à poivre."]},
  {id:"oeufsmimosa",nom:"Œufs mimosa",emoji:"🥚",cat:"Entrée",prep:20,cuisson:10,portions:4,diff:"Facile",
   ing:[{q:6,u:"",n:"œufs"},{q:4,u:"c. à soupe",n:"mayonnaise"},{q:1,u:"c. à café",n:"moutarde"},{q:1,u:"",n:"bouquet de ciboulette"},{q:1,u:"pincée",n:"paprika"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Posez les œufs dans une casserole, couvrez d'eau froide et portez à ébullition.","Dès l'ébullition, comptez 9 min : c'est le temps pour un jaune bien ferme, sans cerne vert.","Égouttez-les et plongez-les aussitôt dans un saladier d'eau très froide. Ce choc facilite énormément l'écalage.","Écalez les œufs sous un filet d'eau, puis coupez-les en deux dans la longueur.","Retirez délicatement les jaunes et mettez-les dans un bol.","Écrasez-les à la fourchette, puis prélevez l'équivalent d'un jaune que vous réservez à part pour la finition.","Mélangez le reste des jaunes avec la mayonnaise et la moutarde. Salez et poivrez : vous obtenez une crème lisse.","Remplissez les demi-blancs de cette crème, à la cuillère ou à la poche à douille.","Écrasez le jaune réservé entre vos doigts au-dessus des œufs : c'est ce qui donne l'effet mimosa.","Parsemez de ciboulette ciselée et d'une pointe de paprika, et servez frais."]},
  {id:"carottesrapees",nom:"Carottes râpées",emoji:"🥕",cat:"Entrée",prep:15,cuisson:0,portions:4,diff:"Facile",
   ing:[{q:6,u:"",n:"carottes"},{q:1,u:"",n:"citron"},{q:3,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à café",n:"moutarde"},{q:1,u:"c. à café",n:"miel"},{q:1,u:"",n:"bouquet de persil"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Épluchez les carottes et coupez leurs deux extrémités.","Râpez-les avec une râpe à gros trous : râpées trop fin, elles rendent leur eau et deviennent molles.","Pressez le citron.","Dans un bol, mélangez la moutarde, le miel, le jus de citron et une pincée de sel.","Versez l'huile d'olive en filet tout en fouettant : la vinaigrette épaissit et devient lisse.","Lavez et ciselez finement le persil.","Versez la vinaigrette sur les carottes et mélangez soigneusement, à la main de préférence.","Ajoutez le persil et mélangez à nouveau.","Goûtez et rectifiez : un peu plus de citron si c'est plat, un peu de miel si c'est trop acide.","Réservez au frais 20 min avant de servir, le temps que les carottes s'imprègnent."]},
  {id:"saladelentilles",nom:"Salade de lentilles",emoji:"🥗",cat:"Entrée",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:250,u:"g",n:"lentilles vertes"},{q:1,u:"",n:"oignon rouge"},{q:2,u:"",n:"carottes"},{q:1,u:"",n:"échalote"},{q:3,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"c. à soupe",n:"vinaigre"},{q:1,u:"c. à café",n:"moutarde"},{q:1,u:"",n:"bouquet de persil"},{q:1,u:"",n:"feuille de laurier"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Rincez les lentilles à l'eau froide. Inutile de les faire tremper.","Mettez-les dans une casserole avec 3 fois leur volume d'eau froide, une carotte entière épluchée et le laurier.","Portez à frémissement et laissez cuire 20 à 25 min. Ne salez qu'en fin de cuisson : le sel ajouté trop tôt durcit la peau des lentilles.","Goûtez : elles doivent être tendres mais entières, pas en purée.","Égouttez-les et retirez le laurier et la carotte de cuisson.","Pendant ce temps, épluchez et ciselez finement l'échalote et l'oignon rouge. Épluchez la seconde carotte et coupez-la en tout petits dés.","Préparez la vinaigrette : mélangez la moutarde, le vinaigre et le sel, puis versez l'huile en filet en fouettant.","Versez la vinaigrette sur les lentilles encore tièdes : c'est tiède qu'elles absorbent le mieux l'assaisonnement.","Ajoutez l'échalote, l'oignon rouge et les dés de carotte crue, puis mélangez.","Parsemez de persil ciselé et servez tiède ou froid."]},
  {id:"wings",nom:"Ailes de poulet croustillantes",emoji:"🍗",cat:"Apéro",prep:15,cuisson:38,portions:4,diff:"Facile",
   ing:[{q:1,u:"kg",n:"ailes de poulet"},{q:2,u:"c. à soupe",n:"huile"},{q:1,u:"c. à soupe",n:"paprika"},{q:1,u:"c. à café",n:"ail en poudre"},{q:1,u:"c. à soupe",n:"miel"},{q:2,u:"c. à soupe",n:"sauce soja"},{q:1,u:"pincée",n:"sel"},{q:1,u:"pincée",n:"poivre"}],
   etapes:["Préchauffez le four à 200°C (th. 6-7).","Séchez soigneusement les ailes avec du papier absorbant. C'est l'humidité de surface qui empêche la peau de croustiller.","Dans un saladier, mélangez les ailes avec l'huile, le paprika, l'ail en poudre, du sel et du poivre. Massez-les pour bien les enrober.","Disposez-les sur une plaque avec du papier cuisson, en une seule couche et bien espacées.","Enfournez 20 min.","Retournez les ailes et poursuivez 15 min : la peau doit être dorée et croustillante.","Pendant ce temps, mélangez le miel et la sauce soja dans un bol.","Sortez la plaque, badigeonnez les ailes de ce mélange et remettez 3 min pour les laquer.","Vérifiez la cuisson : la chair doit se détacher facilement de l'os.","Servez très chaud, avec une sauce au yaourt à côté."]},
  {id:"chipslegumes",nom:"Chips de légumes",emoji:"🥔",cat:"Apéro",prep:15,cuisson:25,portions:4,diff:"Facile",
   ing:[{q:2,u:"",n:"betteraves"},{q:2,u:"",n:"carottes"},{q:1,u:"",n:"patate douce"},{q:3,u:"c. à soupe",n:"huile d'olive"},{q:1,u:"pincée",n:"paprika"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 160°C (th. 5-6). Une température douce est indispensable : plus chaud, les chips brûlent avant de sécher.","Épluchez tous les légumes.","Taillez-les en rondelles très fines, idéalement à la mandoline. Plus c'est fin, plus c'est croustillant.","Étalez les rondelles sur du papier absorbant et épongez-les bien.","Mettez-les dans un saladier, versez l'huile d'olive, le sel et le paprika, puis mélangez à la main.","Disposez-les sur une plaque avec du papier cuisson, en une seule couche sans qu'elles se chevauchent.","Enfournez 15 min.","Retournez les rondelles une à une et poursuivez 10 min, en surveillant : les bords se recroquevillent et brunissent vite.","Sortez au fur et à mesure les chips déjà dorées, toutes ne cuisent pas à la même vitesse.","Laissez-les refroidir complètement sur une grille : c'est en refroidissant qu'elles deviennent croustillantes."]},
  {id:"gougeres",nom:"Gougères au fromage",emoji:"🧀",cat:"Apéro",prep:20,cuisson:25,portions:6,diff:"Moyen",
   ing:[{q:25,u:"cl",n:"eau"},{q:100,u:"g",n:"beurre"},{q:150,u:"g",n:"farine"},{q:4,u:"",n:"œufs"},{q:120,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"muscade"},{q:1,u:"pincée",n:"sel"}],
   etapes:["Préchauffez le four à 180°C (th. 6) et tapissez une plaque de papier cuisson.","Dans une casserole, portez à ébullition l'eau, le beurre coupé en morceaux et le sel.","Hors du feu, versez la farine d'un seul coup et mélangez énergiquement à la cuillère en bois.","Remettez sur feu doux et remuez 2 min : la pâte se détache des parois et forme une boule. C'est ce qui la dessèche et la fait gonfler ensuite.","Débarrassez la pâte dans un saladier et laissez tiédir 5 min. Trop chaude, elle cuirait les œufs.","Incorporez les œufs un par un, en mélangeant bien après chaque ajout. La pâte doit devenir lisse et former un ruban qui retombe lentement.","Ajoutez les trois quarts du gruyère et la muscade, puis mélangez.","Déposez des petits tas de pâte de la taille d'une noix sur la plaque, bien espacés.","Parsemez du reste de gruyère et enfournez 25 min sans jamais ouvrir la porte : un courant d'air les ferait retomber.","Les gougères doivent être bien dorées et légères. Servez tièdes."]},
  {id:"cakesale",nom:"Cake salé olives et lardons",emoji:"🫒",cat:"Apéro",prep:15,cuisson:45,portions:6,diff:"Facile",
   ing:[{q:200,u:"g",n:"farine"},{q:1,u:"sachet",n:"levure chimique"},{q:3,u:"",n:"œufs"},{q:10,u:"cl",n:"huile"},{q:12,u:"cl",n:"lait"},{q:200,u:"g",n:"lardons"},{q:100,u:"g",n:"olives vertes"},{q:100,u:"g",n:"gruyère râpé"},{q:1,u:"pincée",n:"poivre"}],
