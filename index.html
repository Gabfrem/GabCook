<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF5E6" />
    <title>Yummly — cuisine avec ce que tu as</title>
    <meta name="description" content="Des centaines de recettes avec photos, ton frigo, ta liste de courses et le planning de ta semaine. Yummly te dit quoi cuisiner avec ce que tu as." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yummly" />
    <meta property="og:title" content="Yummly — cuisine avec ce que tu as" />
    <meta property="og:description" content="Recettes, frigo, courses et planning de la semaine." />
    <meta property="og:image" content="https://yummly.fr/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Yummly" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      /* thème appliqué avant l'affichage : pas de flash clair en mode sombre */
      try {
        var t = JSON.parse(localStorage.getItem("gabcook_theme") || "null");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#101814");
      } catch (e) {}
    </script>
    <style>
      /* écran de démarrage, avant le chargement des styles */
      html,body{margin:0;background:#FBF5E6}
      @media (prefers-color-scheme:dark){html:not([data-theme=light]),html:not([data-theme=light]) body{background:#0f1713}}
      html[data-theme=dark],html[data-theme=dark] body{background:#0f1713}
      #boot{position:fixed;inset:0;display:grid;place-items:center}
      #boot img{width:84px;height:84px;border-radius:20px;animation:b 1.2s ease-in-out infinite}
      @keyframes b{50%{transform:scale(.94);opacity:.8}}
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><img src="/icons/icon-192.png" alt="Yummly" /></div></div>
    <noscript>Yummly a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
